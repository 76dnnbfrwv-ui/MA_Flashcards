                {id:"7-5",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Idle time</span><span class=\"hint-text\">（停工时间）</span>是员工<span class=\"blank\" onclick=\"revealBlank(this)\">doing nothing</span><span class=\"hint-text\">（无所事事）</span>的时间，通常由于机器故障或缺乏工作等不可控原因造成。",explanation:{title:"停工时间",content:"停工期间员工仍需获得报酬，这是一种成本。",analogy:"就像等待原材料到货而无法工作的时间。"}},
                {id:"7-6",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Minimum wages</span><span class=\"hint-text\">（最低工资）</span>是法律规定的员工应获得的<span class=\"blank\" onclick=\"revealBlank(this)\">minimum payment</span><span class=\"hint-text\">（最低报酬）</span>。",explanation:{title:"最低工资",content:"如果按工时或计件计算的工资低于最低工资，应按最低工资标准支付。",analogy:"就像国家规定的最低工资标准。"}},
                {id:"7-7",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Basic rate per hour</span><span class=\"hint-text\">（每小时基本工资率）</span>是员工工作<span class=\"blank\" onclick=\"revealBlank(this)\">basic hours</span><span class=\"hint-text\">（基本工时）</span>所获得的报酬标准。",explanation:{title:"基本工资率",content:"正常工作时间内的工资标准。",analogy:"就像正常工作时间的时薪。"}},
                {id:"7-8",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct labour</span><span class=\"hint-text\">（直接人工）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">directly engaged in manufacturing</span><span class=\"hint-text\">（直接参与制造产品）</span>的员工。",explanation:{title:"直接人工",content:"直接人工成本可以追溯到具体产品。",analogy:"就像生产线上的装配工人。"}},
                {id:"7-9",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Indirect labour</span><span class=\"hint-text\">（间接人工）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">not directly engaged</span><span class=\"hint-text\">（不直接参与）</span>实际制造工作的员工。",explanation:{title:"间接人工",content:"间接人工成本不能直接追溯到具体产品。",analogy:"就像仓库管理员、维修工人。"}},
                {id:"7-10",category:"直接间接人工",question:"直接工人的加班可分为<span class=\"blank\" onclick=\"revealBlank(this)\">general overtime</span><span class=\"hint-text\">（一般加班）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">special overtime</span><span class=\"hint-text\">（特定加班）</span>。",explanation:{title:"加班分类",content:"一般加班的加班费属于间接成本，特定加班的加班费属于直接成本。",analogy:"为了特定订单加班是特定加班，为了赶进度加班是一般加班。"}},
                {id:"7-11",category:"直接间接人工",question:"一般加班的加班津贴属于<span class=\"blank\" onclick=\"revealBlank(this)\">indirect cost</span><span class=\"hint-text\">（间接成本）</span>，因为它不是<span class=\"blank\" onclick=\"revealBlank(this)\">specific</span><span class=\"hint-text\">（特定）</span>为某个产品而加班。",explanation:{title:"一般加班成本分类",content:"加班津贴无论直接工还是间接工，都算间接成本。",analogy:"为了赶进度而加班的成本应该分摊到所有产品。"}},
                {id:"7-12",category:"直接间接人工",question:"特定加班的基础工资属于<span class=\"blank\" onclick=\"revealBlank(this)\">direct cost</span><span class=\"hint-text\">（直接成本）</span>，加班津贴也属于<span class=\"blank\" onclick=\"revealBlank(this)\">direct cost</span><span class=\"hint-text\">（直接成本）</span>。",explanation:{title:"特定加班成本分类",content:"为了特定订单而加班的成本可以直接追溯到该订单。",analogy:"为了赶客户的急单而加班的成本应该由这个客户承担。"}},
                {id:"7-13",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Idle time cost</span><span class=\"hint-text\">（停工时间成本）</span>属于<span class=\"blank\" onclick=\"revealBlank(this)\">indirect cost</span><span class=\"hint-text\">（间接成本）</span>，因为它是管理层责任导致的成本。",explanation:{title:"停工成本分类",content:"停工通常是管理问题，如机器故障，因此算间接成本。",analogy:"机器坏了导致工人等待，这个成本不能让产品承担。"}},
                {id:"7-14",category:"人工周转率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Labour turnover</span><span class=\"hint-text\">（人工周转率）</span>是评估人员离开对<span class=\"blank\" onclick=\"revealBlank(this)\">business operation</span><span class=\"hint-text\">（企业经营）</span>净影响的指标。",explanation:{title:"人工周转率",content:"人工周转率 = 需要替换的离职人数 / 平均员工人数。",analogy:"就像员工的流动比率，反映公司留人的能力。"}},
                {id:"7-15",category:"人工周转率",question:"人工周转率的计算公式：<span class=\"blank\" onclick=\"revealBlank(this)\">No. of leavers who require replacement</span><span class=\"hint-text\">（需要替换的离职人数）</span> ÷ <span class=\"blank\" onclick=\"revealBlank(this)\">Average No. of employees</span><span class=\"hint-text\">（平均员工人数）</span>。",explanation:{title:"人工周转率公式",content:"只计算需要替换的离职，不包括自然离职。",analogy:"计算实际离开并需要招人替代的比例。"}},
                {id:"7-16",category:"人工周转率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Preventative cost</span><span class=\"hint-text\">（预防成本）</span>是用于维持<span class=\"blank\" onclick=\"revealBlank(this)\">good relationships</span><span class=\"hint-text\">（良好关系）</span>的成本，如医疗服务和福利设施。",explanation:{title:"预防成本",content:"为了防止员工离职而投入的成本。",analogy:"就像公司提供健身设施、员工活动来提升员工满意度。"}},
                {id:"7-17",category:"人工周转率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Replacement cost</span><span class=\"hint-text\">（替换成本）</span>是招聘、<span class=\"blank\" onclick=\"revealBlank(this)\">placement and training</span><span class=\"hint-text\">（安置和培训）</span>新员工的成本。",explanation:{title:"替换成本",content:"员工离职后重新招人的成本。",analogy:"招聘广告费、面试成本、培训新员工的时间和精力。"}},
                {id:"7-18",category:"人工周转率",question:"人工周转率的原因可分为<span class=\"blank\" onclick=\"revealBlank(this)\">controllable factors</span><span class=\"hint-text\">（可控因素）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">uncontrollable factors</span><span class=\"hint-text\">（不可控因素）</span>。",explanation:{title:"离职原因分类",content:"可控因素如工资低、工作无聊；不可控因素如疾病、家庭搬迁。",analogy:"工作压力大是可控的，天气不好是不可控的。"}},
                {id:"7-19",category:"效率比率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Efficiency ratio</span><span class=\"hint-text\">（效率比率）</span>= 标准工时 / <span class=\"blank\" onclick=\"revealBlank(this)\">Actual hours taken</span><span class=\"hint-text\">（实际工时）</span> × 100%。",explanation:{title:"效率比率",content:"衡量员工工作的效率，100%以上表示高于标准效率。",analogy:"就像跑步比赛，看你比标准速度快还是慢。"}},
                {id:"7-20",category:"效率比率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Capacity ratio</span><span class=\"hint-text\">（产能比率）</span>= <span class=\"blank\" onclick=\"revealBlank(this)\">Actual hours taken</span><span class=\"hint-text\">（实际工时）</span> / 预算工时 × 100%。",explanation:{title:"产能比率",content:"衡量实际使用产能与预算产能的比例。",analogy:"就像你实际工作了多少小时，占计划的多少比例。"}},
                {id:"7-21",category:"效率比率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Production volume ratio</span><span class=\"hint-text\">（产量比率）</span>= 标准工时 / <span class=\"blank\" onclick=\"revealBlank(this)\">Budget hours</span><span class=\"hint-text\">（预算工时）</span> × 100%。",explanation:{title:"产量比率",content:"衡量实际产量与预算产量的关系。",analogy:"完成了多少计划产量。"}},
                {id:"7-22",category:"效率比率",question:"三个比率的关系是：<span class=\"blank\" onclick=\"revealBlank(this)\">PV ratio</span><span class=\"hint-text\">（产量比率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Efficiency ratio</span><span class=\"hint-text\">（效率比率）</span> × <span class=\"blank\" onclick=\"revealBlank(this)\">Capacity ratio</span><span class=\"hint-text\">（产能比率）</span>。",explanation:{title:"比率关系",content:"PV = E × C，三个比率相互关联。",analogy:"就像三角形的边长关系。"}},
                {id:"7-23",category:"效率比率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard hours</span><span class=\"hint-text\">（标准工时）</span>是生产实际产量应该需要的<span class=\"blank\" onclick=\"revealBlank(this)\">expected time</span><span class=\"hint-text\">（预期时间）</span>。",explanation:{title:"标准工时",content:"根据标准时间允许计算的工时。",analogy:"根据经验，完成100个产品通常需要多少小时。"}},
                {id:"7-24",category:"分录处理",question:"支付工资的分录：借记<span class=\"blank\" onclick=\"revealBlank(this)\">Wages</span><span class=\"hint-text\">（工资）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Cost control a/c</span><span class=\"hint-text\">（成本控制账户）</span>。",explanation:{title:"工资支付分录",content:"工资先计入工资账户。",analogy:"就像先把钱从银行取出来准备发工资。"}},
                {id:"7-25",category:"分录处理",question:"分配工资的分录：直接工人工资借记<span class=\"blank\" onclick=\"revealBlank(this)\">WIP</span><span class=\"hint-text\">（在产品）</span>，间接人工成本借记<span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（生产成本）</span>或非生产成本。",explanation:{title:"工资分配分录",content:"将工资分配到相应的成本中心。",analogy:"把工资分摊到各个产品或部门。"}},
                {id:"7-26",category:"分录处理",question:"工资分配的最终分录：贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Wages</span><span class=\"hint-text\">（工资账户）</span>，将<span class=\"blank\" onclick=\"revealBlank(this)\">direct and indirect costs</span><span class=\"hint-text\">（直接和间接成本）</span>分配完毕。",explanation:{title:"工资分配完成",content:"工资账户的余额变为零。",analogy:"发完工资后，工资账户就平了。"}},
                {id:"7-27",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Holiday pay</span><span class=\"hint-text\">（假期工资）</span>属于<span class=\"blank\" onclick=\"revealBlank(this)\">indirect cost</span><span class=\"hint-text\">（间接成本）</span>，因为它与生产产品无直接关系。",explanation:{title:"假期工资分类",content:"病假、假期等支付的工资都是间接成本。",analogy:"员工休假时也要发工资，但这不是直接为产品工作的。"}},
                {id:"7-28",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sick pay</span><span class=\"hint-text\">（病假工资）</span>属于<span class=\"blank\" onclick=\"revealBlank(this)\">indirect cost</span><span class=\"hint-text\">（间接成本）</span>，因为员工没有<span class=\"blank\" onclick=\"revealBlank(this)\">working</span><span class=\"hint-text\">（工作）</span>。",explanation:{title:"病假工资分类",content:"员工生病请假没工作，但公司仍需支付工资。",analogy:"就像请病假的员工虽然没来，但工资照发。"}},
                {id:"7-29",category:"直接间接人工",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Shift allowance</span><span class=\"hint-text\">（班次津贴）</span>属于<span class=\"blank\" onclick=\"revealBlank(this)\">indirect cost</span><span class=\"hint-text\">（间接成本）</span>，因为它是对<span class=\"blank\" onclick=\"revealBlank(this)\">non-standard hours</span><span class=\"hint-text\">（非标准工作时间）</span>的补偿。",explanation:{title:"班次津贴分类",content:"夜班、周末班等额外支付的津贴属于间接成本。",analogy:"夜班比白班多拿的钱。"}},
                {id:"7-30",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Time saved bonus</span><span class=\"hint-text\">（时间节省奖金）</span>的计算公式：<span class=\"blank\" onclick=\"revealBlank(this)\">Time saved hours</span><span class=\"hint-text\">（节省的时间）</span> × 奖金工资率。",explanation:{title:"时间节省奖金",content:"提前完成任务节省的时间按比率给予奖励。",analogy:"就像规定时间内完成工作，节省的时间可以换取奖金。"}}
            ]},
            {chapter:"8",name:"Chapter 8 制造费用会计",categories:["直接间接费用","吸收成本法","分配与分摊","服务部门分摊","吸收率","少吸收多吸收","分录处理"],cards:[
                {id:"8-1",category:"直接间接费用",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct expenses</span><span class=\"hint-text\">（直接费用）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">directly attributable</span><span class=\"hint-text\">（可直接归属）</span>于特定成本单位的费用。",explanation:{title:"直接费用",content:"可以直接追溯到具体产品或服务的费用。",analogy:"就像为了某个特定项目而专门购买的原材料。"}},
                {id:"8-2",category:"直接间接费用",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Indirect expenses</span><span class=\"hint-text\">（间接费用）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">not directly attributable</span><span class=\"hint-text\">（不能直接归属）</span>于特定成本单位的费用，需要分配。",explanation:{title:"间接费用",content:"不能直接追溯到具体产品，需要分摊。",analogy:"就像工厂的租金，无法直接算到某个产品上。"}},
                {id:"8-3",category:"直接间接费用",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Prime costs</span><span class=\"hint-text\">（主要成本）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">direct material + direct labour + direct expenses</span><span class=\"hint-text\">（直接材料+直接人工+直接费用）</span>的总和。",explanation:{title:"主要成本",content:"构成产品直接成本的所有要素。",analogy:"就像做一道菜的面料、肉和调料的成本。"}},
                {id:"8-4",category:"吸收成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Absorption costing</span><span class=\"hint-text\">（吸收成本法）</span>是将<span class=\"blank\" onclick=\"revealBlank(this)\">direct costs</span><span class=\"hint-text\">（直接成本）</span>和公平份额的<span class=\"blank\" onclick=\"revealBlank(this)\">overhead costs</span><span class=\"hint-text\">（制造费用）</span>结合的方法。",explanation:{title:"吸收成本法",content:"确保所有成本都被产品吸收的方法。",analogy:"就像把所有成本（包括水电费）都算进产品价格。"}},
                {id:"8-5",category:"吸收成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Production overhead</span><span class=\"hint-text\">（制造费用）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">indirect production costs</span><span class=\"hint-text\">（间接生产成本）</span>，如工厂租金和机器折旧。",explanation:{title:"制造费用",content:"生产过程中产生的间接成本。",analogy:"就像工厂的电费、机器维修费。"}},
                {id:"8-6",category:"吸收成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-production overhead</span><span class=\"hint-text\">（非制造费用）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">not related to production</span><span class=\"hint-text\">（与生产无关）</span>的费用，如行政费用和销售费用。",explanation:{title:"非制造费用",content:"发生在生产过程之外的费用。",analogy:"就像公司的广告费、办公费用。"}},
                {id:"8-7",category:"分配与分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Allocation</span><span class=\"hint-text\">（分配）</span>是将<span class=\"blank\" onclick=\"revealBlank(this)\">whole cost</span><span class=\"hint-text\">（全部成本）</span>直接分配给特定成本中心。",explanation:{title:"分配",content:"直接归属到某个部门的成本。",analogy:"就像直接把这笔钱记到某个部门的账上。"}},
                {id:"8-8",category:"分配与分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Apportionment</span><span class=\"hint-text\">（分摊）</span>是将<span class=\"blank\" onclick=\"revealBlank(this)\">general costs</span><span class=\"hint-text\">（一般成本）</span>按<span class=\"blank\" onclick=\"revealBlank(this)\">fair basis</span><span class=\"hint-text\">（公平基础）</span>分摊到各成本中心。",explanation:{title:"分摊",content:"无法直接分配的成本需要按比例分摊。",analogy:"就像按面积分摊办公室租金。"}},
                {id:"8-9",category:"分配与分摊",question:"租金和 rates的分摊基础是<span class=\"blank\" onclick=\"revealBlank(this)\">floor area</span><span class=\"hint-text\">（占地面积）</span>。",explanation:{title:"租金分摊基础",content:"按平方米分摊工厂租金。",analogy:"租房子按面积大小分摊租金。"}},
                {id:"8-10",category:"分配与分摊",question:"机器折旧和保险的分摊基础是<span class=\"blank\" onclick=\"revealBlank(this)\">cost or book value of equipment</span><span class=\"hint-text\">（设备成本或账面价值）</span>。",explanation:{title:"设备相关成本分摊",content:"按设备价值比例分摊折旧和保险。",analogy:"设备越贵，分摊的费用越多。"}},
                {id:"8-11",category:"分配与分摊",question:"办公室、食堂、福利设施的分摊基础是<span class=\"blank\" onclick=\"revealBlank(this)\">number of employees</span><span class=\"hint-text\">（员工人数）</span>。",explanation:{title:"员工相关成本分摊",content:"按员工人数比例分摊福利费用。",analogy:"部门人越多，分摊的福利费越多。"}},
                {id:"8-12",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Production cost centre</span><span class=\"hint-text\">（生产成本中心）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">directly involved in production</span><span class=\"hint-text\">（直接参与生产）</span>的部门，如加工部门和装配部门。",explanation:{title:"生产成本中心",content:"直接制造产品的部门。",analogy:"就像生产线上的车间。"}},
                {id:"8-13",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Service cost centre</span><span class=\"hint-text\">（服务成本中心）</span>是为<span class=\"blank\" onclick=\"revealBlank(this)\">production departments</span><span class=\"hint-text\">（生产成本中心）</span>提供服务的部门，如仓库和维护部门。",explanation:{title:"服务成本中心",content:"不直接生产，但为生产服务。",analogy:"就像工厂的后勤部门。"}},
                {id:"8-14",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Reapportionment</span><span class=\"hint-text\">（重分配）</span>是将服务成本中心的成本<span class=\"blank\" onclick=\"revealBlank(this)\">transferred</span><span class=\"hint-text\">（转移）</span>到生产成本中心的过程。",explanation:{title:"重分配",content:"把服务部门的费用转给生产部门。",analogy:"就像把仓库的管理费用分摊到各个生产车间。"}},
                {id:"8-15",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct method</span><span class=\"hint-text\">（直接法）</span>假设服务成本中心只为<span class=\"blank\" onclick=\"revealBlank(this)\">production cost centres</span><span class=\"hint-text\">（生产成本中心）</span>提供服务，不互相服务。",explanation:{title:"直接法",content:"最简单的服务部门成本分配方法。",analogy:"服务部门只服务于生产部门。"}},
                {id:"8-16",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Step down method</span><span class=\"hint-text\">（逐步法）</span>假设服务成本中心为<span class=\"blank\" onclick=\"revealBlank(this)\">other service cost centres</span><span class=\"hint-text\">（其他服务成本中心）</span>提供服务，但服务不相互往来。",explanation:{title:"逐步法",content:"按顺序分配，先分配给其他服务部门，再给生产部门。",analogy:"先照顾其他服务部门，最后给生产部门。"}},
                {id:"8-17",category:"服务部门分摊",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Reciprocal method</span><span class=\"hint-text\">（交互分配法）</span>假设服务成本中心相互提供服务，且服务<span class=\"blank\" onclick=\"revealBlank(this)\">is reciprocated</span><span class=\"hint-text\">（是相互的）</span>。",explanation:{title:"交互分配法",content:"最准确的方法，考虑服务部门之间的相互服务。",analogy:"仓库和维修部门互相帮忙，都要算进去。"}},
                {id:"8-18",category:"吸收率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Pre-determined OAR</span><span class=\"hint-text\">（预定制造费用吸收率）</span>= 总预算制造费用 / <span class=\"blank\" onclick=\"revealBlank(this)\">total budget activity level</span><span class=\"hint-text\">（总预算活动水平）</span>。",explanation:{title:"预定OAR",content:"在期初确定的制造费用分配率。",analogy:"就像预算时算好每个工时要分摊多少制造费用。"}},
                {id:"8-19",category:"吸收率",question:"制造费用吸收的基础可以是<span class=\"blank\" onclick=\"revealBlank(this)\">units</span><span class=\"hint-text\">（单位）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">direct labour hours</span><span class=\"hint-text\">（直接人工小时）</span>或<span class=\"blank\" onclick=\"revealBlank(this)\">machine hours</span><span class=\"hint-text\">（机器小时）</span>。",explanation:{title:"吸收基础",content:"根据实际情况选择合适的分配基础。",analogy:"根据工时或机器运转时间来分配费用。"}},
                {id:"8-20",category:"吸收率",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Overhead absorbed</span><span class=\"hint-text\">（已吸收制造费用）</span>= <span class=\"blank\" onclick=\"revealBlank(this)\">OAR × Actual activity level</span><span class=\"hint-text\">（OAR × 实际活动水平）</span>。",explanation:{title:"已吸收制造费用",content:"根据实际工作量计算的已分配费用。",analogy:"根据实际工时乘以每工时分摊率。"}},
                {id:"8-21",category:"少吸收多吸收",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Over-absorbed</span><span class=\"hint-text\">（多吸收）</span>是指已吸收费用<span class=\"blank\" onclick=\"revealBlank(this)\">exceeds actual expenditure</span><span class=\"hint-text\">（超过实际支出）</span>。",explanation:{title:"多吸收",content:"实际费用比预算少，产品分摊的费用就多了。",analogy:"收了太多钱，要退回去一些。"}},
                {id:"8-22",category:"少吸收多吸收",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Under-absorbed</span><span class=\"hint-text\">（少吸收）</span>是指已吸收费用<span class=\"blank\" onclick=\"revealBlank(this)\">less than actual expenditure</span><span class=\"hint-text\">（少于实际支出）</span>。",explanation:{title:"少吸收",content:"实际费用比预算多，产品分摊的费用不够。",analogy:"收了不够的钱，还需要补收。"}},
                {id:"8-23",category:"少吸收多吸收",question:"多吸收的影响：<span class=\"blank\" onclick=\"revealBlank(this)\">profit increases</span><span class=\"hint-text\">（利润增加）</span>，因为产品成本被<span class=\"blank\" onclick=\"revealBlank(this)\">understated</span><span class=\"hint-text\">（低估）</span>。",explanation:{title:"多吸收对利润的影响",content:"少计成本，利润虚增。",analogy:"少算成本，利润看起来就高了。"}},
                {id:"8-24",category:"少吸收多吸收",question:"少吸收的影响：<span class=\"blank\" onclick=\"revealBlank(this)\">profit decreases</span><span class=\"hint-text\">（利润减少）</span>，因为产品成本被<span class=\"blank\" onclick=\"revealBlank(this)\">overstated</span><span class=\"hint-text\">（高估）</span>。",explanation:{title:"少吸收对利润的影响",content:"多计成本，利润虚减。",analogy:"多算成本，利润看起来就低了。"}},
                {id:"8-25",category:"分录处理",question:"发生制造费用时分录：借记<span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（制造费用）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Cost control a/c</span><span class=\"hint-text\">（成本控制账户）</span>。",explanation:{title:"费用发生分录",content:"确认制造费用的发生。",analogy:"工厂的各项费用支出记账。"}},
                {id:"8-26",category:"分录处理",question:"吸收制造费用时分录：借记<span class=\"blank\" onclick=\"revealBlank(this)\">WIP</span><span class=\"hint-text\">（在产品）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（制造费用）</span>。",explanation:{title:"费用吸收分录",content:"把制造费用分配到产品成本中。",analogy:"把电费分摊到每个产品上。"}},
                {id:"8-27",category:"分录处理",question:"多吸收时分录：借记<span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（制造费用）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">I/S</span><span class=\"hint-text\">（损益表）</span>，增加利润。",explanation:{title:"多吸收处理",content:"多吸收的费用要转回利润表增加利润。",analogy:"多收的钱要转成利润。"}},
                {id:"8-28",category:"分录处理",question:"少吸收时分录：借记<span class=\"blank\" onclick=\"revealBlank(this)\">I/S</span><span class=\"hint-text\">（损益表）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（制造费用）</span>，减少利润。",explanation:{title:"少吸收处理",content:"少吸收的费用要转出利润表减少利润。",analogy:"少收的钱要从利润中扣除。"}},
                {id:"8-29",category:"吸收成本法",question:"完全成本 = <span class=\"blank\" onclick=\"revealBlank(this)\">Direct material</span><span class=\"hint-text\">（直接材料）</span> + 直接人工 + 直接费用 + <span class=\"blank\" onclick=\"revealBlank(this)\">Production OH</span><span class=\"hint-text\">（制造费用）</span>。",explanation:{title:"完全成本构成",content:"产品成本包括所有直接成本和制造费用。",analogy:"把所有的生产成本加在一起就是产品成本。"}},
                {id:"8-30",category:"吸收成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost per unit</span><span class=\"hint-text\">（单位成本）</span>= 直接材料 + 直接人工 + 直接费用 + <span class=\"blank\" onclick=\"revealBlank(this)\">OH per unit</span><span class=\"hint-text\">（单位制造费用）</span>。",explanation:{title:"单位成本计算",content:"每个产品应分摊的成本。",analogy:"每个产品的成本 = 料、工、费相加。"}}
            ]},
            {chapter:"9",name:"Chapter 9 吸收与边际成本法",categories:["边际贡献","吸收成本法","边际成本法","利润差异","优缺点"],cards:[
                {id:"9-1",category:"边际贡献",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Contribution</span><span class=\"hint-text\">（边际贡献）</span>的计算公式：<span class=\"blank\" onclick=\"revealBlank(this)\">Sales revenue - Variable costs</span><span class=\"hint-text\">（销售收入 - 变动成本）</span>。",explanation:{title:"边际贡献定义",content:"边际贡献是销售收入减去变动成本后的余额，用于补偿固定成本和形成利润。",analogy:"就像你卖东西的收入减去成本，剩下的就是贡献。"}},
                {id:"9-2",category:"边际贡献",question:"边际贡献是<span class=\"blank\" onclick=\"revealBlank(this)\">contribution to fixed costs and profits</span><span class=\"hint-text\">（对固定成本和利润的贡献）</span>的缩写。",explanation:{title:"边际贡献含义",content:"这个名字说明了贡献的用途：先补偿固定成本，剩下的才是利润。",analogy:"就像先还贷款，剩下的才是你的。"}},
                {id:"9-3",category:"边际贡献",question:"对于管理决策，边际贡献比<span class=\"blank\" onclick=\"revealBlank(this)\">profit</span><span class=\"hint-text\">（利润）</span>更适用，因为<span class=\"blank\" onclick=\"revealBlank(this)\">fixed costs</span><span class=\"hint-text\">（固定成本）</span>通常被视为沉没成本。",explanation:{title:"边际贡献的决策作用",content:"边际贡献帮助管理层了解每个产品对企业的贡献，更适合做决策。",analogy:"做决策时要考虑未来能赚多少，而不是已经花掉的钱。"}},
                {id:"9-4",category:"边际贡献",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variable costs</span><span class=\"hint-text\">（变动成本）</span>比利润更适合用于决策，因为它们是<span class=\"blank\" onclick=\"revealBlank(this)\">future oriented</span><span class=\"hint-text\">（面向未来的）</span>。",explanation:{title:"变动成本的决策价值",content:"做决策时要考虑未来会发生的成本，而不是已经固定的成本。",analogy:"就像计划下一步要花多少钱，而不是已经花了多少。"}},
                {id:"9-5",category:"吸收成本法",question:"在<span class=\"blank\" onclick=\"revealBlank(this)\">Absorption costing</span><span class=\"hint-text\">（吸收成本法）</span>中，<span class=\"blank\" onclick=\"revealBlank(this)\">fixed production overheads</span><span class=\"hint-text\">（固定制造费用）</span>被吸收到成本单位中。",explanation:{title:"吸收成本法特点",content:"把固定制造费用分摊到每个产品中。",analogy:"把工厂的固定成本分摊到每个产品上。"}},
                {id:"9-6",category:"吸收成本法",question:"在吸收成本法中，库存按<span class=\"blank\" onclick=\"revealBlank(this)\">absorption cost</span><span class=\"hint-text\">（完全成本）</span>计价，包括<span class=\"blank\" onclick=\"revealBlank(this)\">variable and fixed costs</span><span class=\"hint-text\">（变动成本和固定成本）</span>。",explanation:{title:"吸收成本法库存计价",content:"库存价值包括所有的生产成本。",analogy:"库存的产品要包含所有的料、工、费。"}},
                {id:"9-7",category:"吸收成本法",question:"吸收成本法的利润表结构：销售收入 → <span class=\"blank\" onclick=\"revealBlank(this)\">Gross profit</span><span class=\"hint-text\">（毛利润）</span> → 调整多/少吸收 → <span class=\"blank\" onclick=\"revealBlank(this)\">Revised gross profit</span><span class=\"hint-text\">（调整后毛利润）</span> → 减去非生产成本 → 净利润。",explanation:{title:"吸收成本法利润表",content:"先计算毛利润，再调整制造费用的差异。",analogy:"先算主营业务利润，再加减其他费用。"}},
                {id:"9-8",category:"吸收成本法",question:"吸收成本法中，期初库存按<span class=\"blank\" onclick=\"revealBlank(this)\">full production cost</span><span class=\"hint-text\">（完全生产成本）</span>计价。",explanation:{title:"期初库存计价",content:"吸收成本法下，期初和期末库存都按完全成本计价。",analogy:"库存的进价要包含所有生产成本。"}},
                {id:"9-9",category:"边际成本法",question:"在<span class=\"blank\" onclick=\"revealBlank(this)\">Marginal costing</span><span class=\"hint-text\">（边际成本法）</span>中，<span class=\"blank\" onclick=\"revealBlank(this)\">fixed production overheads</span><span class=\"hint-text\">（固定制造费用）</span>不被吸收到成本单位中。",explanation:{title:"边际成本法特点",content:"固定制造费用直接作为期间费用处理，不分摊到产品。",analogy:"固定成本就像管理费用一样当期扣除。"}},
                {id:"9-10",category:"边际成本法",question:"在边际成本法中，库存按<span class=\"blank\" onclick=\"revealBlank(this)\">marginal/variable cost</span><span class=\"hint-text\">（边际/变动成本）</span>计价，只包括<span class=\"blank\" onclick=\"revealBlank(this)\">variable costs</span><span class=\"hint-text\">（变动成本）</span>。",explanation:{title:"边际成本法库存计价",content:"库存价值只包括变动生产成本，不包括固定成本。",analogy:"库存只算变动成本，固定成本当期就扣掉了。"}},
                {id:"9-11",category:"边际成本法",question:"边际成本法的利润表结构：销售收入 → 减去<span class=\"blank\" onclick=\"revealBlank(this)\">variable cost of sales</span><span class=\"hint-text\">（销售变动成本）</span> → <span class=\"blank\" onclick=\"revealBlank(this)\">Contribution</span><span class=\"hint-text\">（边际贡献）</span> → 减去<span class=\"blank\" onclick=\"revealBlank(this)\">fixed costs</span><span class=\"hint-text\">（固定成本）</span> → 净利润。",explanation:{title:"边际成本法利润表",content:"先计算边际贡献，再减去固定成本得到净利润。",analogy:"先算贡献，再扣固定成本得到利润。"}},
                {id:"9-12",category:"边际成本法",question:"边际成本法下，固定制造费用作为<span class=\"blank\" onclick=\"revealBlank(this)\">period costs</span><span class=\"hint-text\">（期间成本）</span>处理，直接在<span class=\"blank\" onclick=\"revealBlank(this)\">Income Statement</span><span class=\"hint-text\">（损益表）</span>中扣除。",explanation:{title:"固定制造费用的处理",content:"固定费用不计入产品成本，直接从当期利润中扣除。",analogy:"固定成本就像房租一样当期费用化。"}},
                {id:"9-13",category:"利润差异",question:"两种方法利润差异 = <span class=\"blank\" onclick=\"revealBlank(this)\">Change in stock</span><span class=\"hint-text\">（库存变动）</span> × <span class=\"blank\" onclick=\"revealBlank(this)\">OAR/unit</span><span class=\"hint-text\">（单位制造费用吸收率）</span>。",explanation:{title:"利润差异公式",content:"利润差异取决于库存水平的变动。",analogy:"库存多时，两种方法利润会有差异。"}},
                {id:"9-14",category:"利润差异",question:"当<span class=\"blank\" onclick=\"revealBlank(this)\">stock levels are rising</span><span class=\"hint-text\">（库存水平上升）</span>时，closing > opening，production > sales，<span class=\"blank\" onclick=\"revealBlank(this)\">AC profit > MC profit</span><span class=\"hint-text\">（吸收成本法利润 > 边际成本法利润）</span>。",explanation:{title:"库存上升时的利润差异",content:"库存增加时，吸收成本法把更多固定成本留在库存中，利润更高。",analogy:"产品卖得少但生产多了，固定成本就留在了库存里。"}},
                {id:"9-15",category:"利润差异",question:"当<span class=\"blank\" onclick=\"revealBlank(this)\">stock levels are falling</span><span class=\"hint-text\">（库存水平下降）</span>时，closing < opening，production < sales，<span class=\"blank\" onclick=\"revealBlank(this)\">AC profit < MC profit</span><span class=\"hint-text\">（吸收成本法利润 < 边际成本法利润）</span>。",explanation:{title:"库存下降时的利润差异",content:"库存减少时，吸收成本法要把之前留在库存中的固定成本释放出来，利润更低。",analogy:"卖的是以前生产的便宜库存，固定成本要当期补扣。"}},
                {id:"9-16",category:"利润差异",question:"当<span class=\"blank\" onclick=\"revealBlank(this)\">opening and closing stock levels are the same</span><span class=\"hint-text\">（期初和期末库存水平相同）</span>时，AC profit = MC profit，两种方法利润相等。",explanation:{title:"库存不变时的利润",content:"如果库存没有变化，两种方法算出的利润相同。",analogy:"生产和销售一样多，库存不变，利润就一样。"}},
                {id:"9-17",category:"利润差异",question:"吸收成本法的期末库存成本<span class=\"blank\" onclick=\"revealBlank(this)\">always ></span><span class=\"hint-text\">（总是大于）</span>边际成本法的期末库存成本，因为AC包含VC+FC，MC只包含VC。",explanation:{title:"库存成本差异",content:"吸收成本法的库存成本更高，因为包含了固定成本。",analogy:"完全成本法的库存比变动成本法的库存值钱。"}},
                {id:"9-18",category:"优缺点",question:"吸收成本法的优点：<span class=\"blank\" onclick=\"revealBlank(this)\">fair</span><span class=\"hint-text\">（公平）</span>地在各产品之间分摊固定制造费用。",explanation:{title:"吸收成本法的公平性",content:"每个产品都承担了它应该负担的固定成本。",analogy:"就像每个住客按面积分摊物业费。"}},
                {id:"9-19",category:"优缺点",question:"吸收成本法符合<span class=\"blank\" onclick=\"revealBlank(this)\">IAS 2</span><span class=\"hint-text\">（国际会计准则第2号）</span>对库存计价的要求。",explanation:{title:"IAS 2要求",content:"IAS 2要求库存按完全成本计价，吸收成本法符合这一要求。",analogy:"会计准则规定库存要包含所有生产成本。"}},
                {id:"9-20",category:"优缺点",question:"吸收成本法的缺点：可能需要进行<span class=\"blank\" onclick=\"revealBlank(this)\">reapportionments</span><span class=\"hint-text\">（重分配）</span>，计算更<span class=\"blank\" onclick=\"revealBlank(this)\">complex</span><span class=\"hint-text\">（复杂）</span>。",explanation:{title:"吸收成本法的复杂性",content:"需要分摊服务部门成本到生产成本中心，计算更繁琐。",analogy:"要把各种费用分来分去，计算量大。"}},
                {id:"9-21",category:"优缺点",question:"边际成本法的优点：<span class=\"blank\" onclick=\"revealBlank(this)\">simple to operate</span><span class=\"hint-text\">（简单易行）</span>，因为不需要进行固定成本的分摊。",explanation:{title:"边际成本法的简单性",content:"不需要复杂的费用分摊，计算更直接。",analogy:"直接用变动成本算，简单明了。"}},
                {id:"9-22",category:"优缺点",question:"边际成本法的优点：<span class=\"blank\" onclick=\"revealBlank(this)\">Contribution</span><span class=\"hint-text\">（边际贡献）</span>对管理层<span class=\"blank\" onclick=\"revealBlank(this)\">more helpful</span><span class=\"hint-text\">（更有帮助）</span>，因为它反映了未来预期收益。",explanation:{title:"边际贡献的决策价值",content:"边际贡献帮助管理层了解每个产品能带来多少贡献。",analogy:"看哪个产品贡献大，就多生产哪个。"}},
                {id:"9-23",category:"优缺点",question:"边际成本法的优点：避免了<span class=\"blank\" onclick=\"revealBlank(this)\">over/under absorption</span><span class=\"hint-text\">（多吸收/少吸收）</span>的问题。",explanation:{title:"避免差异调整",content:"边际成本法不吸收固定费用，因此没有多吸收少吸收的问题。",analogy:"不用算来算去，没有差异要调整。"}},
                {id:"9-24",category:"优缺点",question:"边际成本法的缺点：难以确定产品的<span class=\"blank\" onclick=\"revealBlank(this)\">total profitability</span><span class=\"hint-text\">（总盈利能力）</span>。",explanation:{title:"边际成本法的局限性",content:"只显示边际贡献，看不到每个产品分担了多少固定成本。",analogy:"只知道贡献，不知道实际赚了多少钱。"}},
                {id:"9-25",category:"利润差异",question:"利润差异公式：<span class=\"blank\" onclick=\"revealBlank(this)\">(Production units - Sales units)</span><span class=\"hint-text\">（生产量 - 销售量）</span> × <span class=\"blank\" onclick=\"revealBlank(this)\">OAR</span><span class=\"hint-text\">（单位固定费用吸收率）</span>。",explanation:{title:"差异计算",content:"产量大于销量时差异为正，吸收成本法利润更高。",analogy:"多生产少卖，留在库存里的固定成本就多了。"}},
                {id:"9-26",category:"边际成本法",question:"边际成本法下，固定非生产成本包括：固定<span class=\"blank\" onclick=\"revealBlank(this)\">administration costs</span><span class=\"hint-text\">（管理费用）</span>和固定<span class=\"blank\" onclick=\"revealBlank(this)\">selling and distribution costs</span><span class=\"hint-text\">（销售及分销费用）</span>。",explanation:{title:"固定非生产成本",content:"固定的管理和销售费用作为期间费用处理。",analogy:"固定的办公室租金、广告费都要当期扣除。"}},
                {id:"9-27",category:"吸收成本法",question:"吸收成本法中，调整多吸收少吸收后的<span class=\"blank\" onclick=\"revealBlank(this)\">Revised gross profit</span><span class=\"hint-text\">（调整后毛利润）</span>才是真正的毛利润。",explanation:{title:"调整后毛利润",content:"把多吸收少吸收的费用加回到毛利润中。",analogy:"要把多收或少收的钱调整回来。"}},
                {id:"9-28",category:"边际成本法",question:"边际成本法下，<span class=\"blank\" onclick=\"revealBlank(this)\">Total variable cost of sales</span><span class=\"hint-text\">（销售总变动成本）</span>= 期初变动成本 + 本期变动成本 - 期末变动成本。",explanation:{title:"销售变动成本计算",content:"当期卖出的产品承担的变动成本。",analogy:"卖了多少产品，就承担多少变动成本。"}},
                {id:"9-29",category:"利润差异",question:"如果生产量 = 销售量，则<span class=\"blank\" onclick=\"revealBlank(this)\">closing stock = opening stock</span><span class=\"hint-text\">（期末库存 = 期初库存）</span>，两种方法的利润相等。",explanation:{title:"产销平衡时的利润",content:"生产多少卖多少，库存不变，两种方法利润相同。",analogy:"刚好产销平衡，没有库存变化，利润自然一样。"}},
                {id:"9-30",category:"优缺点",question:"吸收成本法的优点：更容易通过向产品<span class=\"blank\" onclick=\"revealBlank(this)\">charge a share of fixed overheads</span><span class=\"hint-text\">（分摊固定费用）</span>来确定产品的<span class=\"blank\" onclick=\"revealBlank(this)\">total profitability</span><span class=\"hint-text\">（总盈利能力）</span>。",explanation:{title:"完全成本法的决策支持",content:"完全成本法能显示每个产品的完全成本和利润。",analogy:"每个产品分担了固定成本，就能看出谁赚谁亏。"}}
            ]},
            {chapter:"10",name:"Chapter 10 成本会计方法",categories:["分批成本法","分步成本法","正常异常损耗","联产品与副产品","成本分摊","服务成本法"],cards:[
                {id:"10-1",category:"分批成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Job costing</span><span class=\"hint-text\">（分批成本法）</span>应用于企业按<span class=\"blank\" onclick=\"revealBlank(this)\">customer specification</span><span class=\"hint-text\">（客户规格）</span>生产产品的场景。",explanation:{title:"分批成本法定义",content:"每个订单都是独特的，需要单独核算成本。",analogy:"就像裁缝根据客户身材定制西装，每套都不一样。"}},
                {id:"10-2",category:"分批成本法",question:"分批成本法中，所有成本记录在<span class=\"blank\" onclick=\"revealBlank(this)\">cost sheet</span><span class=\"hint-text\">（成本单）</span>中：<span class=\"blank\" onclick=\"revealBlank(this)\">Cost/unit</span><span class=\"hint-text\">（单位成本）</span> = DM + DL + DE + Production OH + Non-production costs。",explanation:{title:"单位成本计算",content:"产品成本 = 直接材料 + 直接人工 + 直接费用 + 制造费用 + 非制造费用。",analogy:"就像装修房子，把所有费用加起来除以面积。"}},
                {id:"10-3",category:"分批成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Batch costing</span><span class=\"hint-text\">（分批成本法）</span>应用于生产<span class=\"blank\" onclick=\"revealBlank(this)\">similar items</span><span class=\"hint-text\">（相似产品）</span>或为库存生产的场景。",explanation:{title:"批量成本法定义",content:"当一批产品中有多个相同项目时使用。",analogy:"就像服装厂生产一批相同的衬衫。"}},
                {id:"10-4",category:"分批成本法",question:"批量单位成本 = <span class=\"blank\" onclick=\"revealBlank(this)\">Total cost of the batch</span><span class=\"hint-text\">（批总成本）</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">units in the batch</span><span class=\"hint-text\">（批内单位数）</span>。",explanation:{title:"批量成本计算",content:"把整批的成本平均分到每个产品上。",analogy:"就像一箱苹果的总价除以个数得到单价。"}},
                {id:"10-5",category:"分步成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Process costing</span><span class=\"hint-text\">（分步成本法）</span>应用于生产<span class=\"blank\" onclick=\"revealBlank(this)\">standardized goods</span><span class=\"hint-text\">（标准化产品）</span>的场景，如炼油、食品加工。",explanation:{title:"分步成本法定义",content:"大量连续生产标准化产品，无法识别单个单位。",analogy:"就像工厂流水线生产可乐，每瓶都一样。"}},
                {id:"10-6",category:"正常异常损耗",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Normal loss</span><span class=\"hint-text\">（正常损耗）</span>是根据过去经验<span class=\"blank\" onclick=\"revealBlank(this)\">expected</span><span class=\"hint-text\">（预期）</span>的不可避免的损耗量。",explanation:{title:"正常损耗定义",content:"生产过程中必然发生的损耗，属于产品成本。",analogy:"就像榨橙汁必然要损失一些果皮。"}},
                {id:"10-7",category:"正常异常损耗",question:"正常损耗的价值由<span class=\"blank\" onclick=\"revealBlank(this)\">good units</span><span class=\"hint-text\">（合格产品）</span>承担，因为它被视为<span class=\"blank\" onclick=\"revealBlank(this)\">unavoidable</span><span class=\"hint-text\">（不可避免的）</span>生产成本。",explanation:{title:"正常损耗处理",content:"正常损耗的成本要分摊到合格产品上。",analogy:"就像运输水果的正常损耗要算进水果成本里。"}},
                {id:"10-8",category:"正常异常损耗",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Abnormal loss</span><span class=\"hint-text\">（异常损耗）</span>是指<span class=\"blank\" onclick=\"revealBlank(this)\">actual loss > normal loss</span><span class=\"hint-text\">（实际损耗 > 正常损耗）</span>或实际产出 < 预期产出。",explanation:{title:"异常损耗定义",content:"超出预期的损失，属于管理责任。",analogy:"就像机器故障导致的额外损失。"}},
                {id:"10-9",category:"正常异常损耗",question:"异常损耗的处理：借记<span class=\"blank\" onclick=\"revealBlank(this)\">Abnormal loss</span><span class=\"hint-text\">（异常损耗账户）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Process account</span><span class=\"hint-text\">（在产品账户）</span>。",explanation:{title:"异常损耗分录",content:"异常损耗不计入产品成本，作为期间损失处理。",analogy:"出了事故造成的损失不能算进产品成本里。"}},
                {id:"10-10",category:"正常异常损耗",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Abnormal gain</span><span class=\"hint-text\">（异常利得）</span>是指<span class=\"blank\" onclick=\"revealBlank(this)\">actual loss < normal loss</span><span class=\"hint-text\">（实际损耗 < 正常损耗）</span>或实际产出 > 预期产出。",explanation:{title:"异常利得定义",content:"效率高于预期产生的收益。",analogy:"就像生产过程中节约了材料。"}},
                {id:"10-11",category:"正常异常损耗",question:"异常利得的处理：借记<span class=\"blank\" onclick=\"revealBlank(this)\">Process account</span><span class=\"hint-text\">（在产品账户）</span>，贷记<span class=\"blank\" onclick=\"revealBlank(this)\">Abnormal gain</span><span class=\"hint-text\">（异常利得账户）</span>。",explanation:{title:"异常利得分录",content:"异常利得作为收入处理，增加利润。",analogy:"节约的成本变成了额外收益。"}},
                {id:"10-12",category:"联产品与副产品",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Joint products</span><span class=\"hint-text\">（联产品）</span>是每个产品都有<span class=\"blank\" onclick=\"revealBlank(this)\">high saleable value</span><span class=\"hint-text\">（高销售价值）</span>作为主要产品的联产品。",explanation:{title:"联产品定义",content:"从同一生产过程产出，都是主要产品。",analogy:"就像炼油同时产出汽油、柴油、沥青。"}},
                {id:"10-13",category:"联产品与副产品",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">By-products</span><span class=\"hint-text\">（副产品）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">incidentally produced</span><span class=\"hint-text\">（附带生产）</span>的产品，不适合独立核算。",explanation:{title:"副产品定义",content:"生产主要产品时附带产生的，价值较低。",analogy:"就像锯木头时产生的锯末。"}},
                {id:"10-14",category:"联产品与副产品",question:"副产品的处理：副产品的<span class=\"blank\" onclick=\"revealBlank(this)\">NRV</span><span class=\"hint-text\">（可变现净值）</span>应直接从<span class=\"blank\" onclick=\"revealBlank(this)\">main product costs</span><span class=\"hint-text\">（主产品成本）</span>中扣除。",explanation:{title:"副产品处理",content:"先算副产品能卖多少钱，从主产品成本中扣掉。",analogy:"就像卖废品得到的钱要冲减成本。"}},
                {id:"10-15",category:"联产品与副产品",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Net realizable value (NRV)</span><span class=\"hint-text\">（可变现净值）</span>= 销售收入 - <span class=\"blank\" onclick=\"revealBlank(this)\">handling and selling expenses</span><span class=\"hint-text\">（-handling和销售费用）</span> - 税费。",explanation:{title:"可变现净值计算",content:"副产品实际能净赚多少钱。",analogy:"卖东西收到的钱减去各种费用后剩下的。"}},
                {id:"10-16",category:"成本分摊",question:"联产品成本分摊方法：<span class=\"blank\" onclick=\"revealBlank(this)\">Physical weight</span><span class=\"hint-text\">（实物重量法）</span>按<span class=\"blank\" onclick=\"revealBlank(this)\">production weights</span><span class=\"hint-text\">（生产重量）</span>比例分摊。",explanation:{title:"实物重量法",content:"按产量重量来分摊联产品成本。",analogy:"就像按人数分摊聚餐费用。"}},
                {id:"10-17",category:"成本分摊",question:"联产品成本分摊方法：<span class=\"blank\" onclick=\"revealBlank(this)\">Sales value at split-off point</span><span class=\"hint-text\">（分离点销售价值法）</span>按<span class=\"blank\" onclick=\"revealBlank(this)\">Sales price × production weights</span><span class=\"hint-text\">（售价 × 产量）</span>比例分摊。",explanation:{title:"分离点销售价值法",content:"按各产品的销售价值来分摊成本。",analogy:"按贡献大小分摊费用。"}},
                {id:"10-18",category:"成本分摊",question:"联产品成本分摊方法：<span class=\"blank\" onclick=\"revealBlank(this)\">Net realisable value (NRV)</span><span class=\"hint-text\">（可变现净值法）</span>按各产品的<span class=\"blank\" onclick=\"revealBlank(this)\">NRV</span><span class=\"hint-text\">（可变现净值）</span>比例分摊。",explanation:{title:"NRV法",content:"考虑进一步加工后的净价值来分摊成本。",analogy:"按最终能赚多少钱来分摊。"}},
                {id:"10-19",category:"成本分摊",question:"联产品进一步加工决策：可以选择<span class=\"blank\" onclick=\"revealBlank(this)\">sell immediately</span><span class=\"hint-text\">（立即出售）</span>或<span class=\"blank\" onclick=\"revealBlank(this)\">further processing</span><span class=\"hint-text\">（进一步加工）</span>后再出售。",explanation:{title:"联产品决策",content:"比较加工成本和增加的收入来决定。",analogy:"生牛奶可以直接卖，也可以做成奶酪再卖。"}},
                {id:"10-20",category:"成本分摊",question:"进一步加工的增量利润 = 增量收入 - <span class=\"blank\" onclick=\"revealBlank(this)\">incremental costs</span><span class=\"hint-text\">（增量成本）</span>，如果增量利润 > 0，则应进一步加工。",explanation:{title:"进一步加工决策",content:"加工多赚的钱是否大于加工多花的成本。",analogy:"多花的钱能换来更多收入吗？"}},
                {id:"10-21",category:"服务成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Service costing</span><span class=\"hint-text\">（服务成本法）</span>应用于提供<span class=\"blank\" onclick=\"revealBlank(this)\">services</span><span class=\"hint-text\">（服务）</span>的行业。",explanation:{title:"服务成本法定义",content:"为服务业设计的成本计算方法。",analogy:"就像计算酒店或医院的运营成本。"}},
                {id:"10-22",category:"服务成本法",question:"服务的特性：<span class=\"blank\" onclick=\"revealBlank(this)\">Simultaneity</span><span class=\"hint-text\">（同步性）</span>指生产和消费<span class=\"blank\" onclick=\"revealBlank(this)\">at the same time</span><span class=\"hint-text\">（同时发生）</span>。",explanation:{title:"同步性特点",content:"服务无法提前生产储存。",analogy:"就像理发，服务和消费同时发生。"}},
                {id:"10-23",category:"服务成本法",question:"服务的特性：<span class=\"blank\" onclick=\"revealBlank(this)\">Intangibility</span><span class=\"hint-text\">（无形性）</span>指服务<span class=\"blank\" onclick=\"revealBlank(this)\">not physical</span><span class=\"hint-text\">（不是有形的）</span>，难以测量投入和产出。",explanation:{title:"无形性特点",content:"服务看不见摸不着。",analogy:"就像咨询、教育等服务。"}},
                {id:"10-24",category:"服务成本法",question:"服务的特性：<span class=\"blank\" onclick=\"revealBlank(this)\">Perishability</span><span class=\"hint-text\">（易逝性）</span>指服务<span class=\"blank\" onclick=\"revealBlank(this)\">cannot be stored</span><span class=\"hint-text\">（不能储存）</span>。",explanation:{title:"易逝性特点",content:"服务不能像商品一样储存起来以后卖。",analogy:"酒店的空房间过夜就浪费了。"}},
                {id:"10-25",category:"服务成本法",question:"服务的特性：<span class=\"blank\" onclick=\"revealBlank(this)\">Heterogeneity</span><span class=\"hint-text\">（异质性）</span>指每次服务<span class=\"blank\" onclick=\"revealBlank(this)\">unique</span><span class=\"hint-text\">（独特）</span>且<span class=\"blank\" onclick=\"revealBlank(this)\">performance varies</span><span class=\"hint-text\">（表现可能不同）</span>。",explanation:{title:"异质性特点",content:"服务质量可能不一致。",analogy:"就像不同理发师理出的发型不一样。"}},
                {id:"10-26",category:"服务成本法",question:"服务成本单位：电力使用<span class=\"blank\" onclick=\"revealBlank(this)\">kilowatt-hours</span><span class=\"hint-text\">（千瓦时）</span>，酒店使用<span class=\"blank\" onclick=\"revealBlank(this)\">room-day</span><span class=\"hint-text\">（房晚）</span>。",explanation:{title:"服务成本单位",content:"不同服务行业有不同的计量单位。",analogy:"酒店按入住天数收费。"}},
                {id:"10-27",category:"服务成本法",question:"服务成本单位：医院使用<span class=\"blank\" onclick=\"revealBlank(this)\">patient-day</span><span class=\"hint-text\">（病人日）</span>，客运使用<span class=\"blank\" onclick=\"revealBlank(this)\">passenger-mile</span><span class=\"hint-text\">（乘客英里）</span>。",explanation:{title:"医疗运输成本单位",content:"医疗和运输行业常用的成本计量单位。",analogy:"按住院天数或运输里程计费。"}},
                {id:"10-28",category:"服务成本法",question:"服务成本单位：运输使用<span class=\"blank\" onclick=\"revealBlank(this)\">tonne-mile</span><span class=\"hint-text\">（吨英里）</span>作为<span class=\"blank\" onclick=\"revealBlank(this)\">composite cost unit</span><span class=\"hint-text\">（复合成本单位）</span>。",explanation:{title:"运输成本单位",content:"同时考虑重量和距离的复合计量单位。",analogy:"货运按吨公里计费。"}},
                {id:"10-29",category:"分步成本法",question:"分步成本法中的<span class=\"blank\" onclick=\"revealBlank(this)\">equivalent units</span><span class=\"hint-text\">（约当产量）</span>是将<span class=\"blank\" onclick=\"revealBlank(this)\">WIP</span><span class=\"hint-text\">（在产品）</span>折算为完工产品的概念。",explanation:{title:"约当产量",content:"把在产品折算成相当于多少完工产品。",analogy:"半成品算半个完工产品。"}},
                {id:"10-30",category:"成本分摊",question:"联产品成本分摊的<span class=\"blank\" onclick=\"revealBlank(this)\">constant quality</span><span class=\"hint-text\">（恒定质量）</span>原则要求分摊后的成本能反映各产品的<span class=\"blank\" onclick=\"revealBlank(this)\">relative value</span><span class=\"hint-text\">（相对价值）</span>。",explanation:{title:"成本分摊原则",content:"分摊要公平合理，能反映产品价值。",analogy:"按贡献大小分摊，公平合理。"}}
            ]},
            {chapter:"11",name:"Chapter 11 替代成本会计原则",categories:["作业成本法","目标成本法","生命周期成本法","全面质量管理","成本质量"],cards:[
                {id:"11-1",category:"作业成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Activity-based costing (ABC)</span><span class=\"hint-text\">（作业成本法）</span>是一种比吸收成本法更<span class=\"blank\" onclick=\"revealBlank(this)\">advanced</span><span class=\"hint-text\">（先进的）</span>的成本计算方法。",explanation:{title:"ABC定义",content:"ABC通过识别成本动因来更精确地分配间接成本。",analogy:"就像按实际使用情况分摊水电费，而不是按人头分摊。"}},
                {id:"11-2",category:"作业成本法",question:"传统吸收成本法使用<span class=\"blank\" onclick=\"revealBlank(this)\">single basis</span><span class=\"hint-text\">（单一基础）</span>来吸收所有制造费用到成本单位中。",explanation:{title:"传统方法局限",content:"用一个分摊率分所有费用，不够精确。",analogy:"就像不管用什么设备都按工时分摊电费。"}},
                {id:"11-3",category:"作业成本法",question:"ABC的核心：识别每个制造费用类别<span class=\"blank\" onclick=\"revealBlank(this)\">what causes it to occur</span><span class=\"hint-text\">（是什么导致它发生）</span>，即<span class=\"blank\" onclick=\"revealBlank(this)\">cost drivers</span><span class=\"hint-text\">（成本动因）</span>。",explanation:{title:"成本动因",content:"找到导致成本发生的真正原因。",analogy:"机器折旧应该按机器小时分摊，而不是按人工小时。"}},
                {id:"11-4",category:"作业成本法",question:"ABC的步骤：<span class=\"blank\" onclick=\"revealBlank(this)\">Activity</span><span class=\"hint-text\">（活动）</span> → Cost pool → <span class=\"blank\" onclick=\"revealBlank(this)\">Cost driver</span><span class=\"hint-text\">（成本动因）</span> → OAR → OH/unit → Cost/unit。",explanation:{title:"ABC步骤流程",content:"从活动到成本动因再到单位成本。",analogy:"按作业流程一步步追溯成本。"}},
                {id:"11-5",category:"作业成本法",question:"ABC中，每个制造费用类型形成<span class=\"blank\" onclick=\"revealBlank(this)\">cost pool</span><span class=\"hint-text\">（成本库）</span>，由不同的<span class=\"blank\" onclick=\"revealBlank(this)\">cost driver</span><span class=\"hint-text\">（成本动因）</span>吸收。",explanation:{title:"成本库概念",content:"把同类型的成本放在一起，用各自的成本动因分摊。",analogy:"把不同的费用分类放不同的盒子里。"}},
                {id:"11-6",category:"作业成本法",question:"ABC避免了<span class=\"blank\" onclick=\"revealBlank(this)\">reapportionments</span><span class=\"hint-text\">（重分配）</span>，因为它将制造费用直接分配到<span class=\"blank\" onclick=\"revealBlank(this)\">activities</span><span class=\"hint-text\">（活动）</span>。",explanation:{title:"ABC避免重分配",content:"直接分配到活动，不再需要服务部门成本重分配。",analogy:"直接追踪到源头，不用绕来绕去。"}},
                {id:"11-7",category:"作业成本法",question:"ABC比AC更适用于<span class=\"blank\" onclick=\"revealBlank(this)\">diversity and complexity</span><span class=\"hint-text\">（多样性 和复杂性）</span>的运营环境，特别是<span class=\"blank\" onclick=\"revealBlank(this)\">overhead not driven by volume</span><span class=\"hint-text\">（非产量驱动的制造费用）</span>。",explanation:{title:"ABC适用场景",content:"产品种类多、间接费用高且不随产量变化时用ABC更准确。",analogy:"就像复杂公司需要更精细的费用分摊方法。"}},
                {id:"11-8",category:"作业成本法",question:"ABC中成本可以被更好地<span class=\"blank\" onclick=\"revealBlank(this)\">controlled</span><span class=\"hint-text\">（控制）</span>，因为每个成本<span class=\"blank\" onclick=\"revealBlank(this)\">specifically identified</span><span class=\"hint-text\">（被具体识别）</span>。",explanation:{title:"ABC的成本控制",content:"通过识别成本动因可以更精确地控制成本。",analogy:"知道钱花在哪儿了，就能更好地控制。"}},
                {id:"11-9",category:"目标成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Target costing</span><span class=\"hint-text\">（目标成本法）</span>关注产品在<span class=\"blank\" onclick=\"revealBlank(this)\">competitive price</span><span class=\"hint-text\">（竞争价格）</span>下的成本，旨在削减成本以维持市场份额和利润率。",explanation:{title:"目标成本法定义",content:"先确定市场能接受的价格，再倒推计算目标成本。",analogy:"先看客户愿意付多少钱，再决定花多少钱生产。"}},
                {id:"11-10",category:"目标成本法",question:"传统成本法：<span class=\"blank\" onclick=\"revealBlank(this)\">Cost-plus pricing</span><span class=\"hint-text\">（成本加成定价）</span> = 成本 + 利润。",explanation:{title:"成本加成定价",content:"先算出成本，再加上想要的利润。",analogy:"成本10元，想赚5元，就卖15元。"}},
                {id:"11-11",category:"目标成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Profit Margin</span><span class=\"hint-text\">（利润率）</span> = 利润 / 销售额，反映<span class=\"blank\" onclick=\"revealBlank(this)\">Profit / Sales</span><span class=\"hint-text\">（利润占销售额的比例）</span>。",explanation:{title:"利润率公式",content:"每卖100元能赚多少钱。",analogy:"卖100元赚20元，利润率就是20%。"}},
                {id:"11-12",category:"目标成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Profit Mark-up</span><span class=\"hint-text\">（成本加成率）</span> = 利润 / 成本，反映<span class=\"blank\" onclick=\"revealBlank(this)\">Profit / Costs</span><span class=\"hint-text\">（利润占成本的比例）</span>。",explanation:{title:"成本加成率公式",content:"每花100元成本能赚多少钱。",analogy:"花100元成本赚20元，加成率就是20%。"}},
                {id:"11-13",category:"目标成本法",question:"目标成本计算公式：<span class=\"blank\" onclick=\"revealBlank(this)\">Target cost</span><span class=\"hint-text\">（目标成本）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">market price</span><span class=\"hint-text\">（市场价格）</span> - required profit。",explanation:{title:"目标成本公式",content:"目标成本 = 市场接受价格 - 目标利润。",analogy:"客户只愿付100元，想赚20元，那成本只能花80元。"}},
                {id:"11-14",category:"目标成本法",question:"目标成本法的步骤：1. 定义产品规格 → 2. 确定可接受市场价格 → 3. 计算目标利润 → 4. 计算<span class=\"blank\" onclick=\"revealBlank(this)\">cost gap</span><span class=\"hint-text\">（成本差距）</span> → 5. 采取行动缩小差距。",explanation:{title:"目标成本法步骤",content:"从市场出发，倒推成本，找出差距，改进生产。",analogy:"先定目标，再找差距，最后改进。"}},
                {id:"11-15",category:"生命周期成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Life-cycle costing</span><span class=\"hint-text\">（生命周期成本法）</span>估算产品从<span class=\"blank\" onclick=\"revealBlank(this)\">design to withdrawal</span><span class=\"hint-text\">（设计到退出）</span>整个生命周期的成本和收入。",explanation:{title:"生命周期成本法定义",content:"从产品诞生到消亡的全过程成本。",analogy:"养孩子要从出生养到长大成人的全部花费。"}},
                {id:"11-16",category:"生命周期成本法",question:"生命周期五个阶段：1.<span class=\"blank\" onclick=\"revealBlank(this)\">Development</span><span class=\"hint-text\">（开发）</span> 2.<span class=\"blank\" onclick=\"revealBlank(this)\">Introduction</span><span class=\"hint-text\">（引入）</span> 3.<span class=\"blank\" onclick=\"revealBlank(this)\">Growth</span><span class=\"hint-text\">（增长）</span> 4.<span class=\"blank\" onclick=\"revealBlank(this)\">Maturity</span><span class=\"hint-text\">（成熟）</span> 5.<span class=\"blank\" onclick=\"revealBlank(this)\">Decline</span><span class=\"hint-text\">（衰退）</span>。",explanation:{title:"产品生命周期",content:"产品从诞生到退出市场的五个阶段。",analogy:"就像人的一生：童年、青年、成年、中年、老年。"}},
                {id:"11-17",category:"生命周期成本法",question:"开发阶段的特征：销售 = <span class=\"blank\" onclick=\"revealBlank(this)\">Nil</span><span class=\"hint-text\">（无）</span>，成本主要是<span class=\"blank\" onclick=\"revealBlank(this)\">fixed costs</span><span class=\"hint-text\">（固定成本）</span>如研发和设施建设。",explanation:{title:"开发阶段",content:"还没有收入，只有投入。",analogy:"种庄稼还没收获，只有种子和劳动投入。"}},
                {id:"11-18",category:"生命周期成本法",question:"引入阶段的特征：销售<span class=\"blank\" onclick=\"revealBlank(this)\">low level</span><span class=\"hint-text\">（低水平）</span>，成本高，尤其<span class=\"blank\" onclick=\"revealBlank(this)\">marketing promotion</span><span class=\"hint-text\">（营销推广）</span>费用高。",explanation:{title:"引入阶段",content:"新产品刚上市，卖得少但宣传费用大。",analogy:"新产品上市要大力推广，让大家知道。"}},
                {id:"11-19",category:"生命周期成本法",question:"成熟阶段的特征：销售<span class=\"blank\" onclick=\"revealBlank(this)\">stable, high level</span><span class=\"hint-text\">（稳定、高水平）</span>，实现<span class=\"blank\" onclick=\"revealBlank(this)\">scale of economy</span><span class=\"hint-text\">（规模经济）</span>，单位固定成本最低。",explanation:{title:"成熟阶段",content:"产品销量稳定，生产效率最高。",analogy:"产品销量稳定，生产成本降到最低。"}},
                {id:"11-20",category:"全面质量管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Total quality management (TQM)</span><span class=\"hint-text\">（全面质量管理）</span>是持续改进<span class=\"blank\" onclick=\"revealBlank(this)\">quality, productivity and effectiveness</span><span class=\"hint-text\">（质量、生产率和效益）</span>的管理理念。",explanation:{title:"TQM定义",content:"全员参与、全过程的质量管理。",analogy:"就像每个人都用心把事情做好。"}},
                {id:"11-21",category:"全面质量管理",question:"TQM的两大关键要素：1.<span class=\"blank\" onclick=\"revealBlank(this)\">Get it right, first time</span><span class=\"hint-text\">（一次就做对）</span> 2.<span class=\"blank\" onclick=\"revealBlank(this)\">Continuous improvement</span><span class=\"hint-text\">（持续改进）</span>。",explanation:{title:"TQM两大要素",content:"第一次就把事情做对，永远追求更好。",analogy:"不返工，不浪费，永远进步。"}},
                {id:"11-22",category:"全面质量管理",question:"TQM哲学：<span class=\"blank\" onclick=\"revealBlank(this)\">Zero defect</span><span class=\"hint-text\">（零缺陷）</span>，预防错误的成本<span class=\"blank\" onclick=\"revealBlank(this)\">less than correcting them</span><span class=\"hint-text\">（低于纠正错误的成本）</span>。",explanation:{title:"零缺陷理念",content:"预防比补救更划算。",analogy:"就像安全带比急救便宜。"}},
                {id:"11-23",category:"成本质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Prevention costs</span><span class=\"hint-text\">（预防成本）</span>是为了防止产生缺陷产品而产生的成本，如质量控制设备维护和员工培训。",explanation:{title:"预防成本",content:"花在前面的钱，防止出问题。",analogy:"定期体检比生病住院便宜。"}},
                {id:"11-24",category:"成本质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Appraisal costs</span><span class=\"hint-text\">（鉴定成本）</span>是为了评估货物或服务质量而产生的成本，如来料检验和成品检验。",explanation:{title:"鉴定成本",content:"检查产品质量的成本。",analogy:"就像质检员检查产品是否合格。"}},
                {id:"11-25",category:"成本质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Internal failure costs</span><span class=\"hint-text\">（内部失败成本）</span>是在产品仍在组织内时发现的缺陷所产生的成本，如返工和报废成本。",explanation:{title:"内部失败成本",content:"内部发现的问题，处理起来相对便宜。",analogy:"产品出公司前发现问题是内部问题。"}},
                {id:"11-26",category:"成本质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">External failure costs</span><span class=\"hint-text\">（外部失败成本）</span>是缺陷产品离开组织后才发现所产生的成本，如保修维修和客户流失。",explanation:{title:"外部失败成本",content:"客户发现的问题，处理起来最贵。",analogy:"卖出去才发现问题代价最大，还影响声誉。"}},
                {id:"11-27",category:"成本质量",question:"TQM下：<span class=\"blank\" onclick=\"revealBlank(this)\">Prevention + Appraisal costs</span><span class=\"hint-text\">（预防 + 鉴定成本）</span>会更高，但<span class=\"blank\" onclick=\"revealBlank(this)\">Internal + External failure costs</span><span class=\"hint-text\">（内部 + 外部失败成本）</span>会更低。",explanation:{title:"TQM成本结构",content:"前期多投入预防，后期少出问题。",analogy:"平时多花钱保养，车就不容易坏。"}},
                {id:"11-28",category:"成本质量",question:"TQM成本管理的原则：<span class=\"blank\" onclick=\"revealBlank(this)\">Prevention + Appraisal costs</span><span class=\"hint-text\">（预防 + 鉴定成本）</span>应该<span class=\"blank\" onclick=\"revealBlank(this)\">less than</span><span class=\"hint-text\">（小于）</span>失败成本。",explanation:{title:"TQM效益原则",content:"花在预防上的钱要少于失败造成的损失。",analogy:"花在检查上的钱要少于出问题赔的钱。"}},
                {id:"11-29",category:"作业成本法",question:"ABC相比AC的优势：1.避免重分配 2.多个<span class=\"blank\" onclick=\"revealBlank(this)\">cost drivers</span><span class=\"hint-text\">（成本动因）</span>更准确 3.预算更准确 4.更好的<span class=\"blank\" onclick=\"revealBlank(this)\">decision making</span><span class=\"hint-text\">（决策）</span>。",explanation:{title:"ABC四大优势",content:"追溯成本、准确分摊、精确预算、支持决策。",analogy:"找到成本真正的原因，而不是一刀切。"}},
                {id:"11-30",category:"全面质量管理",question:"TQM与客户的关系：维护与<span class=\"blank\" onclick=\"revealBlank(this)\">customers and suppliers</span><span class=\"hint-text\">（客户和供应商）</span>的良好关系是TQM环境的重要特征。",explanation:{title:"TQM的协作理念",content:"质量管理需要整个供应链的参与。",analogy:"质量不是一家的事，是整个链条的事。"}}
            ]}
        ];

        let currentChapter = 'all';
        let currentFilter = 'all';
        let currentCategory = 'all';
        let allAnswersVisible = false;
        let allExplanationsVisible = false;
        let hintsHidden = false;

        function initializeChapterButtons() {
            const grid = document.getElementById('chapterGrid');
            let html = '<button class="chapter-btn active" data-chapter="all">全部章节</button>';
            chapterData.forEach(ch => {
                const totalCards = ch.cards.length;
                html += `<button class="chapter-btn" data-chapter="${ch.chapter}">${ch.name} (${totalCards})</button>`;
            });
            grid.innerHTML = html;
        }

        function initializeCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            let categories = ['全部主题'];
            if (currentChapter === 'all') {
                chapterData.forEach(ch => { categories = categories.concat(ch.categories); });
                categories = [...new Set(categories)];
            } else {
                const chapter = chapterData.find(ch => ch.chapter === currentChapter);
                if (chapter) categories = categories.concat(chapter.categories);
            }
            let html = categories.map((cat, i) => 
                `<button class="cat-btn ${i === 0 ? 'active' : ''}" data-category="${cat === '全部主题' ? 'all' : cat}">${cat}</button>`
            ).join('');
            container.innerHTML = html;
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            let filteredCards = [];
            if (currentChapter === 'all') {
                chapterData.forEach(ch => {
                    filteredCards = filteredCards.concat(ch.cards.map(card => ({
                        ...card, chapter: ch.chapter, chapterName: ch.name
                    })));
                });
            } else {
                const chapter = chapterData.find(ch => ch.chapter === currentChapter);
                if (chapter) filteredCards = chapter.cards.map(card => ({...card, chapter: chapter.chapter, chapterName: chapter.name}));
            }

            if (currentCategory !== 'all') filteredCards = filteredCards.filter(card => card.category === currentCategory);

            let displayCards = filteredCards;
            if (currentFilter !== 'all') {
                displayCards = filteredCards.filter(card => {
                    const status = localStorage.getItem(`card-${card.id}`);
                    if (currentFilter === 'mastered') return status === 'mastered';
                    if (currentFilter === 'not-mastered') return status === 'not-mastered';
                    if (currentFilter === 'unmarked') return !status;
                    return true;
                });
            }

            if (displayCards.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>没有找到匹配的闪卡</h3><p>请尝试选择其他章节或筛选条件</p></div>';
                updateStats(filteredCards);
                return;
            }

            displayCards.forEach((card, index) => {
                const status = localStorage.getItem(`card-${card.id}`);
                const cardElement = document.createElement('div');
                cardElement.className = `flashcard ${status || ''}`;
                cardElement.dataset.id = card.id;

                cardElement.innerHTML = `
                    <div class="card-header">
                        <div class="card-tags">
                            <span class="card-chapter">${card.chapter === 'intro' ? 'Intro' : 'Ch' + card.chapter}</span>
                            <span class="card-category">${card.category}</span>
                            ${status ? `<span class="card-status ${status}">${status === 'mastered' ? '已掌握' : '未掌握'}</span>` : ''}
                        </div>
                        <span class="card-number">#${index + 1}</span>
                    </div>
                    <div class="card-question">${card.question}</div>
                    <div class="card-actions">
                        <button class="btn btn-toggle" id="toggle-answer-${card.id}" onclick="toggleCardBlanks('${card.id}')"><span>👁</span> 显示答案</button>
                        <button class="btn btn-hide-hints" id="toggle-hints-${card.id}" onclick="toggleCardHints('${card.id}')"><span>🔤</span> 隐藏中文</button>
                        <button class="btn btn-explain" onclick="toggleExplanation('${card.id}')"><span>💡</span> 通俗解释</button>
                        <button class="btn btn-mastered" onclick="markCard('${card.id}', 'mastered')"><span>☐</span> 已掌握</button>
                        <button class="btn btn-not-mastered" onclick="markCard('${card.id}', 'not-mastered')"><span>☐</span> 未掌握</button>
                    </div>
                    <div class="explanation" id="explanation-${card.id}"><h4>💡 ${card.explanation.title}</h4><p>${card.explanation.content}</p><div class="analogy"><strong>生活类比：</strong>${card.explanation.analogy}</div></div>
                `;
                container.appendChild(cardElement);
            });
            updateStats(filteredCards);
        }

        function updateStats(allCards) {
            let mastered = 0, notMastered = 0;
            allCards.forEach(card => {
                const status = localStorage.getItem(`card-${card.id}`);
                if (status === 'mastered') mastered++;
                else if (status === 'not-mastered') notMastered++;
            });
            const displayCards = Array.from(document.querySelectorAll('.flashcard'));
            document.getElementById('masteredCount').textContent = mastered;
            document.getElementById('notMasteredCount').textContent = notMastered;
            document.getElementById('showingCount').textContent = displayCards.length;
            document.getElementById('filterAllCount').textContent = allCards.length;
            document.getElementById('filterMasteredCount').textContent = mastered;
            document.getElementById('filterNotMasteredCount').textContent = notMastered;
            document.getElementById('filterUnmarkedCount').textContent = allCards.length - mastered - notMastered;
            const progress = allCards.length > 0 ? ((mastered / allCards.length) * 100) : 0;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        function revealBlank(element) { element.classList.toggle('revealed'); }

        function toggleCardBlanks(cardId) {
            const card = document.querySelector(`[data-id="${cardId}"]`);
            const blanks = card.querySelectorAll('.blank');
            const btn = document.getElementById(`toggle-answer-${cardId}`);
            const anyHidden = Array.from(blanks).some(b => !b.classList.contains('revealed'));
            blanks.forEach(blank => blank.classList.toggle('revealed', anyHidden));
            btn.innerHTML = anyHidden ? '<span>👁</span> 隐藏答案' : '<span>👁</span> 显示答案';
        }

        function toggleCardHints(cardId) {
            const card = document.querySelector(`[data-id="${cardId}"]`);
            const btn = document.getElementById(`toggle-hints-${cardId}`);
            card.classList.toggle('hide-card-hints');
            btn.innerHTML = card.classList.contains('hide-card-hints') ? '<span>🔤</span> 显示中文' : '<span>🔤</span> 隐藏中文';
        }

        function toggleExplanation(cardId) {
            document.getElementById(`explanation-${cardId}`).classList.toggle('show');
        }

        function markCard(cardId, status) {
            const card = document.querySelector(`[data-id="${cardId}"]`);
            const previousStatus = localStorage.getItem(`card-${cardId}`);
            if (previousStatus === status) {
                localStorage.removeItem(`card-${cardId}`);
                card.classList.remove('mastered', 'not-mastered');
            } else {
                localStorage.setItem(`card-${cardId}`, status);
                card.classList.remove('mastered', 'not-mastered');
                card.classList.add(status);
            }
            renderCards();
        }

        function toggleAllAnswers() {
            allAnswersVisible = !allAnswersVisible;
            document.querySelectorAll('.blank').forEach(blank => blank.classList.toggle('revealed', allAnswersVisible));
            document.getElementById('toggleAnswersBtn').textContent = allAnswersVisible ? '👁 隐藏全部答案' : '👁 显示全部答案';
        }

        function toggleAllExplanations() {
            allExplanationsVisible = !allExplanationsVisible;
            document.querySelectorAll('.explanation').forEach(exp => exp.classList.toggle('show', allExplanationsVisible));
            document.getElementById('toggleExplanationsBtn').textContent = allExplanationsVisible ? '💡 隐藏全部解释' : '💡 显示全部解释';
        }

        function toggleHints() {
            hintsHidden = !hintsHidden;
            document.body.classList.toggle('hide-hints', hintsHidden);
            document.getElementById('toggleHintsBtn').textContent = hintsHidden ? '🔤 显示中文提示' : '🔤 隐藏中文提示';
        }

        function resetProgress() {
            if (confirm('确定要重置所有进度吗？')) {
                Object.keys(localStorage).filter(key => key.startsWith('card-')).forEach(key => localStorage.removeItem(key));
                renderCards();
            }
        }

        document.getElementById('chapterGrid').addEventListener('click', e => {
            if (e.target.classList.contains('chapter-btn')) {
                document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentChapter = e.target.dataset.chapter;
                currentCategory = 'all';
                initializeCategoryTabs();
                renderCards();
            }
        });

        document.getElementById('categoryTabs').addEventListener('click', e => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderCards();
            }
        });

        document.querySelector('.filter-tabs').addEventListener('click', e => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderCards();
            }
        });

        initializeChapterButtons();
        initializeCategoryTabs();
        renderCards();
    </script>
</body>
</html>
