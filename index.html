                {id:"13-10",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Discounted cash flow (DCF)</span><span class=\"hint-text\">（折现现金流）</span>是使用<span class=\"blank\" onclick=\"revealBlank(this)\">discounting arithmetic</span><span class=\"hint-text\">（折现计算）</span>评估资本投资项目的技术。",explanation:{title:"折现现金流",content:"DCF技术考虑了货币的时间价值，将未来的现金流折算为现值，是更科学的投资评估方法。主要包括NPV和IRR两种方法。",analogy:"就像把未来的钱折算成今天值多少钱，这样才能公平比较不同时间收到的钱。"}},
                {id:"13-11",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Net present value (NPV)</span><span class=\"hint-text\">（净现值）</span>= <span class=\"blank\" onclick=\"revealBlank(this)\">Present value of benefits</span><span class=\"hint-text\">（收益现值）</span> - <span class=\"blank\" onclick=\"revealBlank(this)\">Present value of costs</span><span class=\"hint-text\">（成本现值）</span>。",explanation:{title:"净现值",content:"NPV是将所有未来现金流折算为现值后，减去初始投资得到的净值。正的NPV表示项目能增加股东价值。",analogy:"投资1000元，未来收益折现后是1200元，NPV = 1200 - 1000 = 200元——这个项目值得投资。"}},
                {id:"13-12",category:"折现现金流",question:"NPV决策规则：<span class=\"blank\" onclick=\"revealBlank(this)\">Positive NPV</span><span class=\"hint-text\">（正NPV）</span>接受项目；<span class=\"blank\" onclick=\"revealBlank(this)\">Negative NPV</span><span class=\"hint-text\">（负NPV）</span>拒绝项目；<span class=\"blank\" onclick=\"revealBlank(this)\">Zero NPV</span><span class=\"hint-text\">（零NPV）</span>项目刚好达到要求回报率。",explanation:{title:"NPV决策规则",content:"NPV是判断项目是否值得投资的核心指标。正NPV意味着项目创造价值，负NPV意味着项目毁灭价值。",analogy:"就像判断一笔买卖划不划算——赚钱就做（正NPV），赔钱就不做（负NPV）。"}},
                {id:"13-13",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Annuity</span><span class=\"hint-text\">（年金）</span>是每年<span class=\"blank\" onclick=\"revealBlank(this)\">same amount</span><span class=\"hint-text\">（相同金额）</span>的现金支付或收入，持续若干年。",explanation:{title:"年金",content:"年金是一系列相等金额的现金流，如每年收到1000元，持续5年。年金分为普通年金（期末支付）、即付年金（期初支付）、递延年金和永续年金。",analogy:"就像你每年收到1万元的养老金，持续20年——这就是年金。"}},
                {id:"13-14",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Ordinary annuity</span><span class=\"hint-text\">（普通年金）</span>是在<span class=\"blank\" onclick=\"revealBlank(this)\">end of period</span><span class=\"hint-text\">（期末）</span>支付的年金。",explanation:{title:"普通年金",content:"普通年金是最常见的年金形式，现金流在每个期间结束时发生，如年底收到利息。",analogy:"就像每年年底收到投资分红——这就是普通年金。"}},
                {id:"13-15",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Annuity due</span><span class=\"hint-text\">（即付年金）</span>是在<span class=\"blank\" onclick=\"revealBlank(this)\">beginning of period</span><span class=\"hint-text\">（期初）</span>支付的年金。",explanation:{title:"即付年金",content:"即付年金的现金流在每个期间开始时发生，如年初支付租金。由于现金流发生得更早，即付年金的现值比普通年金高。",analogy:"就像每年年初交房租——这就是即付年金。"}},
                {id:"13-16",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Deferred annuity</span><span class=\"hint-text\">（递延年金）</span>是从<span class=\"blank\" onclick=\"revealBlank(this)\">year n</span><span class=\"hint-text\">（第n年）</span>开始的年金。",explanation:{title:"递延年金",content:"递延年金的现金流不是从第1年开始，而是推迟到未来某一年开始。计算时需要先计算到开始年份的现值，再折算到现在。",analogy:"就像你现在投资，从第5年开始每年收到收益——这就是递延年金。"}},
                {id:"13-17",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Perpetuity</span><span class=\"hint-text\">（永续年金）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">lasts forever</span><span class=\"hint-text\">（永远持续）</span>的年金，现值公式：<span class=\"blank\" onclick=\"revealBlank(this)\">PV = A / r</span>。",explanation:{title:"永续年金",content:"永续年金是永远持续的年金，如优先股股息。现值计算很简单：年金金额除以折现率。",analogy:"就像你买了一份永远能分红的资产，每年分红1000元，折现率10%，现值就是10000元。"}},
                {id:"13-18",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Discounted payback period</span><span class=\"hint-text\">（折现回收期）</span>是考虑<span class=\"blank\" onclick=\"revealBlank(this)\">time value of money</span><span class=\"hint-text\">（货币时间价值）</span>后的回收期。",explanation:{title:"折现回收期",content:"折现回收期在计算时先将未来现金流折现，再计算收回初始投资的时间。相比普通回收期，它考虑了货币时间价值，更准确。",analogy:"就像先把未来的钱折算成今天的价值，再看多久能回本——比直接看金额更科学。"}},
                {id:"13-19",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Internal rate of return (IRR)</span><span class=\"hint-text\">（内部收益率）</span>是使项目<span class=\"blank\" onclick=\"revealBlank(this)\">NPV equals zero</span><span class=\"hint-text\">（NPV等于零）</span>的折现率。",explanation:{title:"内部收益率",content:"IRR是项目的实际收益率，它表示项目能为投资者带来的回报率。通过试错法找到使NPV为零的折现率。",analogy:"就像投资一个项目，IRR告诉你这个项目能赚多少百分比的收益率。"}},
                {id:"13-20",category:"折现现金流",question:"IRR决策规则：<span class=\"blank\" onclick=\"revealBlank(this)\">IRR &gt; cost of capital</span><span class=\"hint-text\">（IRR大于资本成本）</span>接受项目；<span class=\"blank\" onclick=\"revealBlank(this)\">IRR &lt; cost of capital</span><span class=\"hint-text\">（IRR小于资本成本）</span>拒绝项目。",explanation:{title:"IRR决策规则",content:"当IRR大于公司的资本成本时，项目创造价值，应该接受；当IRR小于资本成本时，项目毁灭价值，应该拒绝。",analogy:"就像你借钱投资，利率是10%，如果项目能赚15%就值得做，如果只能赚5%就不值得。"}},
                {id:"13-21",category:"折现现金流",question:"IRR计算使用<span class=\"blank\" onclick=\"revealBlank(this)\">trial and error</span><span class=\"hint-text\">（试错法）</span>，公式：IRR = A + [NPVA / (NPVA - NPVB)] * (B - A)。",explanation:{title:"IRR计算公式",content:"IRR通过试错法计算：先用两个不同的折现率计算NPV，一个使NPV为正，一个使NPV为负，然后用插值法估算IRR。",analogy:"就像猜数字游戏，先猜一个数看是大是小，然后逐步逼近正确答案。"}},
                {id:"13-22",category:"折现现金流",question:"NPV的优点：① 增加<span class=\"blank\" onclick=\"revealBlank(this)\">shareholders' value</span><span class=\"hint-text\">（股东价值）</span>；② 考虑<span class=\"blank\" onclick=\"revealBlank(this)\">time value of money</span><span class=\"hint-text\">（货币时间价值）</span>；③ 基于<span class=\"blank\" onclick=\"revealBlank(this)\">cash flows</span><span class=\"hint-text\">（现金流）</span>而非利润。",explanation:{title:"NPV的优点",content:"NPV直接衡量项目对股东财富的贡献，考虑了货币时间价值，且基于现金流而非会计利润，更客观可靠。",analogy:"就像直接看投资能赚多少钱，而不是看账面利润——更真实。"}},
                {id:"13-23",category:"折现现金流",question:"IRR的缺点：① 非常规现金流可能产生<span class=\"blank\" onclick=\"revealBlank(this)\">multiple IRRs</span><span class=\"hint-text\">（多个IRR）</span>；② 可能与<span class=\"blank\" onclick=\"revealBlank(this)\">NPV</span><span class=\"hint-text\">（NPV）</span>产生冲突；③ 可能被混淆为<span class=\"blank\" onclick=\"revealBlank(this)\">ROCE</span><span class=\"hint-text\">（ROCE）</span>。",explanation:{title:"IRR的缺点",content:"IRR存在一些局限性，特别是在处理非常规现金流时可能出现多个解，而且在比较不同规模的项目时可能与NPV产生冲突。",analogy:"就像只看收益率不看投资规模——小项目收益率高但总收益可能不如大项目。"}},
                {id:"13-24",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Relevant cost</span><span class=\"hint-text\">（相关成本）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">future</span><span class=\"hint-text\">（未来的）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">incremental</span><span class=\"hint-text\">（增量的）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">cash flow</span><span class=\"hint-text\">（现金流）</span>。",explanation:{title:"相关成本",content:"相关成本必须满足三个条件：未来发生、增量变化、涉及现金流动。只有相关成本才应该纳入决策分析。",analogy:"就像决定是否打车——未来要花的钱、比坐公交多花的钱、实际要付的现金才是相关成本。"}},
                {id:"13-25",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Differential cost</span><span class=\"hint-text\">（差异成本）</span>= <span class=\"blank\" onclick=\"revealBlank(this)\">Cost of alternative A</span><span class=\"hint-text\">（方案A成本）</span> - <span class=\"blank\" onclick=\"revealBlank(this)\">Cost of alternative B</span><span class=\"hint-text\">（方案B成本）</span>。",explanation:{title:"差异成本",content:"差异成本是两个备选方案之间的成本差额，帮助管理者比较不同方案的成本差异。",analogy:"就像比较两个手机套餐——A套餐50元，B套餐60元，差异成本就是10元。"}},
                {id:"13-26",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Opportunity cost</span><span class=\"hint-text\">（机会成本）</span>是选择一个方案而<span class=\"blank\" onclick=\"revealBlank(this)\">forgone</span><span class=\"hint-text\">（放弃）</span>另一个方案的<span class=\"blank\" onclick=\"revealBlank(this)\">benefit</span><span class=\"hint-text\">（收益）</span>。",explanation:{title:"机会成本",content:"机会成本是决策时放弃的次优选择的价值，虽然不是实际支付的成本，但在决策中非常重要。",analogy:"就像你选择去看电影而放弃了兼职赚钱——放弃的工资就是机会成本。"}},
                {id:"13-27",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Avoidable cost</span><span class=\"hint-text\">（可避免成本）</span>是可以通过<span class=\"blank\" onclick=\"revealBlank(this)\">decision</span><span class=\"hint-text\">（决策）</span>避免发生的成本。",explanation:{title:"可避免成本",content:"可避免成本是与特定决策相关的成本，如果选择不同的方案，这些成本就不会发生。",analogy:"就像取消订阅服务后，下个月就不用再付订阅费——这就是可避免成本。"}},
                {id:"13-28",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sunk cost</span><span class=\"hint-text\">（沉没成本）</span>是已经<span class=\"blank\" onclick=\"revealBlank(this)\">incurred</span><span class=\"hint-text\">（发生）</span>或<span class=\"blank\" onclick=\"revealBlank(this)\">committed</span><span class=\"hint-text\">（承诺）</span>的成本，与未来决策<span class=\"blank\" onclick=\"revealBlank(this)\">irrelevant</span><span class=\"hint-text\">（无关）</span>。",explanation:{title:"沉没成本",content:"沉没成本是已经花出去且无法收回的钱，不应该影响未来的决策。",analogy:"就像你花50元买了一张电影票，但开场后发现电影很烂——这50元就是沉没成本，不应该影响你是否离开的决定。"}},
                {id:"13-29",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Committed cost</span><span class=\"hint-text\">（承诺成本）</span>是未来的成本，但<span class=\"blank\" onclick=\"revealBlank(this)\">cannot be avoided</span><span class=\"hint-text\">（无法避免）</span>，无论做出什么决策都会发生。",explanation:{title:"承诺成本",content:"承诺成本是已经签订合同或做出承诺的未来成本，虽然还没支付，但已经无法改变，因此与决策无关。",analogy:"就像你签了一年的租房合同——无论你是否住在这里，都必须支付租金。"}},
                {id:"13-30",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Unavoidable cost</span><span class=\"hint-text\">（不可避免成本）</span>是无论做出什么<span class=\"blank\" onclick=\"revealBlank(this)\">decision</span><span class=\"hint-text\">（决策）</span>都会发生的成本。",explanation:{title:"不可避免成本",content:"不可避免成本是无论选择哪个方案都会发生的成本，因此与决策无关，不应该纳入决策分析。",analogy:"就像无论你选择开车还是坐公交上班，房租还是要交——房租就是不可避免成本。"}},
                {id:"13-31",category:"相关成本",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-cash flow costs</span><span class=\"hint-text\">（非现金成本）</span>不涉及<span class=\"blank\" onclick=\"revealBlank(this)\">cash flow</span><span class=\"hint-text\">（现金流）</span>，如<span class=\"blank\" onclick=\"revealBlank(this)\">depreciation</span><span class=\"hint-text\">（折旧）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">book value</span><span class=\"hint-text\">（账面价值）</span>等。",explanation:{title:"非现金成本",content:"非现金成本是会计处理上的成本，但不涉及实际的现金流动，因此在决策分析中通常不考虑。",analogy:"就像你家房子的折旧——虽然会计上每年会记录折旧费用，但实际上你没有花这笔钱。"}},
                {id:"13-32",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Present value (PV)</span><span class=\"hint-text\">（现值）</span>是未来一笔钱在<span class=\"blank\" onclick=\"revealBlank(this)\">today's terms</span><span class=\"hint-text\">（今天）</span>的价值。",explanation:{title:"现值",content:"现值是将未来的现金流折算到现在的价值，考虑了货币的时间价值。计算现值的过程称为折现。",analogy:"就像一年后收到100元，在折现率10%的情况下，现值只有约90.91元。"}},
                {id:"13-33",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Future value (FV)</span><span class=\"hint-text\">（终值）</span>是一笔钱在<span class=\"blank\" onclick=\"revealBlank(this)\">future date</span><span class=\"hint-text\">（未来某个日期）</span>的价值，公式：FV = <span class=\"blank\" onclick=\"revealBlank(this)\">PV × (1 + r)^n</span>。",explanation:{title:"终值",content:"终值是一笔钱在未来某个时间点的价值，考虑了复利的影响。这是货币时间价值的正向计算。",analogy:"就像你存100元，年利率5%，一年后终值就是105元。"}},
                {id:"13-34",category:"利息计算",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Nominal rate</span><span class=\"hint-text\">（名义利率）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">stated rate</span><span class=\"hint-text\">（标明的利率）</span>，而<span class=\"blank\" onclick=\"revealBlank(this)\">effective annual rate (EAR)</span><span class=\"hint-text\">（有效年利率）</span>考虑了<span class=\"blank\" onclick=\"revealBlank(this)\">compounding frequency</span><span class=\"hint-text\">（复利频率）</span>。",explanation:{title:"名义利率与有效年利率",content:"名义利率是金融产品标明的利率，而有效年利率是实际获得的年化收益率，考虑了复利的影响。复利频率越高，有效年利率越高。",analogy:"就像银行说年利率12%，但按月复利——实际收益会比12%高。"}},
                {id:"13-35",category:"折现现金流",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost of capital</span><span class=\"hint-text\">（资本成本）</span>是企业为<span class=\"blank\" onclick=\"revealBlank(this)\">raising funds</span><span class=\"hint-text\">（筹集资金）</span>所支付的<span class=\"blank\" onclick=\"revealBlank(this)\">required return</span><span class=\"hint-text\">（必要报酬率）</span>。",explanation:{title:"资本成本",content:"资本成本是企业使用资金的机会成本，通常作为投资项目的折现率。如果项目的收益率高于资本成本，就值得投资。",analogy:"就像你借钱投资要付利息——这个利息率就是资本成本，投资收益必须高于它才划算。"}}
            ]
        },
        {chapter:"14",name:"Chapter 14 Variances",categories:["标准成本法","材料差异","人工差异","制造费用差异","销售差异","差异分析"],cards:[
            {id:"14-1",category:"标准成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard costing</span><span class=\"hint-text\">（标准成本法）</span>是一种成本会计方法，将<span class=\"blank\" onclick=\"revealBlank(this)\">standard costs</span><span class=\"hint-text\">（标准成本）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">variances</span><span class=\"hint-text\">（差异）</span>纳入分类账账户。",explanation:{title:"标准成本法的定义",content:"标准成本法是一种预算控制工具，通过设定标准成本，比较实际成本与标准成本的差异，实现成本控制和绩效评估。它将预计的成本直接记入账簿，期末再调整差异。",analogy:"就像你计划每周花200元买菜（标准成本），实际花了250元，多花的50元就是差异。标准成本法就是系统地记录和分析这些差异。"}},
            {id:"14-2",category:"标准成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard cost</span><span class=\"hint-text\">（标准成本）</span>是产品或服务的<span class=\"blank\" onclick=\"revealBlank(this)\">planned unit cost</span><span class=\"hint-text\">（计划单位成本）</span>，用于预算编制和差异分析。",explanation:{title:"标准成本的含义",content:"标准成本是预先计算的单位成本，包含直接材料、直接人工和制造费用。它是预算编制的基础，也是衡量实际绩效的基准。",analogy:"就像餐厅菜单上的定价：每道菜的标准成本 = 标准用量 × 标准价格。这个'标准'就是我们的预期目标。"}},
            {id:"14-3",category:"标准成本法",question:"标准成本法的目的：用于<span class=\"blank\" onclick=\"revealBlank(this)\">planning</span><span class=\"hint-text\">（计划）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">control</span><span class=\"hint-text\">（控制）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">motivation</span><span class=\"hint-text\">（激励）</span>。",explanation:{title:"标准成本法的三大目的",content:"Planning：为预算提供基础；Control：通过比较实际与标准发现问题；Motivation：设定目标激励员工。此外还用于简化记账和绩效评估。",analogy:"就像减肥计划：设定目标体重（Planning），每周称重对比（Control），达成目标奖励自己（Motivation）。"}},
            {id:"14-4",category:"标准成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Ideal standard</span><span class=\"hint-text\">（理想标准）</span>基于完美运营条件，不考虑<span class=\"blank\" onclick=\"revealBlank(this)\">wastage</span><span class=\"hint-text\">（浪费）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">spoilage</span><span class=\"hint-text\">（损耗）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">inefficiencies</span><span class=\"hint-text\">（低效率）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">idle time</span><span class=\"hint-text\">（闲置时间）</span>。",explanation:{title:"理想标准",content:"理想标准假设一切都在最佳状态下运行：没有浪费、没有停机、员工效率最高。这是一个理论上的完美目标，但现实中很难达到，可能打击员工积极性。",analogy:"就像考试满分100分——理论上可以达到，但假设你每道题都做对、没有任何失误。这是'理想'但不太现实的标准。"}},
            {id:"14-5",category:"标准成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Attainable standard</span><span class=\"hint-text\">（可实现标准）</span>基于正常运营条件，允许一定的<span class=\"blank\" onclick=\"revealBlank(this)\">wastage</span><span class=\"hint-text\">（浪费）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">inefficiencies</span><span class=\"hint-text\">（低效率）</span>。",explanation:{title:"可实现标准",content:"可实现标准考虑了现实中的正常损耗和效率损失。它既具有挑战性又是可以实现的，是最常用的标准类型，能有效激励员工。",analogy:"就像老师设定的'优秀'标准：不是满分，但需要努力才能达到。比如90分以上算优秀，既不轻松也不太苛刻。"}},
            {id:"14-6",category:"标准成本法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Current standard</span><span class=\"hint-text\">（当前标准）</span>基于当前工作条件，反映当前的浪费和效率水平。<span class=\"blank\" onclick=\"revealBlank(this)\">Basic standard</span><span class=\"hint-text\">（基础标准）</span>长期保持不变，可能已过时。",explanation:{title:"当前标准 vs 基础标准",content:"Current standard根据当前实际情况设定，会随条件变化而更新。Basic standard作为长期基准保持不变，主要用于比较趋势，但可能脱离实际。",analogy:"Current standard就像你当前的跑步配速（每公里6分钟），会随训练变化。Basic standard就像你第一次跑步的配速，永远记录着起点。"}},
            {id:"14-7",category:"差异分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variance</span><span class=\"hint-text\">（差异）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">budget</span><span class=\"hint-text\">（预算）</span>与<span class=\"blank\" onclick=\"revealBlank(this)\">actual result</span><span class=\"hint-text\">（实际结果）</span>之间的差额。",explanation:{title:"差异的定义",content:"差异分析是预算控制的核心工具。通过计算和分析差异，管理层可以了解哪些方面表现好、哪些方面需要改进。",analogy:"就像你计划存1000元，实际只存了800元，差异是200元（不利）。差异分析就是找出为什么少存了200元。"}},
            {id:"14-8",category:"差异分析",question:"当实际结果优于预算时，产生<span class=\"blank\" onclick=\"revealBlank(this)\">Favourable variance</span><span class=\"hint-text\">（有利差异，F）</span>；当实际结果劣于预算时，产生<span class=\"blank\" onclick=\"revealBlank(this)\">Adverse variance</span><span class=\"hint-text\">（不利差异，A）</span>。",explanation:{title:"有利差异 vs 不利差异",content:"判断F或A要看差异的性质：对于成本，实际低于预算是F（省钱了）；对于收入，实际高于预算是F（多赚了）。反之则为A。",analogy:"成本差异：预算花100，实际花80 → 省了20元 → Favourable。收入差异：预算赚100，实际赚80 → 少赚20元 → Adverse。"}},
            {id:"14-9",category:"材料差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct material total variance</span><span class=\"hint-text\">（直接材料总差异）</span> = 实际产量应耗成本 - 实际耗用成本。",explanation:{title:"直接材料总差异",content:"材料总差异反映材料成本整体的偏差，由价格差异和用量差异两部分组成。公式：(标准用量×标准价格) - (实际用量×实际价格)。",analogy:"你计划做10个蛋糕需要100元材料费，实际花了120元。总差异 = 100 - 120 = -20元（不利差异）。"}},
            {id:"14-10",category:"材料差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct material price variance</span><span class=\"hint-text\">（直接材料价格差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">AP - SP</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">AQ</span>，其中AP是实际价格，SP是标准价格，AQ是实际采购量。",explanation:{title:"材料价格差异公式",content:"价格差异衡量采购环节的绩效。如果AP<SP（买便宜了），差异为负（Favourable）。注意：公式中用的是实际采购量AQ，不是实际用量。",analogy:"计划买100kg面粉，每kg 5元。实际买100kg，每kg 4.5元。价格差异 = (4.5-5)×100 = -50元（Favourable，买便宜了）。"}},
            {id:"14-11",category:"材料差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct material usage variance</span><span class=\"hint-text\">（直接材料用量差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">AQ - SQ</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">SP</span>，其中SQ是实际产量的标准用量。",explanation:{title:"材料用量差异公式",content:"用量差异衡量生产环节的效率。SQ = 实际产量 × 单位标准用量。如果AQ>SQ（用多了），差异为正（Adverse）。注意：用标准价格SP来估值。",analogy:"做100个蛋糕，标准每个用1kg面粉。实际用了110kg。用量差异 = (110-100)×5 = 50元（Adverse，浪费了）。"}},
            {id:"14-12",category:"人工差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct labour total variance</span><span class=\"hint-text\">（直接人工总差异）</span> = 实际产量应耗人工成本 - 实际人工成本。",explanation:{title:"直接人工总差异",content:"人工总差异反映人工成本整体的偏差，由工资率差异和效率差异两部分组成。公式：(标准工时×标准工资率) - (实际工时×实际工资率)。",analogy:"生产100件产品，标准人工成本2000元，实际人工成本2200元。总差异 = 2000 - 2200 = -200元（不利差异）。"}},
            {id:"14-13",category:"人工差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct labour rate variance</span><span class=\"hint-text\">（直接人工工资率差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">AR - SR</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">AH</span>，其中AR是实际工资率，SR是标准工资率，AH是实际工时。",explanation:{title:"人工工资率差异公式",content:"工资率差异衡量人力资源成本控制。如果AR>SR（工资高了），差异为正（Adverse）。可能原因：用了更高技能的工人、加班费等。",analogy:"标准工资率20元/小时，实际支付22元/小时，工作了100小时。工资率差异 = (22-20)×100 = 200元（Adverse）。"}},
            {id:"14-14",category:"人工差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Direct labour efficiency variance</span><span class=\"hint-text\">（直接人工效率差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">AH - SH</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">SR</span>，其中SH是实际产量的标准工时。",explanation:{title:"人工效率差异公式",content:"效率差异衡量工人的生产效率。SH = 实际产量 × 单位标准工时。如果AH>SH（花的时间多了），差异为正（Adverse），说明效率低。",analogy:"做100件产品，标准每件2小时。实际用了250小时。效率差异 = (250-200)×20 = 1000元（Adverse，效率低）。"}},
            {id:"14-15",category:"人工差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Idle time variance</span><span class=\"hint-text\">（闲置时间差异）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Idle time</span> × <span class=\"blank\" onclick=\"revealBlank(this)\">Standard rate</span>，在MA中总是<span class=\"blank\" onclick=\"revealBlank(this)\">Adverse</span><span class=\"hint-text\">（不利）</span>。",explanation:{title:"闲置时间差异",content:"闲置时间是指工人被支付工资但没有工作的时间（如机器故障、等待材料）。这是纯粹的浪费，所以总是不利差异。Idle time = 支付工时 - 工作工时。",analogy:"工人被支付8小时工资，但因为机器故障只工作了7小时。闲置1小时 × 标准工资率20元 = 20元不利差异。"}},
            {id:"14-16",category:"制造费用差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variable overhead total variance</span><span class=\"hint-text\">（变动制造费用总差异）</span>由<span class=\"blank\" onclick=\"revealBlank(this)\">expenditure variance</span><span class=\"hint-text\">（耗费差异）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">efficiency variance</span><span class=\"hint-text\">（效率差异）</span>组成。",explanation:{title:"变动制造费用总差异",content:"变动制造费用差异的分析方法与人工差异类似：耗费差异对应工资率差异，效率差异对应人工效率差异。都以实际工时为基础计算。",analogy:"变动制造费用（如电费）随产量变化。如果机器运转效率低，既影响人工效率差异，也影响变动制造费用效率差异。"}},
            {id:"14-17",category:"制造费用差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variable overhead expenditure variance</span><span class=\"hint-text\">（变动制造费用耗费差异）</span> = 实际变动制造费用 - (<span class=\"blank\" onclick=\"revealBlank(this)\">Standard variable OH rate</span> × 实际工时)。",explanation:{title:"变动制造费用耗费差异",content:"耗费差异衡量实际发生的变动制造费用与按标准费率计算的费用之间的差异。类似于人工工资率差异，反映费用控制水平。",analogy:"标准电费率5元/小时，实际工作100小时应耗500元。实际电费550元。耗费差异 = 550 - 500 = 50元（Adverse）。"}},
            {id:"14-18",category:"制造费用差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variable overhead efficiency variance</span><span class=\"hint-text\">（变动制造费用效率差异）</span> = (实际工时 - 标准工时) × <span class=\"blank\" onclick=\"revealBlank(this)\">Standard variable OH rate</span>。",explanation:{title:"变动制造费用效率差异",content:"效率差异与人工效率差异的计算逻辑相同，都基于工时差异。因为变动制造费用通常按工时分配，所以工时效率直接影响费用效率。",analogy:"标准工时200小时，实际用了250小时，标准费率5元/小时。效率差异 = (250-200)×5 = 250元（Adverse）。"}},
            {id:"14-19",category:"制造费用差异",question:"在吸收成本法下，固定制造费用总差异分为<span class=\"blank\" onclick=\"revealBlank(this)\">expenditure variance</span><span class=\"hint-text\">（耗费差异）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">volume variance</span><span class=\"hint-text\">（产量差异）</span>。",explanation:{title:"固定制造费用差异（吸收成本法）",content:"固定制造费用的特殊性在于它不随产量变化。在吸收成本法下，固定费用被分配到产品中，因此产生产量差异——实际产量与预算产量不同导致的差异。",analogy:"你租了一个车间，月租10000元（固定费用）。如果产量低于预算，分配到每个产品的固定费用就会偏高，产生不利产量差异。"}},
            {id:"14-20",category:"制造费用差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Fixed overhead expenditure variance</span><span class=\"hint-text\">（固定制造费用耗费差异）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Actual fixed overhead</span> - <span class=\"blank\" onclick=\"revealBlank(this)\">Budgeted fixed overhead</span>。",explanation:{title:"固定制造费用耗费差异",content:"耗费差异衡量实际发生的固定费用与预算的差异。这是固定费用差异中唯一与产量无关的差异，反映费用控制能力。",analogy:"预算固定费用100000元，实际发生105000元。耗费差异 = 105000 - 100000 = 5000元（Adverse，超支了）。"}},
            {id:"14-21",category:"制造费用差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Fixed overhead volume variance</span><span class=\"hint-text\">（固定制造费用产量差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Actual production</span> - <span class=\"blank\" onclick=\"revealBlank(this)\">Budgeted production</span>) × 标准固定费用分配率。",explanation:{title:"固定制造费用产量差异",content:"产量差异反映因实际产量与预算产量不同而导致的固定费用吸收差异。实际产量高于预算时，多吸收了固定费用，产生有利差异。",analogy:"预算生产1000件，实际生产1200件。每件标准固定费用10元。产量差异 = (1200-1000)×10 = 2000元（Favourable）。"}},
            {id:"14-22",category:"制造费用差异",question:"固定制造费用产量差异可进一步分解为<span class=\"blank\" onclick=\"revealBlank(this)\">volume efficiency variance</span><span class=\"hint-text\">（产量效率差异）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">volume capacity variance</span><span class=\"hint-text\">（产量能力差异）</span>。",explanation:{title:"产量差异的分解",content:"Volume efficiency variance = (实际工时 - 标准工时) × 标准分配率；Volume capacity variance = (预算工时 - 实际工时) × 标准分配率。两者之和等于产量差异。",analogy:"效率差异看工人的工作效率，能力差异看工厂的产能利用率。如果工人效率高但产能没充分利用，两种差异可能相互抵消。"}},
            {id:"14-23",category:"制造费用差异",question:"在边际成本法下，固定制造费用只有<span class=\"blank\" onclick=\"revealBlank(this)\">expenditure variance</span><span class=\"hint-text\">（耗费差异）</span>，没有<span class=\"blank\" onclick=\"revealBlank(this)\">volume variance</span><span class=\"hint-text\">（产量差异）</span>。",explanation:{title:"固定制造费用差异（边际成本法）",content:"边际成本法将固定制造费用作为期间成本，不分配到产品中。因此不存在因产量变化导致的吸收差异，只有实际与预算的耗费差异。",analogy:"边际成本法就像把房租直接记作当月费用，不管你生产多少产品。所以只有'房租超支了没有'这一个差异。"}},
            {id:"14-24",category:"销售差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sales price variance</span><span class=\"hint-text\">（销售价格差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Actual price - Standard price</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">Actual quantity sold</span>。",explanation:{title:"销售价格差异",content:"销售价格差异衡量因实际售价与标准售价不同而产生的收入差异。实际售价高于标准售价时，差异为Favourable（多赚了）。",analogy:"标准售价100元/件，实际卖110元/件，卖了100件。价格差异 = (110-100)×100 = 1000元（Favourable）。"}},
            {id:"14-25",category:"销售差异",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sales volume variance</span><span class=\"hint-text\">（销售量差异）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Actual quantity - Budgeted quantity</span>) × <span class=\"blank\" onclick=\"revealBlank(this)\">Standard margin</span>。",explanation:{title:"销售量差异",content:"销售量差异衡量因实际销量与预算销量不同而产生的利润差异。Standard margin在吸收成本法下是标准单位利润，在边际成本法下是标准单位贡献边际。",analogy:"预算销售100件，实际销售80件，标准利润20元/件。销量差异 = (80-100)×20 = -400元（Adverse，少卖了）。"}},
            {id:"14-26",category:"销售差异",question:"在吸收成本法下，销售量差异使用<span class=\"blank\" onclick=\"revealBlank(this)\">Standard profit per unit</span><span class=\"hint-text\">（标准单位利润）</span>计算；在边际成本法下，使用<span class=\"blank\" onclick=\"revealBlank(this)\">Standard contribution per unit</span><span class=\"hint-text\">（标准单位贡献边际）</span>。",explanation:{title:"销售量差异的利润基础",content:"吸收成本法的产品成本包含固定制造费用，所以用标准利润。边际成本法的产品成本只含变动成本，所以用标准贡献边际（售价-变动成本）。",analogy:"吸收成本法：利润 = 售价 - 变动成本 - 固定成本分配。边际成本法：贡献边际 = 售价 - 变动成本。两种方法计算销量差异的基础不同。"}},
            {id:"14-27",category:"差异分析",question:"差异之间的相互关系：便宜的材料可能导致<span class=\"blank\" onclick=\"revealBlank(this)\">favourable price variance</span><span class=\"hint-text\">（有利价格差异）</span>但<span class=\"blank\" onclick=\"revealBlank(this)\">adverse usage variance</span><span class=\"hint-text\">（不利用量差异）</span>。",explanation:{title:"差异的相互关系",content:"很多差异之间存在因果关系。便宜的材料可能质量差，导致浪费增加；高技能工人工资高但效率高。分析差异时要综合考虑，不能孤立看待。",analogy:"你买了便宜的面团（有利价格差异），但因为质量差，做蛋糕时浪费了很多（不利用量差异）。两个差异要一起分析才能找到真正原因。"}},
            {id:"14-28",category:"差异分析",question:"高技能员工可能导致<span class=\"blank\" onclick=\"revealBlank(this)\">adverse rate variance</span><span class=\"hint-text\">（不利工资率差异）</span>但<span class=\"blank\" onclick=\"revealBlank(this)\">favourable efficiency variance</span><span class=\"hint-text\">（有利效率差异）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">favourable material usage variance</span><span class=\"hint-text\">（有利材料用量差异）</span>。",explanation:{title:"人工差异的相互关系",content:"高技能员工工资高（不利工资率差异），但工作效率高（有利效率差异），而且可能减少材料浪费（有利材料用量差异）。整体来看可能是划算的。",analogy:"请高级厨师工资高，但他做饭快、浪费少。虽然工资率差异不利，但效率差异和材料用量差异都有利，总体可能更省钱。"}},
            {id:"14-29",category:"差异分析",question:"降低售价可能导致<span class=\"blank\" onclick=\"revealBlank(this)\">adverse sales price variance</span><span class=\"hint-text\">（不利销售价格差异）</span>但<span class=\"blank\" onclick=\"revealBlank(this)\">favourable sales volume variance</span><span class=\"hint-text\">（有利销售量差异）</span>。",explanation:{title:"销售差异的相互关系",content:"降价策略会降低单位利润（不利价格差异），但可能刺激销量增加（有利销量差异）。这是常见的营销策略，需要综合评估整体效果。",analogy:"奶茶店把价格从15元降到12元（不利价格差异），但销量从100杯增加到150杯（有利销量差异）。总收入可能反而增加。"}},
            {id:"14-30",category:"差异分析",question:"差异调查前应考虑的因素：<span class=\"blank\" onclick=\"revealBlank(this)\">Materiality</span><span class=\"hint-text\">（重要性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Controllability</span><span class=\"hint-text\">（可控性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Trends</span><span class=\"hint-text\">（趋势）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Interdependence</span><span class=\"hint-text\">（相互关系）</span>。",explanation:{title:"差异调查的考虑因素",content:"不是所有差异都需要调查。要考虑：差异金额是否重大？是否可控？是否持续出现？是否与其他差异相关？调查成本是否值得？",analogy:"就像体检发现小问题：如果只是轻微异常（不重大）、无法改变（不可控）、只出现一次（无趋势），可能不需要深入检查。"}},
            {id:"14-31",category:"差异分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Operating statement</span><span class=\"hint-text\">（经营报表）</span>是将预算利润调节为实际利润的报表，列示所有<span class=\"blank\" onclick=\"revealBlank(this)\">variances</span><span class=\"hint-text\">（差异）</span>。",explanation:{title:"经营报表",content:"经营报表是差异分析的汇总报告，从预算利润出发，加减各项差异，最终得到实际利润。它帮助管理层理解利润变化的原因。",analogy:"就像你的月度财务总结：计划存1000元，实际存800元，差异分析显示：工资少200元、多花100元、意外支出100元...最后解释了为什么少存200元。"}},
            {id:"14-32",category:"差异分析",question:"在吸收成本法的经营报表中，从<span class=\"blank\" onclick=\"revealBlank(this)\">Budgeted profit</span><span class=\"hint-text\">（预算利润）</span>开始，先调整<span class=\"blank\" onclick=\"revealBlank(this)\">Sales volume profit variance</span><span class=\"hint-text\">（销售量利润差异）</span>得到标准利润。",explanation:{title:"吸收成本法经营报表结构",content:"步骤：预算利润 → 加减销量差异 → 标准利润（实际销量基础）→ 加减销售价格差异 → 实际销售收入减标准销售成本 → 加减各项成本差异 → 实际利润。",analogy:"就像从计划出发逐步调整：计划利润 → 因为销量变化调整 → 因为售价变化调整 → 因为成本变化调整 → 最终实际利润。"}},
            {id:"14-33",category:"差异分析",question:"在边际成本法的经营报表中，从<span class=\"blank\" onclick=\"revealBlank(this)\">Budgeted contribution</span><span class=\"hint-text\">（预算贡献边际）</span>开始，调整各项差异后得到<span class=\"blank\" onclick=\"revealBlank(this)\">Actual contribution</span><span class=\"hint-text\">（实际贡献边际）</span>，再减去固定费用。",explanation:{title:"边际成本法经营报表结构",content:"边际成本法关注贡献边际：预算贡献边际 → 销量差异 → 标准贡献边际 → 价格差异 → 实际贡献边际 → 减固定费用（含耗费差异）→ 实际利润。",analogy:"边际成本法先看'赚了多少边际贡献'，再减去固定费用。这更清楚地显示销量和价格对利润的影响。"}},
            {id:"14-34",category:"差异分析",question:"SQ for actual production = <span class=\"blank\" onclick=\"revealBlank(this)\">Actual production</span> × <span class=\"blank\" onclick=\"revealBlank(this)\">Standard production rate</span><span class=\"hint-text\">（标准生产率）</span>，用于计算用量差异。",explanation:{title:"实际产量的标准用量",content:"比较用量差异时，必须基于相同的产量。所以标准用量要按实际产量调整：SQ = 实际产量 × 单位标准用量。这样才能公平比较效率。",analogy:"计划做100个蛋糕用100kg面粉，实际做了120个蛋糕用了130kg面粉。比较效率时要用：标准用量 = 120×1kg = 120kg，而不是原来的100kg。"}},
            {id:"14-35",category:"差异分析",question:"判断差异F/A的关键：对于<span class=\"blank\" onclick=\"revealBlank(this)\">Cost</span><span class=\"hint-text\">（成本）</span>，实际低于预算是F；对于<span class=\"blank\" onclick=\"revealBlank(this)\">Sales/Revenue</span><span class=\"hint-text\">（销售/收入）</span>，实际高于预算是F。",explanation:{title:"F/A判断原则",content:"成本类差异（材料、人工、制造费用）：实际<预算 = F（省钱了）。收入类差异（销售价格、销售量）：实际>预算 = F（多赚了）。记住：成本越低越好，收入越高越好。",analogy:"成本差异：花得比计划少 = 好事 = Favourable。收入差异：赚得比计划多 = 好事 = Favourable。'好'就是F，'不好'就是A。"}}
        ]},
        {chapter:"15",name:"Chapter 15 Performance Measurement Overview",categories:["绩效衡量概述","使命声明","CSF与KPI","财务绩效指标","非财务指标","行为与外部因素"],cards:[
            {id:"15-1",category:"绩效衡量概述",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Performance measurement</span><span class=\"hint-text\">（绩效衡量）</span>是控制的关键部分，旨在确定某事物或某人在<span class=\"blank\" onclick=\"revealBlank(this)\">relation to a budget</span><span class=\"hint-text\">（相对于预算）</span>方面的表现如何。",explanation:{title:"绩效衡量的定义",content:"绩效衡量是管理控制系统的核心，通过比较实际表现与预算或目标，评估公司、部门、机器、经理或员工的绩效。它帮助管理层发现问题、改进决策。",analogy:"就像学校的考试系统：设定目标（教学大纲），衡量表现（考试分数），比较实际与目标，找出差距并改进。"}},
            {id:"15-2",category:"使命声明",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Mission statement</span><span class=\"hint-text\">（使命声明）</span>描述组织在社会中的<span class=\"blank\" onclick=\"revealBlank(this)\">basic function</span><span class=\"hint-text\">（基本功能）</span>，回答'我们的使命是什么？'。",explanation:{title:"使命声明的定义",content:"使命声明是企业存在的根本原因，说明企业要做什么、为谁服务。它应该简洁、灵活、独特，是企业战略规划的起点。",analogy:"就像你的人生宣言：'我要成为一名优秀的会计师，帮助企业做出更好的财务决策。'这定义了你的方向和目标。"}},
            {id:"15-3",category:"使命声明",question:"使命声明的特征包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Conciseness</span><span class=\"hint-text\">（简洁性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Flexibility</span><span class=\"hint-text\">（灵活性）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">Distinctiveness</span><span class=\"hint-text\">（独特性）</span>。",explanation:{title:"使命声明的三大特征",content:"Conciseness：简短易懂，便于记忆和传播；Flexibility：能适应环境变化；Distinctiveness：让企业与众不同，体现独特价值。",analogy:"就像好的广告语：'Just Do It'——简洁、灵活（适用各种运动）、独特（耐克的标志）。"}},
            {id:"15-4",category:"使命声明",question:"使命声明的要素包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Purpose</span><span class=\"hint-text\">（目的）</span>——为什么存在；<span class=\"blank\" onclick=\"revealBlank(this)\">Strategy</span><span class=\"hint-text\">（战略）</span>——如何实现；<span class=\"blank\" onclick=\"revealBlank(this)\">Values and culture</span><span class=\"hint-text\">（价值观与文化）</span>——信念和原则。",explanation:{title:"使命声明的三大要素",content:"Purpose回答'我们为什么存在'；Strategy包括业务范围、产品服务、核心能力；Values and culture是企业的指导原则和道德立场，包括ESG考量。",analogy:"就像一个人的职业规划：Purpose = 我想帮助别人；Strategy = 成为医生，专攻儿科；Values = 以患者为中心，诚实守信。"}},
            {id:"15-5",category:"使命声明",question:"使命声明的优点：提供<span class=\"blank\" onclick=\"revealBlank(this)\">framework for planning</span><span class=\"hint-text\">（计划框架）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">focus on strategies</span><span class=\"hint-text\">（战略聚焦）</span>、筛选不可接受的项目，建立组织文化。",explanation:{title:"使命声明的优点",content:"使命声明帮助企业明确方向：为计划提供框架、聚焦战略重点、作为筛选项目的标准、传播组织文化。它是战略管理的基石。",analogy:"就像导航的目的地设定：有了明确的目的地，才能规划路线、选择交通工具、判断哪条路更好。"}},
            {id:"15-6",category:"使命声明",question:"使命声明的潜在问题：措辞<span class=\"blank\" onclick=\"revealBlank(this)\">vague and abstract</span><span class=\"hint-text\">（模糊抽象）</span>、可能与<span class=\"blank\" onclick=\"revealBlank(this)\">non-congruent goals</span><span class=\"hint-text\">（不一致的目标）</span>冲突、可能被视为'political window dressing'<span class=\"hint-text\">（政治装饰）</span>。",explanation:{title:"使命声明的潜在问题",content:"使命声明可能过于模糊无法指导实践；不同目标之间可能冲突（如盈利vs客户满意度）；各部门目标可能不一致；有时只是'装饰品'，不反映真实战略。",analogy:"就像新年愿望'我要变得更好'——太模糊，没有具体行动；或者说'我要减肥'但实际天天吃零食——言行不一。"}},
            {id:"15-7",category:"CSF与KPI",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Critical Success Factor (CSF)</span><span class=\"hint-text\">（关键成功因素）</span>是企业必须实现的绩效要求，以确保成功并超越竞争对手。",explanation:{title:"关键成功因素的定义",content:"CSF是企业成功的关键领域，如果这些领域表现不佳，企业就无法实现其目标。CSF帮助企业聚焦最重要的方面。",analogy:"就像开餐厅：CSF可能是食物质量、服务速度、卫生环境。如果这些做不好，餐厅就很难成功。"}},
            {id:"15-8",category:"CSF与KPI",question:"CSF的例子包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Profitability</span><span class=\"hint-text\">（盈利能力）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Market share</span><span class=\"hint-text\">（市场份额）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Productivity</span><span class=\"hint-text\">（生产率）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Product leadership</span><span class=\"hint-text\">（产品领先）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Personnel development</span><span class=\"hint-text\">（人员发展）</span>。",explanation:{title:"常见的CSF类型",content:"CSF因企业而异，但常见类型包括：财务方面（盈利能力）、市场方面（市场份额）、运营方面（生产率、产品领先）、人力资源方面（员工态度、人员发展）。",analogy:"就像学生的CSF：学习成绩（盈利能力）、课外活动（市场份额）、学习效率（生产率）、创新能力（产品领先）。"}},
            {id:"15-9",category:"CSF与KPI",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Key Performance Indicator (KPI)</span><span class=\"hint-text\">（关键绩效指标）</span>是用于<span class=\"blank\" onclick=\"revealBlank(this)\">quantify performance</span><span class=\"hint-text\">（量化绩效）</span>的指标，是衡量CSF实现程度的工具。",explanation:{title:"关键绩效指标的定义",content:"KPI是将CSF转化为可衡量的具体指标。每个CSF应该有对应的KPI来追踪进展。例如，CSF是盈利能力，KPI可以是ROI或利润率。",analogy:"CSF是'我要健康'，KPI是具体的衡量标准：每周运动3次、BMI保持在22、每天睡眠7小时。KPI让抽象的目标变得可衡量。"}},
            {id:"15-10",category:"CSF与KPI",question:"CSF与KPI的关系：CSF是<span class=\"blank\" onclick=\"revealBlank(this)\">what needs to be achieved</span><span class=\"hint-text\">（需要实现什么）</span>，KPI是<span class=\"blank\" onclick=\"revealBlank(this)\">how to measure it</span><span class=\"hint-text\">（如何衡量）</span>。",explanation:{title:"CSF与KPI的关系",content:"CSF定义成功的领域，KPI提供衡量的尺度。例如：CSF = 客户满意度，KPI = 客户投诉率、重复购买率、NPS得分。KPI必须是可量化、可追踪的。",analogy:"CSF就像考试科目（数学、英语），KPI就像具体分数（数学90分、英语85分）。科目定义学习领域，分数衡量表现。"}},
            {id:"15-11",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">ROCE</span><span class=\"hint-text\">（使用资本回报率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PBIT</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Capital employed</span>，其中PBIT是息税前利润。",explanation:{title:"ROCE公式",content:"ROCE (Return on Capital Employed) 衡量企业使用资本的效率。PBIT = Profit Before Interest and Tax = Operating Profit。Capital employed = 总资产 - 流动负债 = 非流动资产 + 净营运资本。",analogy:"ROCE就像投资回报率：你投入100万开餐厅，每年赚15万，ROCE = 15%。这个比率越高，说明资本使用效率越高。"}},
            {id:"15-12",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">ROE</span><span class=\"hint-text\">（股东权益回报率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PAT</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Equity</span>，其中PAT是税后利润。",explanation:{title:"ROE公式",content:"ROE (Return on Equity) 衡量股东投资的回报。PAT = Profit After Tax = Net Profit = Earnings。Equity是股东权益。ROE关注的是股东视角的回报。",analogy:"ROE就像股东的收益率：股东投入50万，公司净利润10万，ROE = 20%。股东关心的是自己投入的钱赚了多少。"}},
            {id:"15-13",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">EPS</span><span class=\"hint-text\">（每股收益）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PAT</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Number of shares</span>，是股东每股股票赚取的利润。",explanation:{title:"EPS公式",content:"EPS (Earnings Per Share) 是上市公司的重要指标，表示每股普通股赚取的净利润。EPS越高，每股股票的价值通常越高。",analogy:"EPS就像每块蛋糕的大小：公司净利润是整个蛋糕，股数是切成的块数。EPS = 每块蛋糕的大小。块数越少或蛋糕越大，每块就越大。"}},
            {id:"15-14",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Asset turnover</span><span class=\"hint-text\">（资产周转率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Sales</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Capital employed</span>，衡量资产产生销售的能力。",explanation:{title:"资产周转率公式",content:"Asset turnover衡量企业利用资产创造收入的效率。比率越高，说明每单位资产创造的销售收入越多。通常以'倍数'表示。",analogy:"资产周转率就像餐厅的翻台率：你有10张桌子，一天服务100桌客人，翻台率 = 10倍。桌子利用得越充分，效率越高。"}},
            {id:"15-15",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Profit margin</span><span class=\"hint-text\">（利润率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Profit</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Sales</span> × 100%，利润可以是毛利、营业利润或净利润。",explanation:{title:"利润率公式",content:"Profit margin衡量每单位销售收入的盈利能力。Gross profit margin = 毛利/销售；Operating profit margin = 营业利润/销售；Net profit margin = 净利润/销售。",analogy:"利润率就像你的储蓄率：月收入1万，存2千，储蓄率 = 20%。收入中有多大比例变成了利润/储蓄。"}},
            {id:"15-16",category:"财务绩效指标",question:"ROCE可以分解为：<span class=\"blank\" onclick=\"revealBlank(this)\">ROCE = Asset turnover × Operating profit margin</span>，这展示了资本回报率的两个驱动因素。",explanation:{title:"ROCE的分解",content:"这个公式揭示了提高ROCE的两条路径：提高资产周转率（更有效地利用资产）或提高利润率（从每笔销售中赚取更多利润）。",analogy:"ROCE就像你的投资收益：收益 = 本金 × 收益率。要提高收益，要么增加本金（资产周转），要么提高收益率（利润率）。"}},
            {id:"15-17",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Financial gearing</span><span class=\"hint-text\">（财务杠杆）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">NCL</span> / (NCL + Equity) × 100%，衡量企业的债务融资比例。",explanation:{title:"财务杠杆公式",content:"Financial gearing反映企业的资本结构中债务的比例。NCL = Non-Current Liability（长期负债）。杠杆越高，财务风险越大，但可能带来更高的股东回报。",analogy:"财务杠杆就像买房贷款：房子100万，贷款70万，自有资金30万。杠杆率 = 70/100 = 70%。贷款越多，杠杆越高，风险也越大。"}},
            {id:"15-18",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Operating gearing</span><span class=\"hint-text\">（经营杠杆）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Contribution</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">PBIT</span> × 100%，衡量经营风险。",explanation:{title:"经营杠杆公式",content:"Operating gearing反映企业成本结构中固定成本的比例。杠杆越高，利润对销量变化越敏感：销量增加时利润增长更快，但销量下降时利润下降也更快。",analogy:"经营杠杆就像固定成本高的餐厅：房租高（固定成本），变动成本低。客人多时赚很多，客人少时亏很多。风险与收益并存。"}},
            {id:"15-19",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Interest cover</span><span class=\"hint-text\">（利息保障倍数）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PBIT</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Interest</span>，衡量企业支付利息的能力。",explanation:{title:"利息保障倍数公式",content:"Interest cover表示企业的营业利润能覆盖利息支出的倍数。倍数越高，企业越有能力支付利息，债务风险越低。一般认为3倍以上较为安全。",analogy:"利息保障倍数就像你的月收入能覆盖房贷的倍数：月收入1万，房贷2千，保障倍数 = 5倍。收入下降20%也还能还房贷。"}},
            {id:"15-20",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Current ratio</span><span class=\"hint-text\">（流动比率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">Current assets</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Current liabilities</span>，衡量短期偿债能力。",explanation:{title:"流动比率公式",content:"Current ratio衡量企业用流动资产偿还流动负债的能力。一般认为2:1是理想水平，但行业差异很大。比率过低可能有流动性风险。",analogy:"流动比率就像你手头的现金能否支付短期账单：你有2万现金和存款，下月要还1万信用卡，流动比率 = 2倍，比较安全。"}},
            {id:"15-21",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Quick ratio</span><span class=\"hint-text\">（速动比率/酸性测试）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Current assets - Inventory</span>) / <span class=\"blank\" onclick=\"revealBlank(this)\">Current liabilities</span>，是更严格的流动性指标。",explanation:{title:"速动比率公式",content:"Quick ratio (Acid test) 排除了存货，因为存货变现可能较慢。一般认为1:1是理想水平。它比流动比率更能反映真实的短期偿债能力。",analogy:"速动比率就像你能在紧急情况下立即变现的资产：现金、股票可以马上卖，但房子、车子变现需要时间。速动比率只算能快速变现的资产。"}},
            {id:"15-22",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Inventory days</span><span class=\"hint-text\">（存货周转天数）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Inventory</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Cost of sales</span>) × 365天，衡量存货管理效率。",explanation:{title:"存货周转天数公式",content:"Inventory days表示存货平均需要多少天才能卖出。天数越少，存货周转越快，资金占用越少。但太低可能意味着缺货风险。",analogy:"存货周转天数就像超市货架上的商品多久卖完：平均存货10万，年销售成本100万，周转天数 = 36.5天。商品约1个月卖完一轮。"}},
            {id:"15-23",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Receivables days</span><span class=\"hint-text\">（应收账款周转天数）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Receivables</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Credit sales</span>) × 365天，衡量应收账款回收速度。",explanation:{title:"应收账款周转天数公式",content:"Receivables days表示企业平均需要多少天收回货款。天数越少，资金回收越快，现金流越好。但太短可能意味着信用政策太严格，影响销售。",analogy:"应收账款天数就像你借钱给朋友多久能收回：借出1万，朋友每月还1千，平均100天收回。收回越快，你的资金周转越灵活。"}},
            {id:"15-24",category:"财务绩效指标",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Payables days</span><span class=\"hint-text\">（应付账款周转天数）</span> = (<span class=\"blank\" onclick=\"revealBlank(this)\">Payables</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Credit purchases or COS</span>) × 365天，衡量付款速度。",explanation:{title:"应付账款周转天数公式",content:"Payables days表示企业平均需要多少天支付供应商货款。天数越长，企业占用供应商资金的时间越长，有利于现金流。但太长可能影响供应商关系。",analogy:"应付账款天数就像你多久付信用卡账单：账单1万，你平均30天付清。付得越慢，你的现金在手时间越长，但可能影响信用。"}},
            {id:"15-25",category:"非财务指标",question:"非财务绩效指标的优点：提供<span class=\"blank\" onclick=\"revealBlank(this)\">early warning signals</span><span class=\"hint-text\">（早期预警信号）</span>、与战略更相关、<span class=\"blank\" onclick=\"revealBlank(this)\">harder to manipulate</span><span class=\"hint-text\">（更难操纵）</span>、提供全面视角。",explanation:{title:"非财务指标的优点",content:"非财务指标（如产品质量、客户满意度）是财务指标的先行指标，能提前预警问题。它们与战略目标联系更紧密，不易被操纵，能提供更全面的绩效视角。",analogy:"非财务指标就像健康体检的预警：血压偏高（非财务指标）预示未来可能有心脏病（财务问题）。早期发现，早期干预。"}},
            {id:"15-26",category:"非财务指标",question:"非财务绩效指标的问题：<span class=\"blank\" onclick=\"revealBlank(this)\">Information overload</span><span class=\"hint-text\">（信息过载）</span>、需要与财务指标关联、管理者可能<span class=\"blank\" onclick=\"revealBlank(this)\">sacrifice overall strategy</span><span class=\"hint-text\">（牺牲整体战略）</span>。",explanation:{title:"非财务指标的问题",content:"非财务指标过多会导致信息过载；需要与财务指标建立因果关系；管理者可能过于关注操作层面而忽视战略层面；需要持续维护和更新。",analogy:"就像手机上装了太多APP，每个都发通知，反而让你不知道该关注什么。非财务指标太多也会让管理者失去焦点。"}},
            {id:"15-27",category:"非财务指标",question:"常见的非财务绩效指标包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Product quality</span><span class=\"hint-text\">（产品质量）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Customer service</span><span class=\"hint-text\">（客户服务）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Delivery reliability</span><span class=\"hint-text\">（交付可靠性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Innovation</span><span class=\"hint-text\">（创新）</span>。",explanation:{title:"常见的非财务指标",content:"在激烈的全球竞争中，这些非财务因素变得至关重要。产品质量影响品牌声誉，客户服务影响忠诚度，交付可靠性影响供应链效率，创新影响长期竞争力。",analogy:"就像评价一家餐厅：不只看利润（财务指标），还要看菜品质量、服务态度、上菜速度、创新能力（非财务指标）。这些最终会影响财务表现。"}},
            {id:"15-28",category:"行为与外部因素",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Short-termism</span><span class=\"hint-text\">（短期主义）</span>是管理者过于关注短期结果而忽视长期利益的行为，如推迟资本支出、削减研发、降低质量。",explanation:{title:"短期主义问题",content:"短期主义是绩效衡量的常见问题。管理者为了达成短期目标，可能牺牲长期发展：推迟设备更新、削减研发投入、降低质量标准、减少培训支出等。",analogy:"短期主义就像学生只关注期末考试分数，不注重真正学会知识。分数可能好看，但长远来看学不到东西。"}},
            {id:"15-29",category:"行为与外部因素",question:"应对短期主义的方法：设定<span class=\"blank\" onclick=\"revealBlank(this)\">realistic short-term targets</span><span class=\"hint-text\">（现实的短期目标）</span>、评估长期和短期目标、将奖励与<span class=\"blank\" onclick=\"revealBlank(this)\">long-term scheme</span><span class=\"hint-text\">（长期计划）</span>挂钩。",explanation:{title:"应对短期主义的方法",content:"解决短期主义需要：设定合理的短期目标、同时评估长短期绩效、将管理者奖励与长期绩效（如股价）挂钩、设定非财务目标与财务目标结合。",analogy:"就像公司给你股票期权而不是现金奖金：你不会只关心今年业绩，而是关心公司长期发展，因为股价取决于长期表现。"}},
            {id:"15-30",category:"行为与外部因素",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Goal congruence</span><span class=\"hint-text\">（目标一致性）</span>是指个人目标与组织目标相一致，管理者奖励与长期计划挂钩可以促进目标一致性。",explanation:{title:"目标一致性",content:"当管理者的个人利益与公司利益一致时，就会产生目标一致性。通过股票期权、长期奖金计划等，让管理者为公司的长期成功而努力。",analogy:"目标一致性就像合伙做生意：你占有股份，公司赚你就赚，公司亏你就亏。你的利益和公司利益完全一致。"}},
            {id:"15-31",category:"行为与外部因素",question:"不同利益相关者关注不同的绩效指标：员工关注<span class=\"blank\" onclick=\"revealBlank(this)\">Morale index</span><span class=\"hint-text\">（士气指数）</span>，股东关注<span class=\"blank\" onclick=\"revealBlank(this)\">Share price and dividend yield</span><span class=\"hint-text\">（股价和股息收益率）</span>。",explanation:{title:"利益相关者的不同关注点",content:"不同利益相关者有不同的利益诉求：员工关心工作环境和士气，股东关心投资回报，政府关心合规性，客户关心产品质量和服务。",analogy:"就像学校里不同的人关注不同的指标：学生关心成绩，家长关心升学率，老师关心教学评价，校长关心学校排名。"}},
            {id:"15-32",category:"行为与外部因素",question:"外部因素对绩效的影响：<span class=\"blank\" onclick=\"revealBlank(this)\">Market conditions</span><span class=\"hint-text\">（市场条件）</span>如经济衰退、<span class=\"blank\" onclick=\"revealBlank(this)\">Competition</span><span class=\"hint-text\">（竞争）</span>对手的行动都会影响企业绩效。",explanation:{title:"外部因素的影响",content:"评估绩效时需要考虑外部环境：经济衰退会普遍影响业绩，竞争对手的降价、新产品发布也会影响市场份额。不能只看内部表现，要考虑外部因素。",analogy:"就像评价学生成绩要考虑考试难度：全班都考得差，可能是试卷太难（市场条件）；隔壁班考得好，可能是他们有更好的补习班（竞争）。"}},
            {id:"15-33",category:"行为与外部因素",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">ESG</span><span class=\"hint-text\">（环境、社会和治理）</span>因素应纳入使命声明和绩效衡量体系，反映企业的社会责任。",explanation:{title:"ESG因素",content:"ESG (Environment, Social, Governance) 是现代企业不可忽视的方面。环境责任（碳排放）、社会责任（员工福利、社区贡献）、公司治理（透明度、道德）都应纳入绩效衡量。",analogy:"ESG就像企业的'社会责任成绩单'：环境方面减少污染，社会方面善待员工和社区，治理方面诚实透明。这些越来越影响企业的长期成功。"}},
            {id:"15-34",category:"行为与外部因素",question:"可持续性对绩效衡量的影响：需要<span class=\"blank\" onclick=\"revealBlank(this)\">stakeholder engagement</span><span class=\"hint-text\">（利益相关者参与）</span>、改善<span class=\"blank\" onclick=\"revealBlank(this)\">risk management</span><span class=\"hint-text\">（风险管理）</span>、利用<span class=\"blank\" onclick=\"revealBlank(this)\">Green finance</span><span class=\"hint-text\">（绿色金融）</span>。",explanation:{title:"可持续性的影响",content:"可持续发展要求企业：深入的利益相关者参与、更好的风险披露（特别是气候风险）、建立绿色金融相关指标。这有助于实现长期战略和科学管理。",analogy:"可持续性就像经营一家百年老店：不只看今年赚多少，还要看能否持续经营下去。需要考虑环境、社会、治理各方面的长期影响。"}},
            {id:"15-35",category:"行为与外部因素",question:"绩效衡量可以是<span class=\"blank\" onclick=\"revealBlank(this)\">Quantitative</span><span class=\"hint-text\">（定量的）</span>或<span class=\"blank\" onclick=\"revealBlank(this)\">Qualitative</span><span class=\"hint-text\">（定性的）</span>，财务指标多为定量，非财务指标可能两者兼有。",explanation:{title:"定量与定性指标",content:"定量指标可以用数字衡量（如利润率、周转天数）；定性指标难以量化（如员工士气、品牌声誉）。好的绩效衡量体系应该结合两者。",analogy:"定量指标就像考试成绩（数字明确），定性指标就像课堂表现（难以量化但很重要）。两者结合才能全面评价学生。"}}
        ]},
        {chapter:"16",name:"Chapter 16 Performance Measurement Application",categories:["制造业绩效","服务业绩效","非营利组织","管理层绩效","平衡计分卡","标杆管理"],cards:[
            {id:"16-1",category:"制造业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard hour</span><span class=\"hint-text\">（标准工时）</span>是在标准绩效下，在一段标准时间内可完成的工作量，是衡量产出的单位。",explanation:{title:"标准工时的定义",content:"Standard hour是一个衡量产出的概念，表示在标准效率下1小时能完成的工作量。它允许不同产品、不同工序的产出用统一标准来衡量，便于比较和汇总。",analogy:"标准工时就像'标准份'的概念：做一份炒饭需要10分钟，做一份汤需要5分钟。如果标准工时是10分钟，那么炒饭=1标准工时，汤=0.5标准工时。"}},
            {id:"16-2",category:"制造业绩效",question:"制造业销售绩效的现代衡量指标包括<span class=\"blank\" onclick=\"revealBlank(this)\">customer rejects/returns</span><span class=\"hint-text\">（客户退货率）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">customer satisfaction</span><span class=\"hint-text\">（客户满意度）</span>。",explanation:{title:"销售绩效的现代衡量",content:"传统销售绩效用价格差异和销量差异衡量。现代以客户为中心的组织更关注客户相关指标：退货率反映产品质量，客户满意度调查反映服务质量。",analogy:"传统方法只看'卖了多少'，现代方法还看'客户满不满意'。就像餐厅不只统计翻台率，还要看顾客评价和投诉率。"}},
            {id:"16-3",category:"制造业绩效",question:"制造业材料绩效的现代衡量指标包括<span class=\"blank\" onclick=\"revealBlank(this)\">number of rejects in materials supplied</span><span class=\"hint-text\">（供应材料次品数）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">timing and reliability of deliveries</span><span class=\"hint-text\">（交付及时性和可靠性）</span>。",explanation:{title:"材料绩效的现代衡量",content:"传统材料绩效用价格差异和用量差异衡量。现代更关注供应链质量：材料质量（次品率）和供应商可靠性（准时交付率）。",analogy:"传统只看'材料花了多少钱、用了多少'，现代还看'材料质量好不好、供应商靠不靠谱'。便宜的次品材料可能带来更大的生产问题。"}},
            {id:"16-4",category:"服务业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Simultaneity/Inseparability</span><span class=\"hint-text\">（同时性/不可分离性）</span>指服务的生产和消费同时发生，服务提供者不能与服务分离。",explanation:{title:"服务的同时性特征",content:"服务的生产和消费是同时进行的，无法像产品那样先生产后销售。这意味着服务无法在交付前进行质量检验，增加了质量控制难度。",analogy:"理发服务：理发师剪头发的同时你就在接受服务，无法先'生产'一个发型再卖给你。理发师的技术水平直接影响你的体验。"}},
            {id:"16-5",category:"服务业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Heterogeneity/Variability</span><span class=\"hint-text\">（异质性/多变性）</span>指每次服务都是独特的，服务标准可能因人、因时、因地而异。",explanation:{title:"服务的异质性特征",content:"由于服务由人提供，每次服务的质量可能不同。同一服务员在不同时间、不同心情下提供的服务可能有差异，难以标准化。",analogy:"餐厅服务：同一个服务员，忙的时候可能服务不周到，闲的时候可能很贴心。每次用餐体验都可能不同，这就是服务的异质性。"}},
            {id:"16-6",category:"服务业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Intangibility</span><span class=\"hint-text\">（无形性）</span>指服务不是实物，难以衡量其投入和产出。",explanation:{title:"服务的无形性特征",content:"服务无法触摸、无法储存、无法展示。这使得服务的衡量比产品困难得多，需要用替代指标来评估服务质量。",analogy:"教育服务：你无法'看到'知识被传授的过程，只能通过考试成绩、学生反馈等间接指标来衡量教学质量。"}},
            {id:"16-7",category:"服务业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Perishability</span><span class=\"hint-text\">（易逝性）</span>指服务无法预先储存，未使用的服务产能会永久损失。",explanation:{title:"服务的易逝性特征",content:"服务无法像产品那样储存。酒店空房、飞机空座、餐厅空桌都是损失。这要求服务企业精确预测需求，平衡产能利用率。",analogy:"酒店房间：今晚没卖出去的房间，明天就'过期'了，无法储存到明天卖。每间空房都是收入损失。"}},
            {id:"16-8",category:"服务业绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Building block model</span><span class=\"hint-text\">（积木模型）</span>提出了服务业绩效衡量的六个维度：竞争绩效、财务绩效、服务质量、灵活性、资源利用、创新。",explanation:{title:"积木模型的六个维度",content:"Fitzgerald提出的积木模型为服务业绩效衡量提供了框架：竞争绩效（市场份额）、财务绩效（盈利能力）、服务质量（客户满意度）、灵活性（响应速度）、资源利用（效率）、创新（新产品开发）。",analogy:"积木模型就像评价一家餐厅的六个方面：客人多不多（竞争）、赚不赚钱（财务）、好不好吃（质量）、能不能加菜（灵活）、员工忙不忙（资源）、有没有新菜（创新）。"}},
            {id:"16-9",category:"服务业绩效",question:"积木模型中，竞争绩效的KPI包括<span class=\"blank\" onclick=\"revealBlank(this)\">sales growth rate</span><span class=\"hint-text\">（销售增长率）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">market share</span><span class=\"hint-text\">（市场份额）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">order conversion rate</span><span class=\"hint-text\">（订单转化率）</span>。",explanation:{title:"竞争绩效的KPI",content:"竞争绩效衡量企业在市场中的表现：销售增长率反映业务扩张，市场份额反映竞争地位，订单转化率（完成订单/网站访问量）反映销售效率。",analogy:"电商网站：1000人浏览，100人下单，转化率10%。转化率越高，说明网站越能吸引客户购买。"}},
            {id:"16-10",category:"服务业绩效",question:"积木模型中，服务质量的KPI包括<span class=\"blank\" onclick=\"revealBlank(this)\">repeat customers/total customers</span><span class=\"hint-text\">（回头客比例）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">customer satisfaction survey</span><span class=\"hint-text\">（客户满意度调查）</span>。",explanation:{title:"服务质量的KPI",content:"服务质量是服务业的核心竞争力。回头客比例反映客户忠诚度，满意度调查直接反映客户对服务质量的评价。",analogy:"餐厅评价：回头客比例高说明菜品和服务好，满意度调查能发现具体哪里做得好、哪里需要改进。"}},
            {id:"16-11",category:"非营利组织",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">NPO</span><span class=\"hint-text\">（非营利组织）</span>的主要目的不是利润最大化，包括慈善机构、教堂、地方政府、学校和医院等。",explanation:{title:"非营利组织的定义",content:"NPO (Not-for-profit Organization) 的目标不是赚钱，而是服务公众、实现社会使命。私营部门的NPO如慈善机构，公共部门的NPO如公立学校、医院。",analogy:"红十字会：目标是救助灾民，不是赚钱。公立学校：目标是教育学生，不是利润最大化。"}},
            {id:"16-12",category:"非营利组织",question:"NPO的特征：目标<span class=\"blank\" onclick=\"revealBlank(this)\">multiple objectives</span><span class=\"hint-text\">（多元目标）</span>、不以利润最大化为驱动、<span class=\"blank\" onclick=\"revealBlank(this)\">limited resources</span><span class=\"hint-text\">（资源有限）</span>、可能不产生收入。",explanation:{title:"NPO的特征",content:"NPO与营利企业不同：有多个可能冲突的目标（如博物馆既要教育公众又要保护文物）、不以盈利为目的、资源有限需要有效利用、可能依靠拨款或捐款而非销售收入。",analogy:"公立医院：目标包括治病救人、医学研究、培训医生、公共卫生教育等。资源有限（政府拨款），不能只看盈利。"}},
            {id:"16-13",category:"非营利组织",question:"NPO绩效衡量的困难：目标多元难以优先排序、目标可能<span class=\"blank\" onclick=\"revealBlank(this)\">conflict with each other</span><span class=\"hint-text\">（相互冲突）</span>、产出难以量化、受政治社会法律约束。",explanation:{title:"NPO绩效衡量的困难",content:"NPO的绩效衡量比企业困难：多个目标难以权衡（如博物馆收门票会影响公众教育）、产出难以量化（如何衡量教育效果？）、政治因素影响大。",analogy:"博物馆困境：收门票可以筹集资金用于保护文物，但会减少参观人数，影响教育公众的目标。两个目标冲突。"}},
            {id:"16-14",category:"非营利组织",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">VFM (Value for Money)</span><span class=\"hint-text\">（物有所值）</span>是评估NPO绩效的常用方法，包括3Es：<span class=\"blank\" onclick=\"revealBlank(this)\">Economy</span><span class=\"hint-text\">（经济性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Efficiency</span><span class=\"hint-text\">（效率性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Effectiveness</span><span class=\"hint-text\">（效果性）</span>。",explanation:{title:"VFM与3Es",content:"VFM是评估公共部门和非营利组织的框架：Economy关注投入成本（省钱），Efficiency关注投入产出比（高效），Effectiveness关注目标达成度（有效）。",analogy:"医院评价：Economy = 药品买得便宜吗？Efficiency = 每位医生看多少病人？Effectiveness = 病人治愈了吗？三者缺一不可。"}},
            {id:"16-15",category:"非营利组织",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Economy</span><span class=\"hint-text\">（经济性）</span>是投入衡量，检查以<span class=\"blank\" onclick=\"revealBlank(this)\">required quality</span><span class=\"hint-text\">（要求的质量）</span>获得投入的成本。",explanation:{title:"经济性的含义",content:"Economy关注'省钱'：在保证质量的前提下，以最低成本获得资源。例如医院购买医疗设备，既要价格合理，又要质量达标。",analogy:"学校买电脑：Economy = 是否以合理价格买到质量合格的电脑？不是越便宜越好，要考虑质量。"}},
            {id:"16-16",category:"非营利组织",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Efficiency</span><span class=\"hint-text\">（效率性）</span>是投入产出衡量，评估资源利用效率，如每位合格医生治疗的病人数。",explanation:{title:"效率性的含义",content:"Efficiency关注'高效'：用最少的投入获得最多的产出。例如每位教师教多少学生、每台设备生产多少产品。",analogy:"餐厅效率：每位服务员服务多少桌客人？效率越高，说明服务员工作越高效。但要注意服务质量不能下降。"}},
            {id:"16-17",category:"非营利组织",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Effectiveness</span><span class=\"hint-text\">（效果性）</span>是产出目标衡量，检查是否达成目标，如病人是否被治愈。",explanation:{title:"效果性的含义",content:"Effectiveness关注'有效'：最终目标是否达成。例如医院的目标是治愈病人，学校的目标是学生学到知识。这是最重要的维度。",analogy:"减肥计划：你可以省钱（Economy）、高效运动（Efficiency），但如果体重没减下来（Effectiveness），计划就是失败的。"}},
            {id:"16-18",category:"管理层绩效",question:"好的绩效衡量指标应具备：<span class=\"blank\" onclick=\"revealBlank(this)\">Goal congruence</span><span class=\"hint-text\">（目标一致性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Motivation</span><span class=\"hint-text\">（激励性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Controllability</span><span class=\"hint-text\">（可控性）</span>。",explanation:{title:"好指标的特征",content:"Goal congruence：管理者目标与公司目标一致；Motivation：目标既不太难也不太易；Controllability：管理者只对自己能控制的事项负责。",analogy:"销售员考核：设定销售目标要合理（激励性），只考核他能控制的市场（可控性），目标与公司利润挂钩（目标一致性）。"}},
            {id:"16-19",category:"管理层绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">ROI (Return on Investment)</span><span class=\"hint-text\">（投资回报率）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PBIT</span> / <span class=\"blank\" onclick=\"revealBlank(this)\">Capital employed</span> × 100%，用于衡量投资中心的绩效。",explanation:{title:"ROI公式",content:"ROI = ROCE，用于衡量投资中心的绩效。PBIT是息税前利润，Capital employed是使用的资本。ROI便于不同规模部门的比较。",analogy:"ROI就像投资收益率：A部门投入100万赚20万，ROI=20%；B部门投入200万赚30万，ROI=15%。A部门效率更高。"}},
            {id:"16-20",category:"管理层绩效",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">RI (Residual Income)</span><span class=\"hint-text\">（剩余收益）</span> = <span class=\"blank\" onclick=\"revealBlank(this)\">PBIT</span> - <span class=\"blank\" onclick=\"revealBlank(this)\">Imputed interest × Capital employed</span>。",explanation:{title:"RI公式",content:"RI是绝对数指标，计算扣除资本成本后的剩余利润。Imputed interest是估算的资本成本率。RI为正说明创造了超过资本成本的价值。",analogy:"RI就像'真正赚的钱'：利润20万，资本成本10万（100万×10%），RI=10万。这10万才是真正为股东创造的价值。"}},
            {id:"16-21",category:"管理层绩效",question:"ROI的优点：广泛使用和接受、是<span class=\"blank\" onclick=\"revealBlank(this)\">relative measure</span><span class=\"hint-text\">（相对指标）</span>便于不同规模部门比较。",explanation:{title:"ROI的优点",content:"ROI是百分比指标，便于不同规模部门的横向比较。例如小部门ROI 15%比大部门ROI 10%效率更高，虽然大部门利润绝对数更大。",analogy:"比较两个学生：小明考90分（满分100），小红考135分（满分150）。用百分比（90% vs 90%）更容易比较谁表现更好。"}},
            {id:"16-22",category:"管理层绩效",question:"RI的优点：是<span class=\"blank\" onclick=\"revealBlank(this)\">absolute measure</span><span class=\"hint-text\">（绝对指标）</span>、可以使用不同资产类型的不同<span class=\"blank\" onclick=\"revealBlank(this)\">rates of interest</span><span class=\"hint-text\">（利率）</span>、考虑了<span class=\"blank\" onclick=\"revealBlank(this)\">cost of finance</span><span class=\"hint-text\">（资金成本）</span>。",explanation:{title:"RI的优点",content:"RI是绝对金额，直观显示创造了多少价值。可以为不同风险等级的资产设定不同的资本成本率，更准确地反映经济现实。",analogy:"RI告诉你'实际赚了多少钱'而不是'赚了百分之几'。对于投资决策，知道赚了100万比知道赚了10%更有意义。"}},
            {id:"16-23",category:"管理层绩效",question:"ROI和RI的缺点：难以确定<span class=\"blank\" onclick=\"revealBlank(this)\">controllable profit</span><span class=\"hint-text\">（可控利润）</span>、资本成本难以准确估算、财务指标容易被操纵、过于简单。",explanation:{title:"ROI和RI的缺点",content:"两个指标都有局限：哪些利润是管理者能控制的？资本成本怎么算？财务指标可能被短期操纵（如削减研发），在复杂环境中可能不够全面。",analogy:"就像只看GPA评价学生：可能忽略了课外活动、领导能力、创新精神等。单一指标无法全面反映表现。"}},
            {id:"16-24",category:"平衡计分卡",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Balanced scorecard</span><span class=\"hint-text\">（平衡计分卡）</span>从四个维度衡量绩效：<span class=\"blank\" onclick=\"revealBlank(this)\">Financial</span><span class=\"hint-text\">（财务）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Customer</span><span class=\"hint-text\">（客户）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Internal</span><span class=\"hint-text\">（内部流程）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Learning and growth</span><span class=\"hint-text\">（学习与成长）</span>。",explanation:{title:"平衡计分卡的四个维度",content:"平衡计分卡由Kaplan和Norton提出，从四个平衡的维度衡量组织绩效：财务（股东视角）、客户（客户视角）、内部流程（运营视角）、学习与成长（长期发展视角）。",analogy:"平衡计分卡就像体检报告：不只看体重（财务），还要看血压（客户）、心率（内部流程）、生活习惯（学习成长）。全面评估健康状况。"}},
            {id:"16-25",category:"平衡计分卡",question:"平衡计分卡的财务维度回答：<span class=\"blank\" onclick=\"revealBlank(this)\">How a company looks to its shareholders</span><span class=\"hint-text\">（公司对股东来说表现如何）</span>？KPI包括毛利率、净利率、ROI等。",explanation:{title:"财务维度",content:"财务维度关注股东利益：盈利能力、增长、股东价值。CSF包括成本降低、盈利能力、增长；KPI包括毛利率、ROI、新客户收入占比等。",analogy:"财务维度就像投资者的视角：这家公司赚不赚钱？利润率多少？投资回报如何？"}},
            {id:"16-26",category:"平衡计分卡",question:"平衡计分卡的客户维度回答：<span class=\"blank\" onclick=\"revealBlank(this)\">How should we appear to our customers</span><span class=\"hint-text\">（我们应该如何向客户展示自己）</span>？KPI包括新产品销售占比、交付时间等。",explanation:{title:"客户维度",content:"客户维度关注客户价值主张：产品、价格、质量、时间。CSF包括新产品、价格竞争力、质量、及时交付；KPI包括新产品销售占比、缺陷率、交付周期等。",analogy:"客户维度就像顾客的评价：产品好不好？价格贵不贵？质量可靠吗？送货快不快？"}},
            {id:"16-27",category:"平衡计分卡",question:"平衡计分卡的内部流程维度回答：<span class=\"blank\" onclick=\"revealBlank(this)\">What must we excel at</span><span class=\"hint-text\">（我们必须在哪些方面做到卓越）</span>？关注关键业务流程。",explanation:{title:"内部流程维度",content:"内部流程维度关注核心能力：运营流程、生产力、售后服务。CSF包括运营效率、生产力、售后服务质量；KPI包括周期时间、单位成本、返工时间等。",analogy:"内部流程就像餐厅后厨：食材处理快不快？出菜效率高不高？有问题能否快速解决？"}},
            {id:"16-28",category:"平衡计分卡",question:"平衡计分卡的学习与成长维度回答：<span class=\"blank\" onclick=\"revealBlank(this)\">Can we continue to improve and create value</span><span class=\"hint-text\">（我们能否持续改进和创造价值）</span>？关注人力资本投资。",explanation:{title:"学习与成长维度",content:"学习与成长维度关注长期发展能力：员工能力、内部学习、技术领先、创新。CSF包括员工发展、技术能力、创新能力；KPI包括员工流失率、建议采纳数、新产品开发周期等。",analogy:"学习与成长就像个人发展：你在学习新技能吗？知识在更新吗？有创新能力吗？这决定了未来的竞争力。"}},
            {id:"16-29",category:"平衡计分卡",question:"平衡计分卡的优点：衡量方式多样（财务与非财务、内部与外部、短期与长期、定量与定性）、管理者<span class=\"blank\" onclick=\"revealBlank(this)\">unlikely to distort</span><span class=\"hint-text\">（难以操纵）</span>绩效指标。",explanation:{title:"平衡计分卡的优点",content:"平衡计分卡提供全面视角，不只依赖单一财务指标。多维度衡量使管理者难以通过牺牲一方面来操纵另一方面（如削减研发提高短期利润）。",analogy:"平衡计分卡就像全面体检：不只看体重，还看血压、心率、骨密度等。你想'作弊'也很难，因为要同时满足多个指标。"}},
            {id:"16-30",category:"平衡计分卡",question:"平衡计分卡的缺点：指标之间可能<span class=\"blank\" onclick=\"revealBlank(this)\">conflict</span><span class=\"hint-text\">（冲突）</span>、选择指标困难、获取信息困难（尤其是竞争对手数据）、<span class=\"blank\" onclick=\"revealBlank(this)\">information overload</span><span class=\"hint-text\">（信息过载）</span>。",explanation:{title:"平衡计分卡的缺点",content:"多维度指标可能相互冲突（如提高质量可能增加成本）；选择哪些指标是CSF需要判断；获取竞争对手数据困难；指标太多导致信息过载；非财务管理者可能缺乏财务知识。",analogy:"平衡计分卡就像同时追求多个目标：想减肥、想增肌、想省钱、想省时间——这些目标可能冲突，需要权衡取舍。"}},
            {id:"16-31",category:"标杆管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Benchmarking</span><span class=\"hint-text\">（标杆管理）</span>是通过识别最佳实践并与自身运营比较，以实现绩效改进的方法。",explanation:{title:"标杆管理的定义",content:"标杆管理是一种持续改进工具：找到行业最佳实践，比较自己与标杆的差距，学习并改进。它帮助企业了解'我们与最好还有多大差距'。",analogy:"标杆管理就像学习榜样：找到班上成绩最好的同学，分析他的学习方法，对比自己的不足，然后改进。"}},
            {id:"16-32",category:"标杆管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Internal benchmarking</span><span class=\"hint-text\">（内部标杆）</span>是在同一组织内比较不同部门的相同功能。",explanation:{title:"内部标杆管理",content:"内部标杆是在公司内部找最佳实践：比较不同分公司、不同部门的相同功能。优点是数据容易获取，缺点是可能不是真正的'最佳'。",analogy:"连锁餐厅：比较所有分店的服务质量，找出最好的那家，让其他分店学习。但可能整个公司的水平都不如竞争对手。"}},
            {id:"16-33",category:"标杆管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Functional benchmarking</span><span class=\"hint-text\">（功能标杆）</span>是将内部功能与外部最佳实践者比较，<span class=\"blank\" onclick=\"revealBlank(this)\">regardless of the industry</span><span class=\"hint-text\">（不限行业）</span>。",explanation:{title:"功能标杆管理",content:"功能标杆跨行业比较相同功能：如制药公司学习食品公司的销售流程。优点是可能发现创新做法，缺点是行业差异可能使比较不适用。",analogy:"餐厅学习航空公司的服务流程：虽然行业不同，但'客户服务'这个功能是相通的，可能学到新的服务理念。"}},
            {id:"16-34",category:"标杆管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Competitive benchmarking</span><span class=\"hint-text\">（竞争标杆）</span>是直接与竞争对手比较绩效。",explanation:{title:"竞争标杆管理",content:"竞争标杆直接与同行业竞争对手比较：价格、质量、服务、效率等。优点是直接了解竞争地位，缺点是竞争对手可能不愿分享信息。",analogy:"两家餐厅比较：谁的菜品更好？价格更低？服务更快？直接与对手比较，了解自己的市场地位。"}},
            {id:"16-35",category:"标杆管理",question:"标杆管理的优点：适用于公共和私营部门、有助于<span class=\"blank\" onclick=\"revealBlank(this)\">continuous improvement</span><span class=\"hint-text\">（持续改进）</span>、识别需要改进的流程、帮助成本降低。",explanation:{title:"标杆管理的优点",content:"标杆管理是灵活的改进工具：适用于各种组织，帮助识别差距和改进机会，推动持续改进，提高运营效率，降低成本。",analogy:"标杆管理就像有目标的学习：知道'最好的'是什么样的，就有了努力方向。持续向标杆学习，不断进步。"}}
        ]},
        {chapter:"17",name:"Chapter 17 Cost Management",categories:["成本控制与降低","效率提升","工作研究","价值分析"],cards:[
            {id:"17-1",category:"成本控制与降低",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost control</span><span class=\"hint-text\">（成本控制）</span>是调节成本、将成本保持在<span class=\"blank\" onclick=\"revealBlank(this)\">acceptable limits</span><span class=\"hint-text\">（可接受范围内）</span>的过程。",explanation:{title:"成本控制的定义",content:"成本控制是确保成本不超过预算或标准的活动。它关注的是'控制'——防止成本过度增长，而不是主动降低成本水平。",analogy:"成本控制就像控制体重：设定目标体重（预算），监控体重变化（实际成本），如果超标就调整饮食运动（采取措施）。目标是保持，不是减肥。"}},
            {id:"17-2",category:"成本控制与降低",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost reduction</span><span class=\"hint-text\">（成本降低）</span>是主动减少支出，目标是将成本降低到<span class=\"blank\" onclick=\"revealBlank(this)\">below current budget levels</span><span class=\"hint-text\">（当前预算水平以下）</span>。",explanation:{title:"成本降低的定义",content:"成本降低是主动寻求降低成本的方法，目标是比现有水平更低。与成本控制不同，成本降低是主动进攻，成本控制是被动防守。",analogy:"成本降低就像减肥：不只是保持体重（控制），而是主动减少体重（降低）。需要改变饮食结构、增加运动等积极措施。"}},
            {id:"17-3",category:"成本控制与降低",question:"成本降低的两种方法：<span class=\"blank\" onclick=\"revealBlank(this)\">Crash programs</span><span class=\"hint-text\">（紧急计划）</span>是对现金流或盈利问题的反应；<span class=\"blank\" onclick=\"revealBlank(this)\">Planned programs</span><span class=\"hint-text\">（计划项目）</span>是持续评估以预防紧急情况。",explanation:{title:"两种成本降低方法",content:"Crash programs是被动应对：出现问题时才紧急削减开支。Planned programs是主动预防：即使经营良好也持续寻找降低成本的机会。",analogy:"Crash programs就像生病了才去看医生（被动），Planned programs就像定期体检、健康生活（主动）。显然，主动预防更好。"}},
            {id:"17-4",category:"成本控制与降低",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variety reduction</span><span class=\"hint-text\">（品种减少）</span>是通过减少产品种类来<span class=\"blank\" onclick=\"revealBlank(this)\">achieve economic scale</span><span class=\"hint-text\">（实现规模经济）</span>并增加自动化机会。",explanation:{title:"品种减少策略",content:"产品种类太多会导致每种产品产量低，无法实现规模经济。减少品种可以增加单一产品产量，降低单位成本，也便于自动化生产。",analogy:"餐厅菜单：如果菜单有100道菜，每种食材都买一点，成本高、浪费多。精简到20道招牌菜，食材可以大量采购，成本降低，质量也更稳定。"}},
            {id:"17-5",category:"效率提升",question:"提高材料使用效率的方法：改变材料规格、引入<span class=\"blank\" onclick=\"revealBlank(this)\">new equipment</span><span class=\"hint-text\">（新设备）</span>减少浪费、<span class=\"blank\" onclick=\"revealBlank(this)\">earlier stage identification</span><span class=\"hint-text\">（早期识别）</span>次品、使用更高质量材料。",explanation:{title:"提高材料使用效率",content:"材料浪费是成本的重要来源。方法包括：优化材料规格、使用先进设备减少加工损耗、尽早发现次品避免后续浪费、使用高质量材料减少次品率。",analogy:"做菜减少浪费：切菜技巧提高（改变方法）、用好刀减少切坏（新设备）、发现坏菜叶马上扔掉（早期识别）、买新鲜菜减少烂掉（高质量材料）。"}},
            {id:"17-6",category:"效率提升",question:"提高劳动生产率的方法：奖励激励、<span class=\"blank\" onclick=\"revealBlank(this)\">co-operation between departments</span><span class=\"hint-text\">（部门协作）</span>实现协同效应、消除不必要程序、设定更具挑战性的<span class=\"blank\" onclick=\"revealBlank(this)\">efficiency standards</span><span class=\"hint-text\">（效率标准）</span>。",explanation:{title:"提高劳动生产率",content:"劳动生产率是单位时间产出。提高方法：物质激励（奖金）、部门协作（减少内耗）、简化流程（消除浪费）、设定更高标准（推动进步）。",analogy:"提高学习效率：奖励自己（激励）、和同学合作（协作）、删除无效学习方法（简化程序）、设定更高目标（挑战性标准）。"}},
            {id:"17-7",category:"效率提升",question:"提高设备效率的方法：<span class=\"blank\" onclick=\"revealBlank(this)\">better use of equipment resources</span><span class=\"hint-text\">（更好利用设备资源）</span>、平衡<span class=\"blank\" onclick=\"revealBlank(this)\">preventive maintenance</span><span class=\"hint-text\">（预防性维护）</span>与维修停机时间。",explanation:{title:"提高设备效率",content:"设备效率受利用率和故障率影响。提高方法：充分利用设备产能（减少闲置）、做好预防性维护（减少故障）、平衡维护与生产时间。",analogy:"汽车保养：定期保养（预防性维护）可以减少大修（维修停机）。但保养太频繁也会占用使用时间，需要平衡。"}},
            {id:"17-8",category:"成本控制与降低",question:"降低材料价格的方法：获得<span class=\"blank\" onclick=\"revealBlank(this)\">bulk purchase discounts</span><span class=\"hint-text\">（批量采购折扣）</span>、材料<span class=\"blank\" onclick=\"revealBlank(this)\">standardization</span><span class=\"hint-text\">（标准化）</span>、向更多供应商<span class=\"blank\" onclick=\"revealBlank(this)\">call for bids</span><span class=\"hint-text\">（招标）</span>。",explanation:{title:"降低材料价格",content:"材料价格直接影响成本。降低方法：大量采购获得折扣、使用标准材料而非特殊材料（更便宜）、引入竞争让更多供应商报价。",analogy:"买菜省钱：一次买很多可以讲价（批量折扣）、买普通菜而不是有机菜（标准化）、多问几家菜市场比价（招标）。"}},
            {id:"17-9",category:"成本控制与降低",question:"降低人工费率的方法：直接降薪可能影响<span class=\"blank\" onclick=\"revealBlank(this)\">morale</span><span class=\"hint-text\">（士气）</span>，可行方法包括提供更多休息时间、不必要工作使用<span class=\"blank\" onclick=\"revealBlank(this)\">part-time</span><span class=\"hint-text\">（兼职）</span>、迁址到低工资地区。",explanation:{title:"降低人工费率",content:"直接降薪会打击员工积极性，通常不可行。替代方法：用休息时间替代部分工资、非核心工作用兼职员工、搬迁到工资较低的地区。",analogy:"公司降成本不能直接给员工降薪（会离职），可以：增加假期但工资不变、非核心工作外包、把办公室搬到郊区（租金和工资都低）。"}},
            {id:"17-10",category:"成本控制与降低",question:"其他成本降低方法：使用<span class=\"blank\" onclick=\"revealBlank(this)\">ABC</span><span class=\"hint-text\">（作业成本法）</span>识别非增值活动、使用<span class=\"blank\" onclick=\"revealBlank(this)\">JIT</span><span class=\"hint-text\">（准时制）</span>减少库存成本、使用标准成本法、目标成本法、生命周期成本法。",explanation:{title:"其他成本降低方法",content:"现代成本管理工具：ABC帮助识别和消除非增值活动；JIT减少库存持有成本；标准成本法控制成本偏差；目标成本法和生命周期成本法从产品设计阶段控制成本。",analogy:"各种工具各有用途：ABC像显微镜找出浪费；JIT像零库存管理；标准成本法像预算控制；目标成本法像倒推计算——先确定售价，再倒推成本上限。"}},
            {id:"17-11",category:"成本控制与降低",question:"降低财务成本的方法：争取供应商<span class=\"blank\" onclick=\"revealBlank(this)\">early payment discount</span><span class=\"hint-text\">（早付款折扣）</span>、重新评估给客户的早付款折扣政策、<span class=\"blank\" onclick=\"revealBlank(this)\">decrease receivables days</span><span class=\"hint-text\">（减少应收账款天数）</span>、重新评估融资来源。",explanation:{title:"降低财务成本",content:"财务成本包括利息支出、机会成本等。降低方法：利用供应商早付款折扣、优化给客户的折扣政策、加速应收账款回收、寻找更便宜的融资渠道。",analogy:"个人理财：信用卡按时还款避免利息（早付款）、不随便给别人赊账（减少应收款）、比较不同银行贷款利率（重新评估融资来源）。"}},
            {id:"17-12",category:"工作研究",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Work study</span><span class=\"hint-text\">（工作研究）</span>是确定使用劳动力、材料和机器最有效方法的技术，包括<span class=\"blank\" onclick=\"revealBlank(this)\">Method study</span><span class=\"hint-text\">（方法研究）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">Work measurement</span><span class=\"hint-text\">（工作衡量）</span>。",explanation:{title:"工作研究的定义",content:"工作研究是科学管理方法，通过系统分析工作方法和工作时间，找出最有效率的工作方式。它包含两个部分：方法研究（怎么做）和工作衡量（做多久）。",analogy:"工作研究就像优化学习过程：方法研究是找出最高效的学习方法，工作衡量是确定完成作业需要多少时间。两者结合，提高学习效率。"}},
            {id:"17-13",category:"工作研究",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Method study</span><span class=\"hint-text\">（方法研究）</span>是系统分析和改进工作方法，以找出<span class=\"blank\" onclick=\"revealBlank(this)\">most efficient method</span><span class=\"hint-text\">（最有效方法）</span>。",explanation:{title:"方法研究",content:"方法研究关注'如何做'：分析现有工作流程，找出不必要的动作、等待时间、运输距离等，设计更高效的工作方法。",analogy:"方法研究就像优化做菜流程：分析切菜、炒菜、装盘的顺序，发现可以边炒菜边切下道菜的食材，节省时间。重新设计流程，提高效率。"}},
            {id:"17-14",category:"工作研究",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Work measurement</span><span class=\"hint-text\">（工作衡量）</span>是确定在标准条件下完成一项工作所需的<span class=\"blank\" onclick=\"revealBlank(this)\">standard time</span><span class=\"hint-text\">（标准时间）</span>。",explanation:{title:"工作衡量",content:"工作衡量关注'做多久'：通过时间研究、工作抽样等方法，确定完成各项工作任务的标准时间，用于制定生产计划、计算人工成本。",analogy:"工作衡量就像考试规定时间：通过测试确定学生完成试卷需要多少时间，设定合理的考试时长。企业用它来确定生产定额。"}},
            {id:"17-15",category:"工作研究",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Organisation and methods (O&M)</span><span class=\"hint-text\">（组织与方法）</span>是对行政和办公程序进行系统分析，以产生更高效的方法。",explanation:{title:"组织与方法",content:"O&M是工作研究在办公室的应用：分析办公室布局、工作流程、文书工作、办公自动化等，提高行政效率。",analogy:"O&M就像整理办公室：重新安排工位布局减少走动、简化审批流程减少等待、用电子邮件替代纸质文件、引入办公软件自动化。"}},
            {id:"17-16",category:"工作研究",question:"O&M的应用领域包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Office layout</span><span class=\"hint-text\">（办公室布局）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Work flow</span><span class=\"hint-text\">（工作流程）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Paper work elimination</span><span class=\"hint-text\">（消除文书工作）</span>、Office mechanization（办公机械化）。",explanation:{title:"O&M的应用领域",content:"O&M关注办公室效率：优化空间布局减少走动、理顺工作流程减少等待、用电子化替代纸质文件、引入办公设备提高效率。",analogy:"O&M就像家庭整理：重新摆放家具（布局）、优化做家务顺序（流程）、用手机APP替代纸质账本（消除文书）、买洗碗机（机械化）。"}},
            {id:"17-17",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Value analysis</span><span class=\"hint-text\">（价值分析）</span>是一种有计划的、科学的成本降低方法，审查产品的材料组成和设计，进行<span class=\"blank\" onclick=\"revealBlank(this)\">modifications and improvements</span><span class=\"hint-text\">（修改和改进）</span>而不降低产品价值。",explanation:{title:"价值分析的定义",content:"价值分析是对现有产品的系统审查，寻找在不降低客户价值的前提下降低成本的机会。它关注的是'价值'——客户愿意付费的功能。",analogy:"价值分析就像重新设计菜品：分析每道菜的食材成本，发现有些昂贵食材对味道影响不大，可以用便宜食材替代而不影响顾客满意度。"}},
            {id:"17-18",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Value engineering</span><span class=\"hint-text\">（价值工程）</span>是将价值分析技术应用于<span class=\"blank\" onclick=\"revealBlank(this)\">new products</span><span class=\"hint-text\">（新产品）</span>，使新产品以最低成本设计开发到给定的价值水平。",explanation:{title:"价值工程的定义",content:"价值工程是价值分析在新产品开发阶段的应用。在产品设计时就考虑成本，比产品上市后再降成本更有效。",analogy:"价值分析是'老产品改造'，价值工程是'新产品预防'。就像治病：价值分析是治疗已有疾病，价值工程是预防疾病发生。预防胜于治疗。"}},
            {id:"17-19",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost value</span><span class=\"hint-text\">（成本价值）</span>是生产和销售一个物品的成本，即企业的<span class=\"blank\" onclick=\"revealBlank(this)\">cost of producing and selling</span><span class=\"hint-text\">（生产和销售成本）</span>。",explanation:{title:"成本价值",content:"成本价值是从企业角度看的'价值'——生产这个产品花了多少钱。这是价值分析中需要降低的部分。",analogy:"成本价值就像餐厅的菜品成本：食材、人工、房租、水电等加起来，做一道菜的成本是20元。这是餐厅想降低的。"}},
            {id:"17-20",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Exchange value</span><span class=\"hint-text\">（交换价值）</span>是产品或服务的<span class=\"blank\" onclick=\"revealBlank(this)\">Market value</span><span class=\"hint-text\">（市场价值）</span>，即产品能卖多少钱。",explanation:{title:"交换价值",content:"交换价值是从市场角度看的'价值'——这个产品在市场上值多少钱。交换价值决定了产品的定价上限。",analogy:"交换价值就像餐厅菜品的售价：一道菜成本20元，但市场能接受的价格是50元。50元就是交换价值。"}},
            {id:"17-21",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Use value</span><span class=\"hint-text\">（使用价值/效用价值）</span>是产品所做的事情，它满足的<span class=\"blank\" onclick=\"revealBlank(this)\">purpose</span><span class=\"hint-text\">（目的）</span>或功能。",explanation:{title:"使用价值",content:"使用价值是从功能角度看的'价值'——这个产品能做什么，满足什么需求。使用价值是客户购买产品的根本原因。",analogy:"使用价值就像买手机的原因：打电话、上网、拍照。这些功能就是使用价值。客户买的是功能，不是手机本身。"}},
            {id:"17-22",category:"价值分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Esteem value</span><span class=\"hint-text\">（声望价值）</span>是客户因产品的美观、工艺等而赋予产品的<span class=\"blank\" onclick=\"revealBlank(this)\">prestige</span><span class=\"hint-text\">（声望/地位）</span>。",explanation:{title:"声望价值",content:"声望价值是从情感角度看的'价值'——产品带来的心理满足、社会地位、审美享受。奢侈品的高价主要来自声望价值。",analogy:"声望价值就像名牌包的价值：一个LV包和普通包的功能一样（使用价值），但LV包让人感觉有身份、有品味（声望价值）。"}},
            {id:"17-23",category:"价值分析",question:"价值的四个方面关系：企业希望<span class=\"blank\" onclick=\"revealBlank(this)\">Cost value</span><span class=\"hint-text\">（成本价值）</span>低于<span class=\"blank\" onclick=\"revealBlank(this)\">Exchange value</span><span class=\"hint-text\">（交换价值）</span>以获得利润；客户关注<span class=\"blank\" onclick=\"revealBlank(this)\">Use value</span><span class=\"hint-text\">（使用价值）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">Esteem value</span><span class=\"hint-text\">（声望价值）</span>。",explanation:{title:"四种价值的关系",content:"企业视角：成本价值 < 交换价值 = 利润。客户视角：使用价值 + 声望价值 = 购买理由。价值分析的目标是在不降低使用价值和声望价值的前提下降低成本价值。",analogy:"餐厅：成本20元 < 售价50元 = 利润30元。顾客：好吃（使用价值）+ 环境好（声望价值）= 愿意付50元。餐厅想降低成本但不影响顾客体验。"}},
            {id:"17-24",category:"价值分析",question:"价值分析的步骤：①确定客户<span class=\"blank\" onclick=\"revealBlank(this)\">precise requirement</span><span class=\"hint-text\">（精确需求）</span>；②建立并评估<span class=\"blank\" onclick=\"revealBlank(this)\">alternative ways</span><span class=\"hint-text\">（替代方法）</span>；③中层评估和高层批准；④<span class=\"blank\" onclick=\"revealBlank(this)\">Implementation</span><span class=\"hint-text\">（实施）</span>；⑤评估反馈。",explanation:{title:"价值分析的步骤",content:"价值分析是系统化过程：先了解客户真正需要什么，再寻找满足需求的多种方法，评估选择最佳方案，获得管理层批准后实施，最后评估效果。",analogy:"价值分析就像装修房子：①确定需求（几个房间、什么风格）；②设计方案（找几个装修公司报价）；③评估选择（比较方案和预算）；④施工（实施）；⑤验收（评估反馈）。"}},
            {id:"17-25",category:"价值分析",question:"价值分析的优点：提高<span class=\"blank\" onclick=\"revealBlank(this)\">product performance</span><span class=\"hint-text\">（产品性能）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">reliability</span><span class=\"hint-text\">（可靠性）</span>、提升产品质量、延长产品寿命、缩短交付时间、增强标准化、优化稀缺资源配置、促进创新。",explanation:{title:"价值分析的优点",content:"价值分析不只降低成本，还能提升产品：性能更好、更可靠、质量更高、寿命更长。同时改善运营效率：交付更快、标准化更好、资源配置更优。还能激发员工创新。",analogy:"价值分析就像健康减肥：不只是减重（降成本），还让身体更健康（提质量）、精力更充沛（提效率）、养成好习惯（标准化）、学会新技能（创新）。"}},
            {id:"17-26",category:"价值分析",question:"价值分析中，<span class=\"blank\" onclick=\"revealBlank(this)\">standardization</span><span class=\"hint-text\">（标准化）</span>是重要好处之一，可以减少零件种类、简化生产流程、降低库存成本。",explanation:{title:"标准化在价值分析中的作用",content:"标准化是价值分析的重要成果：使用标准零件替代特殊零件、统一规格减少库存种类、简化生产流程。标准化带来规模经济和效率提升。",analogy:"标准化就像宜家家具：很多家具使用相同规格的螺丝和配件，大规模生产降低成本，库存管理简化，维修更换方便。"}},
            {id:"17-27",category:"价值分析",question:"价值分析促进<span class=\"blank\" onclick=\"revealBlank(this)\">innovation</span><span class=\"hint-text\">（创新）</span>，让员工变得更有创造力，因为他们需要思考如何在不降低价值的前提下降低成本。",explanation:{title:"价值分析促进创新",content:"价值分析要求员工跳出常规思维：如何在保持功能的前提下用更便宜的材料？如何简化设计？这种思考过程激发创新，可能发现全新的解决方案。",analogy:"价值分析就像创意挑战：给你有限预算做一顿大餐，你必须创新——用便宜食材做出美味、用简单方法做出复杂效果。限制反而激发创造力。"}},
            {id:"17-28",category:"效率提升",question:"提高劳动效率的工作方法改进包括：<span class=\"blank\" onclick=\"revealBlank(this)\">Work study</span><span class=\"hint-text\">（工作研究）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">Organisation and methods</span><span class=\"hint-text\">（组织与方法）</span>。",explanation:{title:"工作方法改进",content:"工作研究用于生产环境：方法研究优化操作流程，工作衡量设定标准时间。O&M用于办公环境：优化办公室布局和行政流程。两者都是科学管理方法。",analogy:"工厂用工作研究优化流水线，办公室用O&M优化行政流程。就像医生用不同方法治疗不同科室的病人——内科用药，外科手术。"}},
            {id:"17-29",category:"效率提升",question:"提高材料效率可以通过<span class=\"blank\" onclick=\"revealBlank(this)\">identifying poor quality output</span><span class=\"hint-text\">（识别次品）</span>在运营流程的<span class=\"blank\" onclick=\"revealBlank(this)\">earlier stage</span><span class=\"hint-text\">（早期阶段）</span>来实现。",explanation:{title:"早期识别次品",content:"次品发现得越早，浪费越少。在早期阶段发现次品，可以避免在后续工序继续投入材料、人工、机器时间。质量控制点应该前移。",analogy:"早期发现次品就像考试前发现错误：如果在复习时发现（早期），可以改正；如果在考试时才发现（晚期），已经来不及了。越早发现，损失越小。"}},
