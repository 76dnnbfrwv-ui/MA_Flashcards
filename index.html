    <script>
        const chapterData = [
            {chapter:"intro",name:"Introduction 财务会计基础",categories:["基本概念","会计等式","财务报表","复式记账","会计假设"],cards:[
                {id:"intro-1",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Financial Accounting</span><span class=\"hint-text\">（财务会计）</span>是为<span class=\"blank\" onclick=\"revealBlank(this)\">external stakeholders</span><span class=\"hint-text\">（外部利益相关者）</span>提供财务信息的会计分支。",explanation:{title:"财务会计定义",content:"财务会计的主要目标是向外部使用者提供有关企业财务状况、经营成果和现金流量的信息。",analogy:"就像公司的年度报告，给投资者和债权人看的。"}},
                {id:"intro-2",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Management Accounting</span><span class=\"hint-text\">（管理会计）</span>是为<span class=\"blank\" onclick=\"revealBlank(this)\">internal management</span><span class=\"hint-text\">（内部管理层）</span>提供决策支持的会计分支。",explanation:{title:"管理会计定义",content:"管理会计不对外公开，主要用于内部规划、控制和决策。",analogy:"就像公司内部的财务分析报告，给经理们做决策用的。"}},
                {id:"intro-3",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Assets</span><span class=\"hint-text\">（资产）</span>是企业拥有或控制的能产生<span class=\"blank\" onclick=\"revealBlank(this)\">future economic benefits</span><span class=\"hint-text\">（未来经济利益）</span>的资源。",explanation:{title:"资产定义",content:"资产是企业的经济资源，包括现金、存货、固定资产等。",analogy:"就像你名下的房子、车子、存款都是你的资产。"}},
                {id:"intro-4",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Liabilities</span><span class=\"hint-text\">（负债）</span>是企业需要偿还的<span class=\"blank\" onclick=\"revealBlank(this)\">obligations</span><span class=\"hint-text\">（债务或义务）</span>。",explanation:{title:"负债定义",content:"负债是企业的债务，如应付账款、贷款等。",analogy:"就像你欠银行的房贷、欠朋友的钱都是你的负债。"}},
                {id:"intro-5",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Equity</span><span class=\"hint-text\">（权益）</span>是资产减去负债后的剩余权益，也称为<span class=\"blank\" onclick=\"revealBlank(this)\">net assets</span><span class=\"hint-text\">（净资产）</span>。",explanation:{title:"权益定义",content:"权益代表所有者在企业中的利益。",analogy:"就像你买房子花了100万，贷款60万，你的权益就是40万。"}},
                {id:"intro-6",category:"会计等式",question:"基本会计等式：<span class=\"blank\" onclick=\"revealBlank(this)\">Assets = Liabilities + Equity</span><span class=\"hint-text\">（资产 = 负债 + 权益）</span>。",explanation:{title:"会计恒等式",content:"这个等式是会计学的基础，始终保持平衡。",analogy:"就像一个天平，左边是你拥有的，右边是这些东西的来源。"}},
                {id:"intro-7",category:"会计等式",question:"扩展会计等式：<span class=\"blank\" onclick=\"revealBlank(this)\">Assets = Liabilities + Capital + (Revenue - Expenses)</span><span class=\"hint-text\">（资产 = 负债 + 资本 + (收入 - 费用)）</span>。",explanation:{title:"扩展会计等式",content:"考虑了收入和费用对权益的影响。",analogy:"就像你的总资产 = 欠的钱 + 自己的钱 + (赚的钱 - 花的钱)。"}},
                {id:"intro-8",category:"会计等式",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Dual aspect concept</span><span class=\"hint-text\">（双重性概念）</span>指每笔交易都有两个方面：借方和贷方。",explanation:{title:"双重性概念",content:"这是复式记账法的理论基础。",analogy:"就像你花钱买东西，钱少了（贷方），东西多了（借方）。"}},
                {id:"intro-9",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Statement of Financial Position</span><span class=\"hint-text\">（财务状况表）</span>也称为<span class=\"blank\" onclick=\"revealBlank(this)\">Balance Sheet</span><span class=\"hint-text\">（资产负债表）</span>。",explanation:{title:"财务状况表",content:"反映企业在特定日期的资产、负债和权益状况。",analogy:"就像给企业拍一张财务快照。"}},
                {id:"intro-10",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Statement of Profit or Loss</span><span class=\"hint-text\">（损益表）</span>也称为<span class=\"blank\" onclick=\"revealBlank(this)\">Income Statement</span><span class=\"hint-text\">（利润表）</span>。",explanation:{title:"损益表",content:"反映企业在一定期间内的收入、费用和利润。",analogy:"就像企业一段时间的收支流水账。"}},
                {id:"intro-11",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Statement of Cash Flows</span><span class=\"hint-text\">（现金流量表）</span>反映企业在一定期间内的<span class=\"blank\" onclick=\"revealBlank(this)\">cash inflows and outflows</span><span class=\"hint-text\">（现金流入和流出）</span>。",explanation:{title:"现金流量表",content:"显示现金从哪里来，到哪里去。",analogy:"就像你的银行流水，记录每一笔钱的进出。"}},
                {id:"intro-12",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Statement of Changes in Equity</span><span class=\"hint-text\">（权益变动表）</span>反映权益在期间内的<span class=\"blank\" onclick=\"revealBlank(this)\">changes</span><span class=\"hint-text\">（变动）</span>。",explanation:{title:"权益变动表",content:"显示股本、留存收益等权益项目的变化。",analogy:"就像你的个人账户余额变化记录。"}},
                {id:"intro-13",category:"复式记账",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Double-entry bookkeeping</span><span class=\"hint-text\">（复式记账）</span>要求每笔交易至少影响<span class=\"blank\" onclick=\"revealBlank(this)\">two accounts</span><span class=\"hint-text\">（两个账户）</span>。",explanation:{title:"复式记账原理",content:"借方总额必须等于贷方总额。",analogy:"就像用天平称重，两边必须平衡。"}},
                {id:"intro-14",category:"复式记账",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Debit</span><span class=\"hint-text\">（借方）</span>是账户的左侧，<span class=\"blank\" onclick=\"revealBlank(this)\">Credit</span><span class=\"hint-text\">（贷方）</span>是账户的右侧。",explanation:{title:"借贷方向",content:"在T型账户中，借方在左，贷方在右。",analogy:"就像一本打开的书，左边记借方，右边记贷方。"}},
                {id:"intro-15",category:"复式记账",question:"资产增加记<span class=\"blank\" onclick=\"revealBlank(this)\">Debit</span><span class=\"hint-text\">（借方）</span>，减少记<span class=\"blank\" onclick=\"revealBlank(this)\">Credit</span><span class=\"hint-text\">（贷方）</span>。",explanation:{title:"资产记账规则",content:"这是会计记账的基本规则之一。",analogy:"收到现金，现金账户记借方。"}},
                {id:"intro-16",category:"复式记账",question:"负债增加记<span class=\"blank\" onclick=\"revealBlank(this)\">Credit</span><span class=\"hint-text\">（贷方）</span>，减少记<span class=\"blank\" onclick=\"revealBlank(this)\">Debit</span><span class=\"hint-text\">（借方）</span>。",explanation:{title:"负债记账规则",content:"负债与资产的记账方向相反。",analogy:"借钱时，贷款账户记贷方。"}},
                {id:"intro-17",category:"复式记账",question:"收入增加记<span class=\"blank\" onclick=\"revealBlank(this)\">Credit</span><span class=\"hint-text\">（贷方）</span>，费用增加记<span class=\"blank\" onclick=\"revealBlank(this)\">Debit</span><span class=\"hint-text\">（借方）</span>。",explanation:{title:"收入费用记账规则",content:"收入增加权益，费用减少权益。",analogy:"卖东西赚了钱，收入记贷方。"}},
                {id:"intro-18",category:"会计假设",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Going concern assumption</span><span class=\"hint-text\">（持续经营假设）</span>假设企业将<span class=\"blank\" onclick=\"revealBlank(this)\">continue to operate</span><span class=\"hint-text\">（持续经营）</span>。",explanation:{title:"持续经营假设",content:"企业不会在可预见的未来破产清算。",analogy:"就像你计划长期经营你的生意，不是短期投机。"}},
                {id:"intro-19",category:"会计假设",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Accruals basis</span><span class=\"hint-text\">（权责发生制）</span>要求收入和费用在<span class=\"blank\" onclick=\"revealBlank(this)\">earned or incurred</span><span class=\"hint-text\">（赚取或发生）</span>时确认。",explanation:{title:"权责发生制",content:"不以现金收付时间为准，而以权利义务发生为准。",analogy:"你这个月完成的工作，即使下个月才拿到钱，也算这个月的收入。"}},
                {id:"intro-20",category:"会计假设",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Accounting entity concept</span><span class=\"hint-text\">（会计主体概念）</span>要求企业与所有者的财务分开记录。",explanation:{title:"会计主体概念",content:"企业是独立的会计实体，与所有者个人财务分开。",analogy:"公司的钱和老板个人的钱要分开算。"}},
                {id:"intro-21",category:"会计假设",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Monetary measurement</span><span class=\"hint-text\">（货币计量假设）</span>要求会计信息以<span class=\"blank\" onclick=\"revealBlank(this)\">monetary unit</span><span class=\"hint-text\">（货币单位）</span>表示。",explanation:{title:"货币计量假设",content:"所有交易都用货币来计量。",analogy:"不管是房子还是车子，都用钱来表示价值。"}},
                {id:"intro-22",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Revenue</span><span class=\"hint-text\">（收入）</span>是企业日常经营活动产生的<span class=\"blank\" onclick=\"revealBlank(this)\">inflow of economic benefits</span><span class=\"hint-text\">（经济利益流入）</span>。",explanation:{title:"收入定义",content:"收入会导致权益增加，但不包括股东投资。",analogy:"你上班赚的工资就是收入。"}},
                {id:"intro-23",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Expense</span><span class=\"hint-text\">（费用）</span>是企业日常经营活动产生的<span class=\"blank\" onclick=\"revealBlank(this)\">outflow of economic benefits</span><span class=\"hint-text\">（经济利益流出）</span>。",explanation:{title:"费用定义",content:"费用会导致权益减少，但不包括向股东分配。",analogy:"你每个月的房租、水电就是费用。"}},
                {id:"intro-24",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Profit</span><span class=\"hint-text\">（利润）</span>是收入减去费用后的余额，也称为<span class=\"blank\" onclick=\"revealBlank(this)\">net income</span><span class=\"hint-text\">（净收益）</span>。",explanation:{title:"利润定义",content:"利润是企业经营的最终成果。",analogy:"你一个月赚10000，花8000，利润就是2000。"}},
                {id:"intro-25",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Drawings</span><span class=\"hint-text\">（提款）</span>是所有者从企业<span class=\"blank\" onclick=\"revealBlank(this)\">withdraw</span><span class=\"hint-text\">（提取）</span>的资产。",explanation:{title:"提款定义",content:"所有者从公司拿走的钱或资产。",analogy:"老板从公司账户取走自己用的钱。"}},
                {id:"intro-26",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Capital</span><span class=\"hint-text\">（资本）</span>是所有者投入企业的<span class=\"blank\" onclick=\"revealBlank(this)\">initial investment</span><span class=\"blank\" onclick=\"revealBlank(this)\">（初始投资）</span>。",explanation:{title:"资本定义",content:"所有者对企业的初始投入。",analogy:"你开公司时投入的启动资金。"}},
                {id:"intro-27",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-current assets</span><span class=\"hint-text\">（非流动资产）</span>是持有超过一年的资产，如<span class=\"blank\" onclick=\"revealBlank(this)\">property, plant and equipment</span><span class=\"hint-text\">（不动产、厂房和设备）</span>。",explanation:{title:"非流动资产",content:"长期持有使用的资产。",analogy:"公司的办公楼、机器设备。"}},
                {id:"intro-28",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Current assets</span><span class=\"hint-text\">（流动资产）</span>是一年内或一个经营周期内变现的资产，如<span class=\"blank\" onclick=\"revealBlank(this)\">inventory</span><span class=\"hint-text\">（存货）</span>。",explanation:{title:"流动资产",content:"短期可转化为现金的资产。",analogy:"公司的现金、存货、应收账款。"}},
                {id:"intro-29",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Current liabilities</span><span class=\"hint-text\">（流动负债）</span>是一年内或一个经营周期内需要偿还的债务，如<span class=\"blank\" onclick=\"revealBlank(this)\">trade payables</span><span class=\"hint-text\">（应付账款）</span>。",explanation:{title:"流动负债",content:"短期需要偿还的债务。",analogy:"公司欠供应商的货款。"}},
                {id:"intro-30",category:"财务报表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-current liabilities</span><span class=\"hint-text\">（非流动负债）</span>是一年以上需要偿还的债务，如<span class=\"blank\" onclick=\"revealBlank(this)\">long-term loans</span><span class=\"hint-text\">（长期贷款）</span>。",explanation:{title:"非流动负债",content:"长期债务。",analogy:"公司的长期银行贷款。"}}
            ]},
            {chapter:"1",name:"Chapter 1 管理信息本质",categories:["基本概念","信息类型","数据分类","信息质量","管理报告"],cards:[
                {id:"1-1",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Management information</span><span class=\"hint-text\">（管理信息）</span>是用于支持<span class=\"blank\" onclick=\"revealBlank(this)\">managerial decision-making</span><span class=\"hint-text\">（管理决策）</span>的信息。",explanation:{title:"管理信息定义",content:"帮助管理者做出更好的商业决策。",analogy:"就像开车时的导航系统，帮你选择路线。"}},
                {id:"1-2",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Data</span><span class=\"hint-text\">（数据）</span>是未经处理的<span class=\"blank\" onclick=\"revealBlank(this)\">raw facts</span><span class=\"hint-text\">（原始事实）</span>和数字。",explanation:{title:"数据定义",content:"数据本身没有意义，需要处理才能变成信息。",analogy:"就像一堆散落的积木。"}},
                {id:"1-3",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Information</span><span class=\"hint-text\">（信息）</span>是经过<span class=\"blank\" onclick=\"revealBlank(this)\">processed and organized</span><span class=\"hint-text\">（处理和组织）</span>的数据。",explanation:{title:"信息定义",content:"信息是有意义的数据。",analogy:"就像用积木搭成的房子。"}},
                {id:"1-4",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Knowledge</span><span class=\"hint-text\">（知识）</span>是将信息应用于<span class=\"blank\" onclick=\"revealBlank(this)\">practical situations</span><span class=\"hint-text\">（实际情况）</span>的能力。",explanation:{title:"知识定义",content:"知识是信息的应用和理解。",analogy:"不仅知道规则，还知道如何运用。"}},
                {id:"1-5",category:"信息类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Historical information</span><span class=\"hint-text\">（历史信息）</span>是关于<span class=\"blank\" onclick=\"revealBlank(this)\">past events</span><span class=\"hint-text\">（过去事件）</span>的记录。",explanation:{title:"历史信息",content:"用于分析过去的表现。",analogy:"就像你的考试成绩单。"}},
                {id:"1-6",category:"信息类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Forward-looking information</span><span class=\"hint-text\">（前瞻性信息）</span>是关于<span class=\"blank\" onclick=\"revealBlank(this)\">future events</span><span class=\"hint-text\">（未来事件）</span>的预测。",explanation:{title:"前瞻性信息",content:"用于规划和预测。",analogy:"就像天气预报。"}},
                {id:"1-7",category:"信息类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Internal information</span><span class=\"hint-text\">（内部信息）</span>来自企业<span class=\"blank\" onclick=\"revealBlank(this)\">inside operations</span><span class=\"hint-text\">（内部运营）</span>。",explanation:{title:"内部信息",content:"企业内部产生的信息。",analogy:"公司内部的销售数据。"}},
                {id:"1-8",category:"信息类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">External information</span><span class=\"hint-text\">（外部信息）</span>来自企业<span class=\"blank\" onclick=\"revealBlank(this)\">outside environment</span><span class=\"hint-text\">（外部环境）</span>。",explanation:{title:"外部信息",content:"来自竞争对手、市场、政府等的信息。",analogy:"竞争对手的价格、市场需求数据。"}},
                {id:"1-9",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Primary data</span><span class=\"hint-text\">（原始数据）</span>是为<span class=\"blank\" onclick=\"revealBlank(this)\">specific purpose</span><span class=\"hint-text\">（特定目的）</span>直接收集的数据。",explanation:{title:"原始数据",content:"第一手数据。",analogy:"你亲自做的问卷调查。"}},
                {id:"1-10",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Secondary data</span><span class=\"hint-text\">（二手数据）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">already collected</span><span class=\"hint-text\">（已收集）</span>但可用于其他目的的数据。",explanation:{title:"二手数据",content:"别人收集的数据。",analogy:"引用政府发布的统计数据。"}},
                {id:"1-11",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Quantitative data</span><span class=\"hint-text\">（定量数据）</span>用<span class=\"blank\" onclick=\"revealBlank(this)\">numbers</span><span class=\"hint-text\">（数字）</span>表示。",explanation:{title:"定量数据",content:"可以量化的数据。",analogy:"身高175cm，体重70kg。"}},
                {id:"1-12",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Qualitative data</span><span class=\"hint-text\">（定性数据）</span>用<span class=\"blank\" onclick=\"revealBlank(this)\">words or descriptions</span><span class=\"hint-text\">（文字或描述）</span>表示。",explanation:{title:"定性数据",content:"描述性质和特征的数据。",analogy:"颜色、态度、满意度。"}},
                {id:"1-13",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Discrete data</span><span class=\"hint-text\">（离散数据）</span>只能取<span class=\"blank\" onclick=\"revealBlank(this)\">specific values</span><span class=\"hint-text\">（特定值）</span>。",explanation:{title:"离散数据",content:"可以计数的数据。",analogy:"人数、产品数量。"}},
                {id:"1-14",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Continuous data</span><span class=\"hint-text\">（连续数据）</span>可以取<span class=\"blank\" onclick=\"revealBlank(this)\">any value</span><span class=\"hint-text\">（任意值）</span>。",explanation:{title:"连续数据",content:"可以无限细分的数据。",analogy:"时间、距离、重量。"}},
                {id:"1-15",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Nominal data</span><span class=\"hint-text\">（名义数据）</span>是没有顺序的<span class=\"blank\" onclick=\"revealBlank(this)\">categories</span><span class=\"hint-text\">（类别）</span>。",explanation:{title:"名义数据",content:"分类数据，无顺序。",analogy:"性别、职业、颜色。"}},
                {id:"1-16",category:"数据分类",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Ordinal data</span><span class=\"hint-text\">（有序数据）</span>是有顺序的<span class=\"blank\" onclick=\"revealBlank(this)\">categories</span><span class=\"hint-text\">（类别）</span>。",explanation:{title:"有序数据",content:"分类数据，有顺序。",analogy:"满意度等级：差、一般、好、很好。"}},
                {id:"1-17",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Relevance</span><span class=\"hint-text\">（相关性）</span>指信息与<span class=\"blank\" onclick=\"revealBlank(this)\">decision-making</span><span class=\"hint-text\">（决策）</span>相关。",explanation:{title:"相关性",content:"信息必须对决策有帮助。",analogy:"看天气预报决定是否带伞。"}},
                {id:"1-18",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Reliability</span><span class=\"hint-text\">（可靠性）</span>指信息<span class=\"blank\" onclick=\"revealBlank(this)\">free from error</span><span class=\"hint-text\">（没有错误）</span>且可验证。",explanation:{title:"可靠性",content:"信息必须准确可信。",analogy:"参考权威来源的信息。"}},
                {id:"1-19",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Timeliness</span><span class=\"hint-text\">（及时性）</span>指信息在<span class=\"blank\" onclick=\"revealBlank(this)\">decision needed</span><span class=\"hint-text\">（需要决策）</span>之前提供。",explanation:{title:"及时性",content:"过时的信息没有价值。",analogy:"过时的天气预报没用。"}},
                {id:"1-20",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Completeness</span><span class=\"hint-text\">（完整性）</span>指信息包含<span class=\"blank\" onclick=\"revealBlank(this)\">all necessary details</span><span class=\"hint-text\">（所有必要细节）</span>。",explanation:{title:"完整性",content:"信息不能有重要遗漏。",analogy:"做决策需要完整的信息。"}},
                {id:"1-21",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Accuracy</span><span class=\"hint-text\">（准确性）</span>指信息<span class=\"blank\" onclick=\"revealBlank(this)\">correct and precise</span><span class=\"hint-text\">（正确精确）</span>。",explanation:{title:"准确性",content:"信息必须正确无误。",analogy:"计算结果不能出错。"}},
                {id:"1-22",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Understandability</span><span class=\"hint-text\">（可理解性）</span>指信息易于<span class=\"blank\" onclick=\"revealBlank(this)\">comprehend</span><span class=\"hint-text\">（理解）</span>。",explanation:{title:"可理解性",content:"信息要清晰易懂。",analogy:"用简单的语言解释复杂的概念。"}},
                {id:"1-23",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Comparability</span><span class=\"hint-text\">（可比性）</span>指信息可以与<span class=\"blank\" onclick=\"revealBlank(this)\">previous periods</span><span class=\"hint-text\">（前期）</span>或其他企业比较。",explanation:{title:"可比性",content:"信息要有一致性，便于比较。",analogy:"今年的销售额和去年的销售额比较。"}},
                {id:"1-24",category:"信息质量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Consistency</span><span class=\"hint-text\">（一致性）</span>指信息的<span class=\"blank\" onclick=\"revealBlank(this)\">presentation</span><span class=\"hint-text\">（呈现方式）</span>保持一致。",explanation:{title:"一致性",content:"会计方法和报表格式要保持一致。",analogy:"每年用同样的方法计算利润。"}},
                {id:"1-25",category:"管理报告",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Management reports</span><span class=\"hint-text\">（管理报告）</span>是为<span class=\"blank\" onclick=\"revealBlank(this)\">internal managers</span><span class=\"hint-text\">（内部管理者）</span>准备的报告。",explanation:{title:"管理报告",content:"用于内部决策的报告。",analogy:"公司内部的销售分析报告。"}},
                {id:"1-26",category:"管理报告",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Performance reports</span><span class=\"hint-text\">（绩效报告）</span>比较<span class=\"blank\" onclick=\"revealBlank(this)\">actual vs budgeted results</span><span class=\"hint-text\">（实际与预算结果）</span>。",explanation:{title:"绩效报告",content:"评估实际绩效与预算的差异。",analogy:"考试成绩与目标分数对比。"}},
                {id:"1-27",category:"管理报告",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variance analysis</span><span class=\"hint-text\">（差异分析）</span>分析实际与预算之间的<span class=\"blank\" onclick=\"revealBlank(this)\">differences</span><span class=\"hint-text\">（差异）</span>。",explanation:{title:"差异分析",content:"找出差异原因，帮助改进。",analogy:"分析为什么实际花费超过预算。"}},
                {id:"1-28",category:"管理报告",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Budget reports</span><span class=\"hint-text\">（预算报告）</span>规划未来的<span class=\"blank\" onclick=\"revealBlank(this)\">financial activities</span><span class=\"hint-text\">（财务活动）</span>。",explanation:{title:"预算报告",content:"未来的财务计划。",analogy:"你下个月的支出预算。"}},
                {id:"1-29",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Information overload</span><span class=\"hint-text\">（信息过载）</span>指信息太多导致<span class=\"blank\" onclick=\"revealBlank(this)\">difficult to process</span><span class=\"hint-text\">（难以处理）</span>。",explanation:{title:"信息过载",content:"过多的信息反而影响决策。",analogy:"收到太多邮件反而不知道该看哪封。"}},
                {id:"1-30",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Information system</span><span class=\"hint-text\">（信息系统）</span>是收集、处理和报告信息的<span class=\"blank\" onclick=\"revealBlank(this)\">system</span><span class=\"hint-text\">（系统）</span>。",explanation:{title:"信息系统",content:"用于管理信息的软件和流程。",analogy:"公司的ERP系统。"}}
            ]},
            {chapter:"2",name:"Chapter 2 抽样方法",categories:["基本概念","抽样方法","抽样误差","抽样分布","样本量"],cards:[
                {id:"2-1",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sampling</span><span class=\"hint-text\">（抽样）</span>是从<span class=\"blank\" onclick=\"revealBlank(this)\">population</span><span class=\"hint-text\">（总体）</span>中选择部分项目进行调查的方法。",explanation:{title:"抽样定义",content:"当总体太大时，抽样是高效的数据收集方法。",analogy:"从一桶水中舀一勺来检验水质。"}},
                {id:"2-2",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Population</span><span class=\"hint-text\">（总体）</span>是研究对象的<span class=\"blank\" onclick=\"revealBlank(this)\">entire set</span><span class=\"hint-text\">（全部集合）</span>。",explanation:{title:"总体定义",content:"我们想要了解的所有对象。",analogy:"全校所有学生。"}},
                {id:"2-3",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sample</span><span class=\"hint-text\">（样本）</span>是从总体中选取的<span class=\"blank\" onclick=\"revealBlank(this)\">subset</span><span class=\"hint-text\">（子集）</span>。",explanation:{title:"样本定义",content:"用来代表总体的一部分。",analogy:"从全校学生中选100人调查。"}},
                {id:"2-4",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sample size</span><span class=\"hint-text\">（样本量）</span>是样本中包含的<span class=\"blank\" onclick=\"revealBlank(this)\">number of items</span><span class=\"hint-text\">（项目数量）</span>。",explanation:{title:"样本量",content:"样本的大小。",analogy:"调查100人还是200人。"}},
                {id:"2-5",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Random sampling</span><span class=\"hint-text\">（随机抽样）</span>中每个成员被选中的<span class=\"blank\" onclick=\"revealBlank(this)\">probability</span><span class=\"hint-text\">（概率）</span>相等。",explanation:{title:"随机抽样",content:"最基本的概率抽样方法。",analogy:"抽奖，每个人机会均等。"}},
                {id:"2-6",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Simple random sampling</span><span class=\"blank\" onclick=\"revealBlank(this)\">（简单随机抽样）</span>是最基本的随机抽样，每个样本被选中的机会<span class=\"blank\" onclick=\"revealBlank(this)\">equal</span><span class=\"hint-text\">（相等）</span>。",explanation:{title:"简单随机抽样",content:"用随机数表或计算机随机选择。",analogy:"从帽子里抽名字。"}},
                {id:"2-7",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Systematic sampling</span><span class=\"hint-text\">（系统抽样）</span>按固定<span class=\"blank\" onclick=\"revealBlank(this)\">interval</span><span class=\"hint-text\">（间隔）</span>选择样本。",explanation:{title:"系统抽样",content:"先选起点，然后按固定间隔选取。",analogy:"从队列中每5个人选1个。"}},
                {id:"2-8",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Stratified sampling</span><span class=\"hint-text\">（分层抽样）</span>将总体分成<span class=\"blank\" onclick=\"revealBlank(this)\">strata</span><span class=\"hint-text\">（层）</span>，然后在每层中抽样。",explanation:{title:"分层抽样",content:"确保各层都有代表。",analogy:"按年级分层调查学生。"}},
                {id:"2-9",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cluster sampling</span><span class=\"hint-text\">（整群抽样）</span>将总体分成<span class=\"blank\" onclick=\"revealBlank(this)\">clusters</span><span class=\"hint-text\">（群）</span>，随机选择群并调查群内所有成员。",explanation:{title:"整群抽样",content:"以群为单位选取。",analogy:"随机选几个班级，调查所有学生。"}},
                {id:"2-10",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Quota sampling</span><span class=\"hint-text\">（配额抽样）</span>按预定<span class=\"blank\" onclick=\"revealBlank(this)\">quotas</span><span class=\"hint-text\">（配额）</span>选择样本，是非概率抽样。",explanation:{title:"配额抽样",content:"按特征分配名额。",analogy:"确保男女各占一半。"}},
                {id:"2-11",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Convenience sampling</span><span class=\"hint-text\">（便利抽样）</span>选择最容易接触到的<span class=\"blank\" onclick=\"revealBlank(this)\">items</span><span class=\"hint-text\">（项目）</span>。",explanation:{title:"便利抽样",content:"简单但可能有偏差。",analogy:"在地铁站调查路人。"}},
                {id:"2-12",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Judgemental sampling</span><span class=\"hint-text\">（判断抽样）</span>根据<span class=\"blank\" onclick=\"revealBlank(this)\">expert judgment</span><span class=\"hint-text\">（专家判断）</span>选择样本。",explanation:{title:"判断抽样",content:"基于主观判断选择。",analogy:"专家挑选典型案例。"}},
                {id:"2-13",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Probability sampling</span><span class=\"hint-text\">（概率抽样）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">random selection</span><span class=\"hint-text\">（随机选择）</span>，可以计算抽样误差。",explanation:{title:"概率抽样",content:"科学的抽样方法。",analogy:"用科学方法选择样本。"}},
                {id:"2-14",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-probability sampling</span><span class=\"blank\" onclick=\"revealBlank(this)\">（非概率抽样）</span>不使用随机选择，无法计算<span class=\"blank\" onclick=\"revealBlank(this)\">sampling error</span><span class=\"hint-text\">（抽样误差）</span>。",explanation:{title:"非概率抽样",content:"方便但不够科学。",analogy:"随意选择样本。"}},
                {id:"2-15",category:"抽样误差",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sampling error</span><span class=\"hint-text\">（抽样误差）</span>是样本统计量与总体参数之间的<span class=\"blank\" onclick=\"revealBlank(this)\">difference</span><span class=\"hint-text\">（差异）</span>。",explanation:{title:"抽样误差",content:"样本不能完全代表总体导致的误差。",analogy:"抽查的水果可能比整箱的甜。"}},
                {id:"2-16",category:"抽样误差",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sampling bias</span><span class=\"hint-text\">（抽样偏差）</span>是样本不能代表总体的<span class=\"blank\" onclick=\"revealBlank(this)\">systematic error</span><span class=\"blank\" onclick=\"revealBlank(this)\">（系统性误差）</span>。",explanation:{title:"抽样偏差",content:"系统性的选择偏差。",analogy:"只调查年轻人，不能代表所有人。"}},
                {id:"2-17",category:"抽样误差",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Non-sampling error</span><span class=\"hint-text\">（非抽样误差）</span>是与抽样过程无关的<span class=\"blank\" onclick=\"revealBlank(this)\">errors</span><span class=\"hint-text\">（误差）</span>。",explanation:{title:"非抽样误差",content:"数据收集或处理中的错误。",analogy:"调查员记录错误。"}},
                {id:"2-18",category:"抽样分布",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sampling distribution</span><span class=\"hint-text\">（抽样分布）</span>是样本统计量的<span class=\"blank\" onclick=\"revealBlank(this)\">probability distribution</span><span class=\"hint-text\">（概率分布）</span>。",explanation:{title:"抽样分布",content:"所有可能样本统计量的分布。",analogy:"多次抽样得到的统计量分布。"}},
                {id:"2-19",category:"抽样分布",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Central Limit Theorem</span><span class=\"hint-text\">（中心极限定理）</span>指出样本均值的分布接近<span class=\"blank\" onclick=\"revealBlank(this)\">normal distribution</span><span class=\"hint-text\">（正态分布）</span>。",explanation:{title:"中心极限定理",content:"大样本时，样本均值近似正态分布。",analogy:"大量样本的平均值呈钟形分布。"}},
                {id:"2-20",category:"抽样分布",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard error</span><span class=\"hint-text\">（标准误）</span>是样本统计量的<span class=\"blank\" onclick=\"revealBlank(this)\">standard deviation</span><span class=\"hint-text\">（标准差）</span>。",explanation:{title:"标准误",content:"衡量样本统计量的可靠性。",analogy:"样本均值的波动程度。"}},
                {id:"2-21",category:"样本量",question:"样本量取决于<span class=\"blank\" onclick=\"revealBlank(this)\">confidence level</span><span class=\"hint-text\">（置信水平）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">margin of error</span><span class=\"hint-text\">（误差边际）</span>和总体方差。",explanation:{title:"样本量决定因素",content:"需要的置信度越高，样本量越大。",analogy:"要求越精确，需要的样本越多。"}},
                {id:"2-22",category:"样本量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Confidence interval</span><span class=\"hint-text\">（置信区间）</span>是总体参数可能所在的<span class=\"blank\" onclick=\"revealBlank(this)\">range</span><span class=\"hint-text\">（范围）</span>。",explanation:{title:"置信区间",content:"以一定概率包含总体参数的区间。",analogy:"有95%的把握说总体均值在某个范围内。"}},
                {id:"2-23",category:"样本量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Confidence level</span><span class=\"hint-text\">（置信水平）</span>是置信区间包含总体参数的<span class=\"blank\" onclick=\"revealBlank(this)\">probability</span><span class=\"hint-text\">（概率）</span>。",explanation:{title:"置信水平",content:"常用95%或99%。",analogy:"有多大把握说区间包含真实值。"}},
                {id:"2-24",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Census</span><span class=\"hint-text\">（全面调查）</span>是调查<span class=\"blank\" onclick=\"revealBlank(this)\">entire population</span><span class=\"hint-text\">（整个总体）</span>。",explanation:{title:"全面调查",content:"调查所有对象。",analogy:"人口普查。"}},
                {id:"2-25",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Statistic</span><span class=\"hint-text\">（统计量）</span>是从样本计算的<span class=\"blank\" onclick=\"revealBlank(this)\">measure</span><span class=\"hint-text\">（指标）</span>。",explanation:{title:"统计量",content:"如样本均值、样本比例。",analogy:"样本的平均身高。"}},
                {id:"2-26",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Parameter</span><span class=\"hint-text\">（参数）</span>是总体的<span class=\"blank\" onclick=\"revealBlank(this)\">true value</span><span class=\"hint-text\">（真实值）</span>。",explanation:{title:"参数",content:"如总体均值、总体比例。",analogy:"全校学生的真实平均身高。"}},
                {id:"2-27",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Multistage sampling</span><span class=\"blank\" onclick=\"revealBlank(this)\">（多阶段抽样）</span>分多个阶段进行<span class=\"blank\" onclick=\"revealBlank(this)\">sampling</span><span class=\"hint-text\">（抽样）</span>。",explanation:{title:"多阶段抽样",content:"先抽群，再从群中抽个体。",analogy:"先选城市，再选学校，再选学生。"}},
                {id:"2-28",category:"抽样方法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Snowball sampling</span><span class=\"blank\" onclick=\"revealBlank(this)\">（滚雪球抽样）</span>通过已调查者介绍<span class=\"blank\" onclick=\"revealBlank(this)\">new respondents</span><span class=\"hint-text\">（新受访者）</span>。",explanation:{title:"滚雪球抽样",content:"适合难以接触的人群。",analogy:"通过朋友介绍找到受访者。"}},
                {id:"2-29",category:"抽样误差",question:"抽样误差随样本量增加而<span class=\"blank\" onclick=\"revealBlank(this)\">decrease</span><span class=\"hint-text\">（减少）</span>。",explanation:{title:"样本量与误差",content:"样本越大，误差越小。",analogy:"调查的人越多，结果越准确。"}},
                {id:"2-30",category:"抽样误差",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sampling frame</span><span class=\"hint-text\">（抽样框）</span>是总体中所有项目的<span class=\"blank\" onclick=\"revealBlank(this)\">list</span><span class=\"hint-text\">（列表）</span>。",explanation:{title:"抽样框",content:"从中抽取样本的名单。",analogy:"学生名单、电话号码簿。"}}
            ]},
            {chapter:"3",name:"Chapter 3 分析技术",categories:["线性函数","高低点法","线性回归","时间序列","指数","成本行为"],cards:[
                {id:"3-1",category:"线性函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Linear function</span><span class=\"hint-text\">（线性函数）</span>的形式是<span class=\"blank\" onclick=\"revealBlank(this)\">y = a + bx</span><span class=\"hint-text\">（y = a + bx）</span>。",explanation:{title:"线性函数公式",content:"用于描述成本与活动水平的关系。",analogy:"话费=月租+每分钟费用×通话时长。"}},
                {id:"3-2",category:"线性函数",question:"在成本函数中，<span class=\"blank\" onclick=\"revealBlank(this)\">a</span><span class=\"hint-text\">（a）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">fixed cost</span><span class=\"hint-text\">（固定成本）</span>。",explanation:{title:"固定成本",content:"不随活动水平变化的成本。",analogy:"房租，不管生产多少都要付。"}},
                {id:"3-3",category:"线性函数",question:"在成本函数中，<span class=\"blank\" onclick=\"revealBlank(this)\">b</span><span class=\"hint-text\">（b）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">variable cost per unit</span><span class=\"hint-text\">（单位可变成本）</span>。",explanation:{title:"单位可变成本",content:"每单位活动的可变成本。",analogy:"每杯奶茶的原料成本。"}},
                {id:"3-4",category:"线性函数",question:"在成本函数中，<span class=\"blank\" onclick=\"revealBlank(this)\">x</span><span class=\"hint-text\">（x）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">activity level</span><span class=\"hint-text\">（活动水平）</span>。",explanation:{title:"活动水平",content:"生产数量、工时等。",analogy:"生产的产品数量。"}},
                {id:"3-5",category:"线性函数",question:"在成本函数中，<span class=\"blank\" onclick=\"revealBlank(this)\">y</span><span class=\"hint-text\">（y）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">total cost</span><span class=\"hint-text\">（总成本）</span>。",explanation:{title:"总成本",content:"固定成本加可变成本。",analogy:"总成本=固定成本+可变成本。"}},
                {id:"3-6",category:"成本行为",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Fixed costs</span><span class=\"hint-text\">（固定成本）</span>在相关范围内不随<span class=\"blank\" onclick=\"revealBlank(this)\">activity level</span><span class=\"hint-text\">（活动水平）</span>变化。",explanation:{title:"固定成本定义",content:"短期内固定不变的成本。",analogy:"公司的租金。"}},
                {id:"3-7",category:"成本行为",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variable costs</span><span class=\"hint-text\">（可变成本）</span>随<span class=\"blank\" onclick=\"revealBlank(this)\">activity level</span><span class=\"hint-text\">（活动水平）</span>成正比变化。",explanation:{title:"可变成本定义",content:"与产量成正比的成本。",analogy:"原材料成本。"}},
                {id:"3-8",category:"成本行为",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Semi-variable costs</span><span class=\"hint-text\">（半可变成本）</span>同时包含<span class=\"blank\" onclick=\"revealBlank(this)\">fixed</span><span class=\"hint-text\">（固定）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">variable</span><span class=\"hint-text\">（可变）</span>部分。",explanation:{title:"半可变成本",content:"既有固定部分也有可变部分。",analogy:"手机话费=月租+通话费。"}},
                {id:"3-9",category:"成本行为",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Step costs</span><span class=\"hint-text\">（阶梯成本）</span>在特定活动水平上<span class=\"blank\" onclick=\"revealBlank(this)\">increase in steps</span><span class=\"hint-text\">（阶梯式增加）</span>。",explanation:{title:"阶梯成本",content:"在一定范围内固定，超过后跳跃增加。",analogy:"生产到一定规模需要增加设备。"}},
                {id:"3-10",category:"成本行为",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Relevant range</span><span class=\"hint-text\">（相关范围）</span>是成本行为保持不变的<span class=\"blank\" onclick=\"revealBlank(this)\">activity range</span><span class=\"hint-text\">（活动范围）</span>。",explanation:{title:"相关范围",content:"在此范围内成本函数有效。",analogy:"公司的正常生产范围。"}},
                {id:"3-11",category:"高低点法",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">High-low method</span><span class=\"hint-text\">（高低点法）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">highest</span><span class=\"hint-text\">（最高）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">lowest</span><span class=\"hint-text\">（最低）</span>活动水平的数据点。",explanation:{title:"高低点法",content:"简单的成本分解方法。",analogy:"用最高和最低产量的数据来估算成本。"}},
                {id:"3-12",category:"高低点法",question:"高低点法计算单位可变成本：<span class=\"blank\" onclick=\"revealBlank(this)\">b = (y_high - y_low) / (x_high - x_low)</span><span class=\"hint-text\">（b = (高成本-低成本)/(高产量-低产量)）</span>。",explanation:{title:"单位可变成本公式",content:"通过成本差除以产量差计算。",analogy:"成本变化量除以产量变化量。"}},
                {id:"3-13",category:"高低点法",question:"高低点法计算固定成本：<span class=\"blank\" onclick=\"revealBlank(this)\">a = y - bx</span><span class=\"hint-text\">（a = 总成本 - 单位可变成本×产量）</span>。",explanation:{title:"固定成本公式",content:"用总成本减去可变成本得到固定成本。",analogy:"总成本减去可变部分就是固定部分。"}},
                {id:"3-14",category:"高低点法",question:"高低点法的优点是<span class=\"blank\" onclick=\"revealBlank(this)\">simple</span><span class=\"hint-text\">（简单）</span>，缺点是只使用<span class=\"blank\" onclick=\"revealBlank(this)\">two points</span><span class=\"hint-text\">（两个点）</span>。",explanation:{title:"高低点法优缺点",content:"简单但可能不准确。",analogy:"只用两个数据点可能不具代表性。"}},
                {id:"3-15",category:"线性回归",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Linear regression</span><span class=\"hint-text\">（线性回归）</span>使用所有数据点拟合<span class=\"blank\" onclick=\"revealBlank(this)\">line of best fit</span><span class=\"hint-text\">（最佳拟合线）</span>。",explanation:{title:"线性回归",content:"更精确的成本估计方法。",analogy:"找一条最接近所有数据点的线。"}},
                {id:"3-16",category:"线性回归",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Correlation coefficient</span><span class=\"hint-text\">（相关系数）</span>r的范围是<span class=\"blank\" onclick=\"revealBlank(this)\">-1 to +1</span><span class=\"hint-text\">（-1到+1）</span>。",explanation:{title:"相关系数",content:"衡量两个变量之间线性关系的强度。",analogy:"r=1表示完全正相关，r=-1表示完全负相关。"}},
                {id:"3-17",category:"线性回归",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Coefficient of determination</span><span class=\"hint-text\">（决定系数）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">r²</span><span class=\"hint-text\">（r的平方）</span>，表示因变量的变异能被自变量解释的比例。",explanation:{title:"决定系数",content:"r²=0.8表示80%的变异可以解释。",analogy:"考试成绩的80%可以用学习时间来解释。"}},
                {id:"3-18",category:"时间序列",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Time series</span><span class=\"hint-text\">（时间序列）</span>是按<span class=\"blank\" onclick=\"revealBlank(this)\">time order</span><span class=\"hint-text\">（时间顺序）</span>排列的数据。",explanation:{title:"时间序列",content:"随时间变化的数据。",analogy:"每月的销售额数据。"}},
                {id:"3-19",category:"时间序列",question:"时间序列的组成部分：<span class=\"blank\" onclick=\"revealBlank(this)\">trend</span><span class=\"hint-text\">（趋势）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">seasonality</span><span class=\"hint-text\">（季节性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">cyclical</span><span class=\"hint-text\">（周期性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">random</span><span class=\"hint-text\">（随机）</span>。",explanation:{title:"时间序列组成",content:"四个组成部分：趋势、季节、周期、随机。",analogy:"气温变化有趋势（变暖）、季节（夏天热）、随机（某天突然变冷）。"}},
                {id:"3-20",category:"时间序列",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Trend</span><span class=\"hint-text\">（趋势）</span>是数据在长期内的<span class=\"blank\" onclick=\"revealBlank(this)\">general direction</span><span class=\"hint-text\">（总体方向）</span>。",explanation:{title:"趋势",content:"长期上升或下降的趋势。",analogy:"公司销售额逐年增长。"}},
                {id:"3-21",category:"时间序列",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Seasonality</span><span class=\"hint-text\">（季节性）</span>是在固定时间间隔内重复出现的<span class=\"blank\" onclick=\"revealBlank(this)\">pattern</span><span class=\"hint-text\">（模式）</span>。",explanation:{title:"季节性",content:"季节性波动。",analogy:"圣诞节前销售增加。"}},
                {id:"3-22",category:"时间序列",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cyclical variation</span><span class=\"hint-text\">（周期性变动）</span>是超过一年的<span class=\"blank\" onclick=\"revealBlank(this)\">business cycle</span><span class=\"hint-text\">（商业周期）</span>波动。",explanation:{title:"周期性",content:"经济周期的影响。",analogy:"经济繁荣和衰退的循环。"}},
                {id:"3-23",category:"时间序列",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Random variation</span><span class=\"hint-text\">（随机变动）</span>是无法预测的<span class=\"blank\" onclick=\"revealBlank(this)\">irregular fluctuations</span><span class=\"hint-text\">（不规则波动）</span>。",explanation:{title:"随机变动",content:"偶然事件引起的波动。",analogy:"突发新闻导致股价波动。"}},
                {id:"3-24",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Index number</span><span class=\"hint-text\">（指数）</span>是衡量一组变量<span class=\"blank\" onclick=\"revealBlank(this)\">relative change</span><span class=\"hint-text\">（相对变化）</span>的指标。",explanation:{title:"指数",content:"反映价格、数量等的变化。",analogy:"消费者价格指数CPI。"}},
                {id:"3-25",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Price index</span><span class=\"hint-text\">（价格指数）</span>衡量<span class=\"blank\" onclick=\"revealBlank(this)\">price changes</span><span class=\"hint-text\">（价格变化）</span>。",explanation:{title:"价格指数",content:"反映物价水平的变化。",analogy:"CPI指数。"}},
                {id:"3-26",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Quantity index</span><span class=\"hint-text\">（数量指数）</span>衡量<span class=\"blank\" onclick=\"revealBlank(this)\">quantity changes</span><span class=\"hint-text\">（数量变化）</span>。",explanation:{title:"数量指数",content:"反映数量的变化。",analogy:"工业生产指数。"}},
                {id:"3-27",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Laspeyres index</span><span class=\"hint-text\">（拉斯佩尔指数）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">base year quantities</span><span class=\"hint-text\">（基期数量）</span>作为权重。",explanation:{title:"拉斯佩尔指数",content:"固定基期数量计算的价格指数。",analogy:"用去年的购买量计算今年的价格变化。"}},
                {id:"3-28",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Paasche index</span><span class=\"hint-text\">（帕舍指数）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">current year quantities</span><span class=\"hint-text\">（当期数量）</span>作为权重。",explanation:{title:"帕舍指数",content:"用当期数量计算的价格指数。",analogy:"用今年的购买量计算价格变化。"}},
                {id:"3-29",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Chain base index</span><span class=\"hint-text\">（环比指数）</span>将每个时期与<span class=\"blank\" onclick=\"revealBlank(this)\">previous period</span><span class=\"hint-text\">（前一时期）</span>比较。",explanation:{title:"环比指数",content:"相邻时期比较。",analogy:"本月与上月比较。"}},
                {id:"3-30",category:"指数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Base year</span><span class=\"hint-text\">（基期）</span>是作为比较基准的<span class=\"blank\" onclick=\"revealBlank(this)\">reference year</span><span class=\"hint-text\">（参考年份）</span>。",explanation:{title:"基期",content:"指数为100的年份。",analogy:"选2020年作为基准年。"}}
            ]},
            {chapter:"4",name:"Chapter 4 数据汇总与分析",categories:["大数据","数据分析","数据类型","集中趋势","离散程度","期望值","正态分布"],cards:[
                {id:"4-1",category:"大数据",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Big data</span><span class=\"hint-text\">（大数据）</span>指规模非常大、无法用传统方法处理的<span class=\"blank\" onclick=\"revealBlank(this)\">data sets</span><span class=\"hint-text\">（数据集）</span>。",explanation:{title:"大数据",content:"海量数据。",analogy:"一个巨大的图书馆。"}},
                {id:"4-2",category:"大数据",question:"大数据5V特征：<span class=\"blank\" onclick=\"revealBlank(this)\">Volume</span><span class=\"hint-text\">（体量）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Velocity</span><span class=\"hint-text\">（速度）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Variety</span><span class=\"hint-text\">（多样性）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Value</span><span class=\"hint-text\">（价值）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">Veracity</span><span class=\"hint-text\">（真实性）</span>。",explanation:{title:"5V特征",content:"Volume指数据量大，Velocity指处理速度快，Variety指类型多。",analogy:"大河一样的数据。"}},
                {id:"4-3",category:"大数据",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Structured data</span><span class=\"hint-text\">（结构化数据）</span>有固定格式，如<span class=\"blank\" onclick=\"revealBlank(this)\">database tables</span><span class=\"hint-text\">（数据库表）</span>。",explanation:{title:"结构化数据",content:"高度组织化的数据。",analogy:"Excel表格。"}},
                {id:"4-4",category:"大数据",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Unstructured data</span><span class=\"hint-text\">（非结构化数据）</span>没有固定格式，如<span class=\"blank\" onclick=\"revealBlank(this)\">text, images, video</span><span class=\"hint-text\">（文本、图像、视频）</span>。",explanation:{title:"非结构化数据",content:"占数据总量的80%以上。",analogy:"社交媒体帖子、视频文件。"}},
                {id:"4-5",category:"大数据",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Semi-structured data</span><span class=\"hint-text\">（半结构化数据）</span>有部分结构，如<span class=\"blank\" onclick=\"revealBlank(this)\">XML, JSON</span><span class=\"hint-text\">（XML、JSON）</span>。",explanation:{title:"半结构化数据",content:"介于结构化和非结构化之间。",analogy:"带标签的数据。"}},
                {id:"4-6",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Data analytics</span><span class=\"hint-text\">（数据分析）</span>是收集和分析数据以提取<span class=\"blank\" onclick=\"revealBlank(this)\">insights</span><span class=\"hint-text\">（洞察）</span>的过程。",explanation:{title:"数据分析",content:"用统计方法提取有用信息。",analogy:"侦探破案，分析线索。"}},
                {id:"4-7",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Descriptive analytics</span><span class=\"hint-text\">（描述性分析）</span>总结<span class=\"blank\" onclick=\"revealBlank(this)\">what happened</span><span class=\"hint-text\">（发生了什么）</span>。",explanation:{title:"描述性分析",content:"总结历史数据。",analogy:"体检报告。"}},
                {id:"4-8",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Predictive analytics</span><span class=\"hint-text\">（预测性分析）</span>预测<span class=\"blank\" onclick=\"revealBlank(this)\">what will happen</span><span class=\"hint-text\">（将会发生什么）</span>。",explanation:{title:"预测性分析",content:"预测未来趋势。",analogy:"天气预报。"}},
                {id:"4-9",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Prescriptive analytics</span><span class=\"hint-text\">（指导性分析）</span>建议<span class=\"blank\" onclick=\"revealBlank(this)\">what should be done</span><span class=\"hint-text\">（应该做什么）</span>。",explanation:{title:"指导性分析",content:"提供行动建议。",analogy:"医生根据诊断给出治疗方案。"}},
                {id:"4-10",category:"数据类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Primary data</span><span class=\"hint-text\">（原始数据）</span>是为特定目的<span class=\"blank\" onclick=\"revealBlank(this)\">collected first-hand</span><span class=\"hint-text\">（直接收集）</span>的数据。",explanation:{title:"原始数据",content:"第一手数据。",analogy:"亲自做问卷调查。"}},
                {id:"4-11",category:"数据类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Secondary data</span><span class=\"hint-text\">（二手数据）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">already collected</span><span class=\"hint-text\">（已收集）</span>的数据。",explanation:{title:"二手数据",content:"别人收集的数据。",analogy:"引用统计年鉴。"}},
                {id:"4-12",category:"数据类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Qualitative data</span><span class=\"hint-text\">（定性数据）</span>描述<span class=\"blank\" onclick=\"revealBlank(this)\">qualities or characteristics</span><span class=\"hint-text\">（质量或特征）</span>。",explanation:{title:"定性数据",content:"非数值数据。",analogy:"颜色、态度。"}},
                {id:"4-13",category:"数据类型",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Quantitative data</span><span class=\"hint-text\">（定量数据）</span>用<span class=\"blank\" onclick=\"revealBlank(this)\">numbers</span><span class=\"hint-text\">（数字）</span>表示。",explanation:{title:"定量数据",content:"数值数据。",analogy:"身高、体重。"}},
                {id:"4-14",category:"集中趋势",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Mean</span><span class=\"hint-text\">（均值）</span>是所有数据的<span class=\"blank\" onclick=\"revealBlank(this)\">average</span><span class=\"hint-text\">（平均值）</span>。",explanation:{title:"均值",content:"最常用的集中趋势指标。",analogy:"班级平均成绩。"}},
                {id:"4-15",category:"集中趋势",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Median</span><span class=\"hint-text\">（中位数）</span>是排序后位于<span class=\"blank\" onclick=\"revealBlank(this)\">middle</span><span class=\"hint-text\">（中间）</span>位置的值。",explanation:{title:"中位数",content:"不受极端值影响。",analogy:"收入中位数。"}},
                {id:"4-16",category:"集中趋势",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Mode</span><span class=\"hint-text\">（众数）</span>是出现<span class=\"blank\" onclick=\"revealBlank(this)\">most frequently</span><span class=\"hint-text\">（最频繁）</span>的值。",explanation:{title:"众数",content:"最常见的值。",analogy:"最受欢迎的尺码。"}},
                {id:"4-17",category:"离散程度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Range</span><span class=\"hint-text\">（极差）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">maximum - minimum</span><span class=\"hint-text\">（最大值-最小值）</span>。",explanation:{title:"极差",content:"数据的范围。",analogy:"最高温度-最低温度。"}},
                {id:"4-18",category:"离散程度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Variance</span><span class=\"hint-text\">（方差）</span>是数据与均值差的<span class=\"blank\" onclick=\"revealBlank(this)\">average of squared differences</span><span class=\"hint-text\">（平方差的平均值）</span>。",explanation:{title:"方差",content:"衡量数据的离散程度。",analogy:"成绩的波动程度。"}},
                {id:"4-19",category:"离散程度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Standard deviation</span><span class=\"hint-text\">（标准差）</span>是方差的<span class=\"blank\" onclick=\"revealBlank(this)\">square root</span><span class=\"hint-text\">（平方根）</span>。",explanation:{title:"标准差",content:"更易理解的离散程度指标。",analogy:"成绩分布的宽窄。"}},
                {id:"4-20",category:"离散程度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Coefficient of variation</span><span class=\"hint-text\">（变异系数）</span>是标准差除以<span class=\"blank\" onclick=\"revealBlank(this)\">mean</span><span class=\"hint-text\">（均值）</span>。",explanation:{title:"变异系数",content:"相对离散程度。",analogy:"比较不同数据集的波动性。"}},
                {id:"4-21",category:"期望值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Expected value</span><span class=\"hint-text\">（期望值）</span>是每个结果乘以其<span class=\"blank\" onclick=\"revealBlank(this)\">probability</span><span class=\"hint-text\">（概率）</span>的总和。",explanation:{title:"期望值",content:"加权平均值。",analogy:"赌博的预期收益。"}},
                {id:"4-22",category:"期望值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Probability distribution</span><span class=\"hint-text\">（概率分布）</span>描述随机变量取不同值的<span class=\"blank\" onclick=\"revealBlank(this)\">probabilities</span><span class=\"hint-text\">（概率）</span>。",explanation:{title:"概率分布",content:"所有可能结果及其概率。",analogy:"掷骰子的结果分布。"}},
                {id:"4-23",category:"正态分布",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Normal distribution</span><span class=\"hint-text\">（正态分布）</span>是对称的<span class=\"blank\" onclick=\"revealBlank(this)\">bell-shaped</span><span class=\"hint-text\">（钟形）</span>分布。",explanation:{title:"正态分布",content:"自然界中很多现象符合正态分布。",analogy:"身高分布。"}},
                {id:"4-24",category:"正态分布",question:"正态分布由<span class=\"blank\" onclick=\"revealBlank(this)\">mean</span><span class=\"hint-text\">（均值）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">standard deviation</span><span class=\"hint-text\">（标准差）</span>决定。",explanation:{title:"正态分布参数",content:"均值决定中心位置，标准差决定宽度。",analogy:"钟形曲线的中心和宽窄。"}},
                {id:"4-25",category:"正态分布",question:"在正态分布中，约<span class=\"blank\" onclick=\"revealBlank(this)\">68%</span><span class=\"hint-text\">（68%）</span>的数据在均值±1个标准差范围内。",explanation:{title:"68-95-99.7法则",content:"经验法则。",analogy:"大多数数据集中在均值附近。"}},
                {id:"4-26",category:"正态分布",question:"在正态分布中，约<span class=\"blank\" onclick=\"revealBlank(this)\">95%</span><span class=\"hint-text\">（95%）</span>的数据在均值±2个标准差范围内。",explanation:{title:"95%范围",content:"几乎所有数据在此范围内。",analogy:"考试成绩的正常范围。"}},
                {id:"4-27",category:"正态分布",question:"在正态分布中，约<span class=\"blank\" onclick=\"revealBlank(this)\">99.7%</span><span class=\"hint-text\">（99.7%）</span>的数据在均值±3个标准差范围内。",explanation:{title:"99.7%范围",content:"几乎全部数据在此范围内。",analogy:"异常值很少见。"}},
                {id:"4-28",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Data visualization</span><span class=\"hint-text\">（数据可视化）</span>用图表将数据<span class=\"blank\" onclick=\"revealBlank(this)\">visual</span><span class=\"hint-text\">（可视化）</span>。",explanation:{title:"数据可视化",content:"使数据更易理解。",analogy:"用图表展示数据。"}},
                {id:"4-29",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Dashboard</span><span class=\"hint-text\">（仪表盘）</span>是实时显示关键指标的<span class=\"blank\" onclick=\"revealBlank(this)\">visual tool</span><span class=\"hint-text\">（可视化工具）</span>。",explanation:{title:"仪表盘",content:"一目了然的关键指标。",analogy:"汽车仪表盘显示速度、油量等。"}},
                {id:"4-30",category:"数据分析",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Data mining</span><span class=\"hint-text\">（数据挖掘）</span>从大量数据中发现<span class=\"blank\" onclick=\"revealBlank(this)\">patterns</span><span class=\"hint-text\">（模式）</span>和关系。",explanation:{title:"数据挖掘",content:"发现隐藏的知识。",analogy:"从矿山中开采宝石。"}}
            ]},
            {chapter:"5",name:"Chapter 5 电子表格",categories:["基本概念","功能特点","单元格操作","公式函数","数据处理","图表","高级功能"],cards:[
                {id:"5-1",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Spreadsheet</span><span class=\"hint-text\">（电子表格）</span>是由<span class=\"blank\" onclick=\"revealBlank(this)\">rows and columns</span><span class=\"hint-text\">（行和列）</span>组成的网格。",explanation:{title:"电子表格",content:"会计人员常用的工具。",analogy:"一张巨大的电子纸。"}},
                {id:"5-2",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cell</span><span class=\"hint-text\">（单元格）</span>是行和列的<span class=\"blank\" onclick=\"revealBlank(this)\">intersection</span><span class=\"hint-text\">（交叉点）</span>。",explanation:{title:"单元格",content:"存储数据的基本单位。",analogy:"一个小格子。"}},
                {id:"5-3",category:"基本概念",question:"单元格地址由<span class=\"blank\" onclick=\"revealBlank(this)\">column letter</span><span class=\"hint-text\">（列字母）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">row number</span><span class=\"hint-text\">（行号）</span>组成，如<span class=\"blank\" onclick=\"revealBlank(this)\">A1</span><span class=\"hint-text\">（A1）</span>。",explanation:{title:"单元格地址",content:"唯一标识单元格。",analogy:"地图上的坐标。"}},
                {id:"5-4",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Worksheet</span><span class=\"hint-text\">（工作表）</span>是电子表格中的一个<span class=\"blank\" onclick=\"revealBlank(this)\">page</span><span class=\"hint-text\">（页面）</span>。",explanation:{title:"工作表",content:"工作簿中的一页。",analogy:"一本书中的一页。"}},
                {id:"5-5",category:"基本概念",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Workbook</span><span class=\"hint-text\">（工作簿）</span>是包含多个<span class=\"blank\" onclick=\"revealBlank(this)\">worksheets</span><span class=\"hint-text\">（工作表）</span>的文件。",explanation:{title:"工作簿",content:"Excel文件。",analogy:"一本书。"}},
                {id:"5-6",category:"功能特点",question:"电子表格可以进行<span class=\"blank\" onclick=\"revealBlank(this)\">calculations</span><span class=\"hint-text\">（计算）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">sorting</span><span class=\"hint-text\">（排序）</span>、<span class=\"blank\" onclick=\"revealBlank(this)\">filtering</span><span class=\"hint-text\">（筛选）</span>和<span class=\"blank\" onclick=\"revealBlank(this)\">charting</span><span class=\"hint-text\">（制图）</span>。",explanation:{title:"电子表格功能",content:"多功能数据处理工具。",analogy:"超级计算器。"}},
                {id:"5-7",category:"单元格操作",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cell reference</span><span class=\"hint-text\">（单元格引用）</span>是在公式中引用其他<span class=\"blank\" onclick=\"revealBlank(this)\">cells</span><span class=\"hint-text\">（单元格）</span>。",explanation:{title:"单元格引用",content:"公式中使用其他单元格的值。",analogy:"在计算中使用其他格子的数据。"}},
                {id:"5-8",category:"单元格操作",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Absolute reference</span><span class=\"blank\" onclick=\"revealBlank(this)\">（绝对引用）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">$</span><span class=\"hint-text\">（$符号）</span>固定行或列，如<span class=\"blank\" onclick=\"revealBlank(this)\">$A$1</span><span class=\"hint-text\">（$A$1）</span>。",explanation:{title:"绝对引用",content:"复制公式时引用不变。",analogy:"固定引用某个单元格。"}},
                {id:"5-9",category:"单元格操作",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Relative reference</span><span class=\"hint-text\">（相对引用）</span>在复制公式时<span class=\"blank\" onclick=\"revealBlank(this)\">adjusts</span><span class=\"hint-text\">（调整）</span>引用。",explanation:{title:"相对引用",content:"复制时引用会变化。",analogy:"引用会跟着移动。"}},
                {id:"5-10",category:"单元格操作",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Mixed reference</span><span class=\"hint-text\">（混合引用）</span>固定行或列中的<span class=\"blank\" onclick=\"revealBlank(this)\">one</span><span class=\"hint-text\">（一个）</span>，如<span class=\"blank\" onclick=\"revealBlank(this)\">$A1</span><span class=\"hint-text\">（$A1）</span>。",explanation:{title:"混合引用",content:"固定列但不固定行。",analogy:"固定列，行可以变。"}},
                {id:"5-11",category:"公式函数",question:"公式以<span class=\"blank\" onclick=\"revealBlank(this)\">=</span><span class=\"hint-text\">（等号）</span>开头，如<span class=\"blank\" onclick=\"revealBlank(this)\">=A1+B1</span><span class=\"hint-text\">（=A1+B1）</span>。",explanation:{title:"公式格式",content:"告诉Excel要进行计算。",analogy:"计算器上的等号。"}},
                {id:"5-12",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">SUM</span><span class=\"hint-text\">（SUM函数）</span>用于<span class=\"blank\" onclick=\"revealBlank(this)\">adding numbers</span><span class=\"hint-text\">（求和）</span>。",explanation:{title:"SUM函数",content:"计算数字总和。",analogy:"把一列数字加起来。"}},
                {id:"5-13",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">AVERAGE</span><span class=\"hint-text\">（AVERAGE函数）</span>用于计算<span class=\"blank\" onclick=\"revealBlank(this)\">average</span><span class=\"hint-text\">（平均值）</span>。",explanation:{title:"AVERAGE函数",content:"计算算术平均值。",analogy:"计算平均成绩。"}},
                {id:"5-14",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">MAX</span><span class=\"hint-text\">（MAX函数）</span>返回一组数字中的<span class=\"blank\" onclick=\"revealBlank(this)\">maximum</span><span class=\"hint-text\">（最大值）</span>。",explanation:{title:"MAX函数",content:"找出最大值。",analogy:"找出最高分数。"}},
                {id:"5-15",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">MIN</span><span class=\"hint-text\">（MIN函数）</span>返回一组数字中的<span class=\"blank\" onclick=\"revealBlank(this)\">minimum</span><span class=\"hint-text\">（最小值）</span>。",explanation:{title:"MIN函数",content:"找出最小值。",analogy:"找出最低分数。"}},
                {id:"5-16",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">IF</span><span class=\"hint-text\">（IF函数）</span>根据条件返回不同的<span class=\"blank\" onclick=\"revealBlank(this)\">results</span><span class=\"hint-text\">（结果）</span>。",explanation:{title:"IF函数",content:"条件判断。",analogy:"如果成绩>=60，显示及格，否则显示不及格。"}},
                {id:"5-17",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">VLOOKUP</span><span class=\"hint-text\">（VLOOKUP函数）</span>用于垂直<span class=\"blank\" onclick=\"revealBlank(this)\">search</span><span class=\"hint-text\">（查找）</span>。",explanation:{title:"VLOOKUP函数",content:"在表格中查找数据。",analogy:"查字典。"}},
                {id:"5-18",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">HLOOKUP</span><span class=\"hint-text\">（HLOOKUP函数）</span>用于水平<span class=\"blank\" onclick=\"revealBlank(this)\">search</span><span class=\"hint-text\">（查找）</span>。",explanation:{title:"HLOOKUP函数",content:"在水平方向查找。",analogy:"横向查找数据。"}},
                {id:"5-19",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">COUNT</span><span class=\"hint-text\">（COUNT函数）</span>计算包含<span class=\"blank\" onclick=\"revealBlank(this)\">numbers</span><span class=\"hint-text\">（数字）</span>的单元格数量。",explanation:{title:"COUNT函数",content:"计数数字单元格。",analogy:"数有多少个数字。"}},
                {id:"5-20",category:"公式函数",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">COUNTA</span><span class=\"hint-text\">（COUNTA函数）</span>计算非<span class=\"blank\" onclick=\"revealBlank(this)\">empty</span><span class=\"hint-text\">（空）</span>单元格的数量。",explanation:{title:"COUNTA函数",content:"计数非空单元格。",analogy:"数有多少个格子填了东西。"}},
                {id:"5-21",category:"数据处理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Sorting</span><span class=\"hint-text\">（排序）</span>按升序或降序<span class=\"blank\" onclick=\"revealBlank(this)\">arrange data</span><span class=\"hint-text\">（排列数据）</span>。",explanation:{title:"排序",content:"整理数据顺序。",analogy:"按成绩从高到低排列。"}},
                {id:"5-22",category:"数据处理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Filtering</span><span class=\"hint-text\">（筛选）</span>显示满足条件的<span class=\"blank\" onclick=\"revealBlank(this)\">rows</span><span class=\"hint-text\">（行）</span>。",explanation:{title:"筛选",content:"只显示符合条件的数据。",analogy:"只看及格的成绩。"}},
                {id:"5-23",category:"数据处理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Pivot table</span><span class=\"hint-text\">（数据透视表）</span>用于快速汇总和分析<span class=\"blank\" onclick=\"revealBlank(this)\">large datasets</span><span class=\"hint-text\">（大型数据集）</span>。",explanation:{title:"数据透视表",content:"强大的数据汇总工具。",analogy:"快速分析销售数据。"}},
                {id:"5-24",category:"数据处理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Data validation</span><span class=\"hint-text\">（数据验证）</span>限制单元格中输入的<span class=\"blank\" onclick=\"revealBlank(this)\">data type</span><span class=\"hint-text\">（数据类型）</span>。",explanation:{title:"数据验证",content:"确保数据正确。",analogy:"只允许输入数字。"}},
                {id:"5-25",category:"图表",question:"电子表格可以创建各种<span class=\"blank\" onclick=\"revealBlank(this)\">charts</span><span class=\"hint-text\">（图表）</span>，如柱形图、折线图、饼图等。",explanation:{title:"图表功能",content:"数据可视化。",analogy:"用图表展示数据。"}},
                {id:"5-26",category:"图表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Bar chart</span><span class=\"hint-text\">（柱形图）</span>用于比较不同类别的<span class=\"blank\" onclick=\"revealBlank(this)\">values</span><span class=\"hint-text\">（值）</span>。",explanation:{title:"柱形图",content:"比较数据。",analogy:"比较不同产品的销售额。"}},
                {id:"5-27",category:"图表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Line chart</span><span class=\"hint-text\">（折线图）</span>用于显示数据随<span class=\"blank\" onclick=\"revealBlank(this)\">time</span><span class=\"hint-text\">（时间）</span>的变化趋势。",explanation:{title:"折线图",content:"显示趋势。",analogy:"显示销售额的变化趋势。"}},
                {id:"5-28",category:"图表",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Pie chart</span><span class=\"hint-text\">（饼图）</span>用于显示各部分占总体的<span class=\"blank\" onclick=\"revealBlank(this)\">proportion</span><span class=\"hint-text\">（比例）</span>。",explanation:{title:"饼图",content:"显示占比。",analogy:"显示各产品占总销售额的比例。"}},
                {id:"5-29",category:"高级功能",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Macros</span><span class=\"hint-text\">（宏）</span>是记录和回放一系列<span class=\"blank\" onclick=\"revealBlank(this)\">actions</span><span class=\"hint-text\">（操作）</span>的工具。",explanation:{title:"宏",content:"自动化重复任务。",analogy:"录制一个操作步骤，以后可以重复播放。"}},
                {id:"5-30",category:"高级功能",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Goal Seek</span><span class=\"hint-text\">（单变量求解）</span>用于找到使公式结果达到特定值的<span class=\"blank\" onclick=\"revealBlank(this)\">input value</span><span class=\"hint-text\">（输入值）</span>。",explanation:{title:"单变量求解",content:"反向计算。",analogy:"要达到目标利润，需要多少销售额。"}}
            ]}
        ,
            {chapter:"6",name:"Chapter 6 物料会计",categories:["订购流程","收货流程","发出流程","库存管理","库存控制","再订货点","经济订货量","库存估值"],cards:[
                {id:"6-1",category:"订购流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Purchase requisition</span><span class=\"hint-text\">（采购申请单）</span>是仓库部门向<span class=\"blank\" onclick=\"revealBlank(this)\">purchasing department</span><span class=\"hint-text\">（采购部门）</span>发出的一种内部文件，用于申请购买物料。",explanation:{title:"采购申请单",content:"当仓库发现某种物料库存不足时，会填写采购申请单给采购部门。",analogy:"就像你去仓库领东西，发现没有了，就写个条子让采购员去买。"}},
                {id:"6-2",category:"订购流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Purchase order (PO)</span><span class=\"hint-text\">（采购订单）</span>是发给供应商确认订单并要求供应商<span class=\"blank\" onclick=\"revealBlank(this)\">issue materials</span><span class=\"hint-text\">（发货）</span>的正式文件。",explanation:{title:"采购订单",content:"采购订单一式三份，分别发给供应商、财务部门和仓库。",analogy:"就像给供应商下正式的订单合同。"}},
                {id:"6-3",category:"收货流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Delivery note</span><span class=\"hint-text\">（送货单）</span>是供应商的仓库管理员为<span class=\"blank\" onclick=\"revealBlank(this)\">carrier</span><span class=\"hint-text\">（承运人）</span>签署的文件，用于确认物料已交付。",explanation:{title:"送货单",content:"送货单由供应商提供，用于核对送货数量和类型。",analogy:"就像快递的签收单，确认货物已送达。"}},
                {id:"6-4",category:"收货流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Goods received note (GRN)</span><span class=\"hint-text\">（收货单）</span>是仓库收到物料后准备的内部文件，用于更新<span class=\"blank\" onclick=\"revealBlank(this)\">inventory records</span><span class=\"hint-text\">（库存记录）</span>。",explanation:{title:"收货单",content:"收货单只记录数量，不记录金额。",analogy:"就像收货时填写的入库单，只记数量不计价。"}},
                {id:"6-5",category:"发出流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Materials requisition note</span><span class=\"hint-text\">（物料领用单）</span>是使用部门向仓库<span class=\"blank\" onclick=\"revealBlank(this)\">request materials</span><span class=\"hint-text\">（申请领用物料）</span>的正式文件。",explanation:{title:"物料领用单",content:"生产部门需要物料时填写此单据向仓库领料。",analogy:"就像你去仓库领东西需要填的领料单。"}},
                {id:"6-6",category:"发出流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Material transfer note</span><span class=\"hint-text\">（物料调拨单）</span>是证明物料从一个部门<span class=\"blank\" onclick=\"revealBlank(this)\">transferred</span><span class=\"hint-text\">（调拨）</span>到另一个部门的文件。",explanation:{title:"物料调拨单",content:"当部门之间需要转移物料时使用此单据。",analogy:"就像公司内部调货时填写的调拨单。"}},
                {id:"6-7",category:"发出流程",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Material returned note</span><span class=\"hint-text\">（物料退回单）</span>是用于记录物料<span class=\"blank\" onclick=\"revealBlank(this)\">returned</span><span class=\"hint-text\">（退回）</span>仓库的文件。",explanation:{title:"物料退回单",content:"生产部门多余物料或废料需要退回仓库时使用。",analogy:"就像把借来的东西还回去时签的还货单。"}},
                {id:"6-8",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Perpetual inventory</span><span class=\"hint-text\">（永续盘存）</span>是一种通过在<span class=\"blank\" onclick=\"revealBlank(this)\">receipts or issues</span><span class=\"hint-text\">（收到或发出时）</span>更新记录来追踪库存的系统。",explanation:{title:"永续盘存",content:"永续盘存能随时显示库存的余额。",analogy:"就像手机的银行APP，随时能看到余额。"}},
                {id:"6-9",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Stores ledger accounts</span><span class=\"hint-text\">（仓库分类账）</span>是记录物料<span class=\"blank\" onclick=\"revealBlank(this)\">receipts, issues and balance</span><span class=\"hint-text\">（入库、出库和余额）</span>的账户，包括数量和金额。",explanation:{title:"仓库分类账",content:"既记录数量又记录金额的库存明细账。",analogy:"就像仓库的财务账本，记录进出和余额。"}},
                {id:"6-10",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Bin cards</span><span class=\"hint-text\">（仓位卡）</span>是记录物料<span class=\"blank\" onclick=\"revealBlank(this)\">receipts, issues and balance</span><span class=\"hint-text\">（入库、出库和余额）</span>的卡片，只记录数量不记录金额。",explanation:{title:"仓位卡",content:"存放在仓库货架上的实物记录卡片。",analogy:"就像货架上的小标签，记录这个位置有多少货。"}},
                {id:"6-11",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Periodic stocktaking</span><span class=\"hint-text\">（定期盘点）</span>是在<span class=\"blank\" onclick=\"revealBlank(this)\">same date</span><span class=\"hint-text\">（相同日期）</span>（通常在会计期末）对所有库存项目进行盘点的方法。",explanation:{title:"定期盘点",content:"一年才盘点一次，可能发现不了平时的问题。",analogy:"就像一年才查一次账。"}},
                {id:"6-12",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Continuous stocktaking</span><span class=\"hint-text\">（持续盘点）</span>是一种在<span class=\"blank\" onclick=\"revealBlank(this)\">rotating basis</span><span class=\"hint-text\">（轮换基础上）</span>持续盘点选定库存项目的盘点方法。",explanation:{title:"持续盘点",content:"每天都有人盘点不同的物料，每年至少盘点一次每个项目。",analogy:"就像轮流值日，每天不同的人负责。"}},
                {id:"6-13",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Just-in-time (JIT)</span><span class=\"hint-text\">（准时制）</span>是一种只在<span class=\"blank\" onclick=\"revealBlank(this)\">needed</span><span class=\"hint-text\">（需要时）</span>才生产货物的库存管理系统。",explanation:{title:"准时制",content:"JIT的目标是消除大量库存，降低库存成本。",analogy:"就像点外卖，现点现做，不提前备货。"}},
                {id:"6-14",category:"库存控制",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Buffer inventory</span><span class=\"hint-text\">（缓冲库存/安全库存）</span>是为了应对<span class=\"blank\" onclick=\"revealBlank(this)\">emergencies</span><span class=\"hint-text\">（紧急情况）</span>和防止缺货而持有的基本库存水平。",explanation:{title:"缓冲库存",content:"就像家里常备的药品，以备不时之需。",analogy:"安全库存就是防止意外断货的保险。"}},
                {id:"6-15",category:"库存控制",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Stock out costs</span><span class=\"hint-text\">（缺货成本）</span>是因<span class=\"blank\" onclick=\"revealBlank(this)\">running out of inventory</span><span class=\"hint-text\">（库存耗尽）</span>而产生的成本，包括销售损失和客户流失。",explanation:{title:"缺货成本",content:"缺货可能导致客户转向竞争对手。",analogy:"就像商店缺货时，顾客去别家买了。"}},
                {id:"6-16",category:"库存控制",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Slow-moving stock</span><span class=\"hint-text\">（滞销库存）</span>是<span class=\"blank\" onclick=\"revealBlank(this)\">takes a long time</span><span class=\"hint-text\">（需要很长时间）</span>才能用完的库存类型。",explanation:{title:"滞销库存",content:"占用仓库空间但周转率低的库存。",analogy:"就像积压的货物，一直卖不出去。"}},
                {id:"6-17",category:"库存控制",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Obsolete stock</span><span class=\"hint-text\">（过期库存）</span>是已经<span class=\"blank\" onclick=\"revealBlank(this)\">out of date</span><span class=\"hint-text\">（过时）</span>且不再需要的库存。",explanation:{title:"过期库存",content:"可能需要计提减值准备或报废处理。",analogy:"就像过期的食品，只能扔掉。"}},
                {id:"6-18",category:"再订货点",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Reorder level</span><span class=\"hint-text\">（再订货点）</span>的计算公式是：最大用量 × <span class=\"blank\" onclick=\"revealBlank(this)\">maximum lead time</span><span class=\"hint-text\">（最大交货时间）</span>。",explanation:{title:"再订货点",content:"当库存降到这个水平时就需要下订单了。",analogy:"就像水壶的水用到一半时就知道要烧水了。"}},
                {id:"6-19",category:"再订货点",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Minimum stock level</span><span class=\"hint-text\">（最小库存水平）</span>的计算公式是：再订货点 - (平均用量 × 平均交货时间)。",explanation:{title:"最小库存水平",content:"库存不能低于这个水平，否则可能缺货。",analogy:"就像家里的米不能少于这个量。"}},
                {id:"6-20",category:"再订货点",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Maximum stock level</span><span class=\"hint-text\">（最大库存水平）</span>的计算公式是：再订货点 + 再订货量 - (最小用量 × 最小交货时间)。",explanation:{title:"最大库存水平",content:"库存不应超过这个水平，以避免过度囤积。",analogy:"就像冰箱不能塞太满。"}},
                {id:"6-21",category:"经济订货量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Economic order quantity (EOQ)</span><span class=\"hint-text\">（经济订货量）</span>是使总库存成本<span class=\"blank\" onclick=\"revealBlank(this)\">minimum</span><span class=\"hint-text\">（最小化）</span>的订货量。",explanation:{title:"经济订货量",content:"EOQ公式：√(2×订单成本×需求量/持有成本)。",analogy:"找到订货成本和持有成本的最佳平衡点。"}},
                {id:"6-22",category:"经济订货量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Holding costs</span><span class=\"hint-text\">（持有成本）</span>是保持库存在<span class=\"blank\" onclick=\"revealBlank(this)\">storage</span><span class=\"hint-text\">（储存）</span>地点的成本，包括资本利息、仓储成本和保险费用。",explanation:{title:"持有成本",content:"库存越多，持有成本越高。",analogy:"就像租仓库存放货物要付租金。"}},
                {id:"6-23",category:"经济订货量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Ordering costs</span><span class=\"hint-text\">（订货成本）</span>是每次<span class=\"blank\" onclick=\"revealBlank(this)\">placing an order</span><span class=\"hint-text\">（下订单）</span>时产生的成本，包括行政成本和运输成本。",explanation:{title:"订货成本",content:"订货次数越多，订货成本越高。",analogy:"每次采购都要花时间精力去联系供应商。"}},
                {id:"6-24",category:"经济订货量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Purchase costs</span><span class=\"hint-text\">（采购成本）</span>是向供应商<span class=\"blank\" onclick=\"revealBlank(this)\">buying materials</span><span class=\"hint-text\">（购买物料）</span>时支付的成本。",explanation:{title:"采购成本",content:"采购成本通常与采购数量成正比。",analogy:"买东西花的钱。"}},
                {id:"6-25",category:"经济订货量",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Economic batch quantity (EBQ)</span><span class=\"hint-text\">（经济批量）</span>是用于<span class=\"blank\" onclick=\"revealBlank(this)\">manufacturing</span><span class=\"hint-text\">（制造）</span>以逐步补充物料需求的批量。",explanation:{title:"经济批量",content:"EOQ是外部采购，EBQ是内部生产。",analogy:"EOQ是买，EBQ是自己生产。"}},
                {id:"6-26",category:"库存估值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">FIFO (First-In-First-Out)</span><span class=\"hint-text\">（先进先出）</span>方法假设货物按<span class=\"blank\" onclick=\"revealBlank(this)\">order of receipt</span><span class=\"hint-text\">（接收顺序）</span>发出，最新价格留在库存中。",explanation:{title:"先进先出法",content:"IAS2允许使用，物价上涨时利润较高。",analogy:"就像超市卖食品，先进货的先卖。"}},
                {id:"6-27",category:"库存估值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">LIFO (Last-In-First-Out)</span><span class=\"hint-text\">（后进先出）</span>方法假设货物按<span class=\"blank\" onclick=\"revealBlank(this)\">reverse order</span><span class=\"hint-text\">（相反顺序）</span>发出，最早价格留在库存中。",explanation:{title:"后进先出法",content:"IAS2不允许使用，物价上涨时利润较低。",analogy:"就像拿东西时拿最上面的。"}},
                {id:"6-28",category:"库存估值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Weighted average (AVCO)</span><span class=\"hint-text\">（加权平均法）</span>使用<span class=\"blank\" onclick=\"revealBlank(this)\">units as weights</span><span class=\"hint-text\">（单位数量作为权重）</span>来确定平均单位成本。",explanation:{title:"加权平均法",content:"IAS2允许使用，将所有进货的平均价格作为成本。",analogy:"就像算平均成绩，所有分数加起来除以数量。"}},
                {id:"6-29",category:"库存估值",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Specific identification</span><span class=\"hint-text\">（具体辨认法）</span>是识别每一项库存并按其<span class=\"blank\" onclick=\"revealBlank(this)\">specific cost</span><span class=\"hint-text\">（特定成本）</span>计价的方法。",explanation:{title:"具体辨认法",content:"适用于独特或高价值物品。",analogy:"就像卖车，每辆车都有特定的价格。"}},
                {id:"6-30",category:"库存管理",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Cost ledger</span><span class=\"hint-text\">（成本分类账）</span>是记录<span class=\"blank\" onclick=\"revealBlank(this)\">costing purposes</span><span class=\"hint-text\">（成本核算目的）</span>的账户系统，不包括银行和固定资产。",explanation:{title:"成本分类账",content:"用于成本核算的内部账户系统。",analogy:"就像公司的内部账本，与外部财务账分开。"}}
            ]},
            {chapter:"7",name:"Chapter 7 人工会计",categories:["薪酬制度","直接间接人工","人工周转率","效率比率","分录处理"],cards:[
                {id:"7-1",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Piecework system</span><span class=\"hint-text\">（计件工资制）</span>是根据<span class=\"blank\" onclick=\"revealBlank(this)\">units produced</span><span class=\"hint-text\">（生产数量）</span>计算工资的方法：工资 = 产量 × 单件工资率。",explanation:{title:"计件工资制",content:"员工按完成的产量获得报酬，多劳多得。",analogy:"就像送外卖按单数算钱，送一单拿一单的钱。"}},
                {id:"7-2",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Time-based system</span><span class=\"hint-text\">（计时工资制）</span>是根据<span class=\"blank\" onclick=\"revealBlank(this)\">hours worked</span><span class=\"hint-text\">（工作时间）</span>计算工资的方法：工资 = 工时 × 小时工资率。",explanation:{title:"计时工资制",content:"员工按工作小时数获得报酬。",analogy:"就像按小时收费的家教，工作一小时拿一小时的钱。"}},
                {id:"7-3",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Overtime premium</span><span class=\"hint-text\">（加班津贴）</span>是超过基本工作时间工作时，按<span class=\"blank\" onclick=\"revealBlank(this)\">higher rate</span><span class=\"hint-text\">（更高比率）</span>支付的额外报酬。",explanation:{title:"加班津贴",content:"加班工资通常比正常工资高，如1.5倍工资。",analogy:"就像周末加班要给双倍工资。"}},
                {id:"7-4",category:"薪酬制度",question:"<span class=\"blank\" onclick=\"revealBlank(this)\">Bonus payment</span><span class=\"hint-text\">（奖金）</span>是超出基本工资的额外报酬，用于奖励<span class=\"blank\" onclick=\"revealBlank(this)\">achieving targets</span><span class=\"hint-text\">（达成目标）</span>。",explanation:{title:"奖金",content:"达到或超过某些目标时支付的额外奖励。",analogy:"就像完成销售任务后拿的提成。"}},
